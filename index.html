<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stocky</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f472b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stocky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
[x-cloak]{display:none!important}
body{-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top)}
.pb-safe{padding-bottom:env(safe-area-inset-bottom)}
button:active{transform:scale(.96)}
</style>
</head>
<body class="min-h-screen transition-colors duration-200" :class="ui.body" x-data="app" x-cloak>

<!-- ตั้งค่าครั้งแรก -->
<template x-if="!ready">
<div class="max-w-md mx-auto p-5 space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold">🐰 Stocky</h1>
    <div class="flex gap-1.5">
      <template x-for="t in themes" :key="t.k">
        <button type="button" @click="setTheme(t.k)" class="w-7 h-7 rounded-full border-2" :class="[t.dot, theme===t.k?'border-slate-900 dark:border-white scale-110':'border-transparent opacity-60']" :title="t.n"></button>
      </template>
    </div>
  </div>
  <p class="text-sm opacity-75">ตั้งค่าครั้งแรก: ใส่รหัสบ้าน (อย่างน้อย 8 ตัวอักษร) และวาง Firebase Config</p>
  <label class="block text-sm font-medium">รหัสบ้าน (ยาวอย่างน้อย 8 ตัวอักษร)
    <input x-model="setup.code" placeholder="home-secret-9988" class="mt-1 w-full rounded-2xl border p-3.5 outline-none" :class="ui.input"></label>
  <label class="block text-sm font-medium">Firebase Config
    <textarea x-model="setup.cfg" rows="7" placeholder='{ apiKey: "...", authDomain: "...", databaseURL: "https://xxx-default-rtdb.firebaseio.com", projectId: "...", appId: "..." }' class="mt-1 w-full rounded-2xl border p-3.5 font-mono text-xs outline-none" :class="ui.input"></textarea></label>
  <p class="text-red-500 text-sm font-medium" x-text="setup.err"></p>
  <button type="button" @click="saveSetup()" class="w-full py-4 rounded-2xl font-bold text-lg shadow-sm" :class="ui.primary">เริ่มใช้งาน</button>
</div>
</template>

<template x-if="ready">
<div class="pb-36">
  <!-- HEADER -->
  <header class="sticky top-0 z-20 backdrop-blur border-b px-4 py-3 flex items-center justify-between" :class="ui.header">
    <div class="flex items-center gap-2">
      <span class="font-bold text-lg" :class="ui.accentText">🐰 Stocky</span>
      <span class="text-xs px-2 py-0.5 rounded-full font-medium" :class="ui.pill" x-text="{inv:'สต็อกของใช้',shop:'รายการต้องซื้อ',set:'ตั้งค่า'}[tab]"></span>
    </div>
    <span class="text-xs flex items-center gap-1.5 font-medium" :class="online?'text-emerald-600 dark:text-emerald-400':'opacity-60'">
      <i class="w-2 h-2 rounded-full" :class="online?'bg-emerald-500':'bg-slate-400'"></i>
      <span x-text="online?'ออนไลน์':'ออฟไลน์'"></span>
    </span>
  </header>

  <!-- INVENTORY -->
  <section x-show="tab==='inv'" class="p-3 space-y-3 max-w-2xl mx-auto">
    <div class="relative">
      <input x-model="q" type="search" placeholder="🔍 ค้นหาชื่อสินค้า หรือเลขบาร์โค้ด..." class="w-full rounded-2xl border pl-4 pr-9 py-3 outline-none" :class="ui.input">
      <button type="button" x-show="q" @click="q=''" class="absolute right-3 top-1/2 -translate-y-1/2 opacity-60 text-sm px-1">✕</button>
    </div>

    <!-- หมวดหมู่ -->
    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
      <button type="button" @click="cat='all'" class="shrink-0 px-3.5 py-2 rounded-full text-sm font-medium border transition" :class="cat==='all'?ui.chipActive:ui.chip">ทั้งหมด</button>
      <template x-for="c in cats" :key="c.k">
        <button type="button" @click="cat=c.k" class="shrink-0 px-3.5 py-2 rounded-full text-sm font-medium border transition" :class="cat===c.k?ui.chipActive:ui.chip" x-text="c.e+' '+c.n"></button>
      </template>
    </div>

    <!-- ตัวกรองสถานะ -->
    <div class="grid grid-cols-4 gap-1.5">
      <button type="button" @click="st='all'" class="py-2 rounded-xl text-xs font-semibold border transition" :class="st==='all'?ui.chipActive:ui.chip">ทั้งหมด</button>
      <template x-for="s in sts" :key="s.k">
        <button type="button" @click="st=s.k" class="py-2 rounded-xl text-xs font-semibold border transition" :class="st===s.k?(s.bg+' text-white border-transparent shadow-sm'):ui.chip" x-text="s.n"></button>
      </template>
    </div>

    <p x-show="!filtered.length" class="text-center opacity-60 py-14 text-sm">ยังไม่มีสินค้าในหมวดนี้ กดปุ่ม ＋ ด้านล่างเพื่อเพิ่มได้เลย</p>

    <template x-for="c in cats" :key="c.k">
      <div x-show="byCat(c.k).length" class="space-y-2">
        <div class="flex items-center justify-between pt-1">
          <h2 class="font-bold text-sm opacity-80" x-text="c.e+' '+c.n"></h2>
          <span class="text-xs opacity-55" x-text="byCat(c.k).length+' รายการ'"></span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          <template x-for="i in byCat(c.k)" :key="i.id">
            <div class="rounded-2xl border p-3 border-l-4 flex flex-col justify-between gap-2.5 shadow-xs transition" :class="[ui.card, stOf(i).bd]">
              <!-- ส่วนบน: รูป + ชื่อ + เวลาแกะใช้ -->
              <div class="flex gap-2.5 items-start cursor-pointer" @click="edit(i)">
                <div class="w-13 h-13 w-14 h-14 shrink-0 rounded-xl flex items-center justify-center text-2xl overflow-hidden border" :class="ui.thumb">
                  <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" loading="lazy" alt=""></template>
                  <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
                </div>
                <div class="min-w-0 flex-1">
                  <p class="font-semibold text-sm leading-snug break-words line-clamp-2" x-text="i.name"></p>
                  <p class="text-[11px] opacity-60 mt-0.5" x-text="i.lastOpened?'แกะ '+ago(i.lastOpened):'ยังไม่แกะ'"></p>
                  <p x-show="i.price>0" class="text-[11px] opacity-65 mt-0.5">฿<span x-text="fmt(i.price)"></span></p>
                </div>
              </div>

              <!-- ไฟจราจร 3 ระดับ -->
              <div class="grid grid-cols-3 gap-1">
                <template x-for="s in sts" :key="s.k">
                  <button type="button" @click="save(i.id,{status:s.k})" class="h-8 rounded-lg text-[11px] font-semibold transition" :class="(i.status||'high')===s.k?(s.bg+' text-white ring-2 ring-offset-1 '+ui.ring):(s.bg+' text-white/80 opacity-25 hover:opacity-50')" x-text="s.n"></button>
                </template>
              </div>

              <!-- จำนวนคงเหลือ +/- -->
              <div class="flex items-center justify-between gap-1">
                <button type="button" @click="dec(i)" class="w-10 h-10 rounded-xl text-lg font-bold flex items-center justify-center border" :class="ui.stepBtn">−</button>
                <div class="text-center leading-none">
                  <span class="text-lg font-bold" x-text="i.qty||0"></span>
                  <span x-show="i.min>0" class="block text-[10px] opacity-55 mt-0.5">ขั้นต่ำ <span x-text="i.min"></span></span>
                </div>
                <button type="button" @click="save(i.id,{qty:(i.qty||0)+1})" class="w-10 h-10 rounded-xl text-lg font-bold flex items-center justify-center border" :class="ui.stepBtn">＋</button>
              </div>

              <!-- ปุ่มเข้าลิสต์ซื้อ -->
              <button type="button" @click="save(i.id,{onList:!i.onList,buy:i.buy||1})" class="w-full py-2 rounded-xl text-xs font-semibold border transition" :class="onList(i)?'bg-amber-400/20 border-amber-400 text-amber-700 dark:text-amber-300':ui.softBtn" x-text="onList(i)?'🛒 อยู่ในลิสต์ ('+(i.buy||1)+')':'＋ เพิ่มลิสต์ซื้อ'"></button>
            </div>
          </template>
        </div>
      </div>
    </template>
  </section>

  <!-- SHOPPING -->
  <section x-show="tab==='shop'" class="p-3 space-y-3 max-w-2xl mx-auto">
    <div class="rounded-2xl p-4 shadow-sm space-y-2" :class="ui.primary">
      <div class="grid grid-cols-2 gap-3 text-center">
        <div class="rounded-xl bg-black/10 p-2.5">
          <p class="text-xs opacity-90">งบรวมทั้งลิสต์</p>
          <p class="text-2xl font-bold mt-0.5">฿<span x-text="fmt(total)"></span></p>
        </div>
        <div class="rounded-xl bg-black/10 p-2.5">
          <p class="text-xs opacity-90">เฉพาะที่ติ๊กแล้ว (<span x-text="shopList.filter(x=>x.inCart).length"></span>/<span x-text="shopList.length"></span>)</p>
          <p class="text-2xl font-bold mt-0.5">฿<span x-text="fmt(totalChecked)"></span></p>
        </div>
      </div>
      <div x-show="shopList.length" class="flex justify-end gap-2 pt-1">
        <button type="button" @click="toggleAllCart(true)" class="text-xs px-2.5 py-1 rounded-lg bg-black/15 hover:bg-black/25">ติ๊กทั้งหมด</button>
        <button type="button" @click="toggleAllCart(false)" class="text-xs px-2.5 py-1 rounded-lg bg-black/15 hover:bg-black/25">ล้างติ๊ก</button>
      </div>
    </div>

    <p x-show="!shopList.length" class="text-center opacity-60 py-14 text-sm">ไม่มีของที่ต้องซื้อในตอนนี้ 🎉</p>

    <div class="space-y-2">
      <template x-for="i in shopList" :key="i.id">
        <div class="rounded-2xl border p-3 flex items-center gap-3 shadow-xs transition" :class="[ui.card, i.inCart&&'opacity-60']">
          <input type="checkbox" :checked="!!i.inCart" @change="save(i.id,{inCart:$event.target.checked})" class="w-6 h-6 rounded shrink-0 cursor-pointer" :class="ui.accentCheck">
          <div class="w-12 h-12 shrink-0 rounded-xl flex items-center justify-center text-xl overflow-hidden border" :class="ui.thumb">
            <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" alt=""></template>
            <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-sm leading-snug break-words" :class="i.inCart&&'line-through'" x-text="i.name"></p>
            <p class="text-xs opacity-65 mt-0.5">คงเหลือ <span x-text="i.qty||0"></span> · ฿<span x-text="fmt(i.price||0)"></span>/ชิ้น</p>
            <p class="text-xs font-semibold mt-0.5" :class="ui.accentText">รวม ฿<span x-text="fmt((i.price||0)*(i.buy||1))"></span></p>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" @click="save(i.id,{buy:Math.max(1,(i.buy||1)-1)})" class="w-9 h-9 rounded-xl border font-bold" :class="ui.stepBtn">−</button>
            <span class="w-6 text-center font-bold text-sm" x-text="i.buy||1"></span>
            <button type="button" @click="save(i.id,{buy:(i.buy||1)+1})" class="w-9 h-9 rounded-xl border font-bold" :class="ui.stepBtn">＋</button>
          </div>
        </div>
      </template>
    </div>

    <select @change="if($event.target.value){save($event.target.value,{onList:true,buy:1});$event.target.value=''}" class="w-full rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input">
      <option value="">＋ เพิ่มรายการจากสต็อกเข้าลิสต์ช้อปปิ้ง…</option>
      <template x-for="i in list.filter(x=>!onList(x))" :key="i.id">
        <option :value="i.id" x-text="i.name"></option>
      </template>
    </select>

    <button type="button" @click="restock()" :disabled="!shopList.some(i=>i.inCart)" class="w-full py-4 rounded-2xl disabled:opacity-40 font-bold text-base shadow-sm" :class="ui.primary">✅ ยืนยันการซื้อและเติมสต็อก (Restock)</button>
  </section>

  <!-- SETTINGS -->
  <section x-show="tab==='set'" class="p-3 space-y-3 max-w-2xl mx-auto">
    <!-- เลือกธีม -->
    <div class="rounded-2xl border p-4 space-y-3 shadow-xs" :class="ui.card">
      <div>
        <p class="font-bold">ธีมสีแอป (Theme)</p>
        <p class="text-xs opacity-65">เลือกโทนสีที่ชอบหรือเหมาะกับแสงรอบตัว</p>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <template x-for="t in themes" :key="t.k">
          <button type="button" @click="setTheme(t.k)" class="flex items-center gap-2.5 p-3 rounded-xl border text-left font-medium text-sm transition" :class="theme===t.k?ui.chipActive:ui.chip">
            <span class="w-5 h-5 rounded-full shrink-0 border border-black/15" :class="t.dot"></span>
            <span x-text="t.n"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- รหัสบ้าน -->
    <div class="rounded-2xl border p-4 space-y-2.5 shadow-xs" :class="ui.card">
      <p class="font-bold">รหัสบ้าน (ใช้ร่วมกัน 2–3 คน)</p>
      <input x-model="setup.code" class="w-full rounded-xl border p-3 outline-none" :class="ui.input">
      <div class="flex gap-2">
        <button type="button" @click="navigator.clipboard.writeText(code).then(()=>flash('คัดลอกรหัสบ้านแล้ว'))" class="flex-1 py-3 rounded-xl border font-medium text-sm" :class="ui.softBtn">📋 คัดลอกรหัส</button>
        <button type="button" @click="saveSetup()" class="flex-1 py-3 rounded-xl font-semibold text-sm" :class="ui.primary">บันทึก/เปลี่ยนรหัส</button>
      </div>
    </div>

    <!-- Firebase Config -->
    <div class="rounded-2xl border p-4 space-y-2.5 shadow-xs" :class="ui.card">
      <p class="font-bold">Firebase Config</p>
      <textarea x-model="setup.cfg" rows="6" class="w-full rounded-xl border p-3 font-mono text-xs outline-none" :class="ui.input"></textarea>
      <p class="text-red-500 text-sm" x-text="setup.err"></p>
      <button type="button" @click="saveSetup()" class="w-full py-3 rounded-xl font-semibold text-sm" :class="ui.primary">บันทึก Config</button>
    </div>

    <!-- สำรองข้อมูล -->
    <div class="rounded-2xl border p-4 space-y-2.5 shadow-xs" :class="ui.card">
      <p class="font-bold">สำรองข้อมูล (.json)</p>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" @click="exportJson()" class="py-3 rounded-xl border font-medium text-sm" :class="ui.softBtn">⬇️ Export JSON</button>
        <label class="py-3 rounded-xl border font-medium text-sm text-center cursor-pointer" :class="ui.softBtn">⬆️ Import JSON
          <input type="file" accept=".json,application/json" class="hidden" @change="importJson($event)">
        </label>
      </div>
      <p class="text-xs opacity-60">Import จะเขียนทับรายการสินค้าทั้งหมดในรหัสบ้านนี้</p>
    </div>
  </section>

  <!-- ปุ่มลอย -->
  <div x-show="tab==='inv'" class="fixed right-4 bottom-24 z-20 flex flex-col gap-3" style="margin-bottom:env(safe-area-inset-bottom)">
    <button type="button" @click="openScan()" class="w-14 h-14 rounded-full text-2xl shadow-lg flex items-center justify-center border" :class="ui.fabSec" title="สแกนบาร์โค้ด">📷</button>
    <button type="button" @click="add()" class="w-14 h-14 rounded-full text-3xl shadow-lg flex items-center justify-center font-bold" :class="ui.primary" title="เพิ่มสินค้า">＋</button>
  </div>

  <!-- แท็บบาร์ -->
  <nav class="fixed bottom-0 inset-x-0 z-30 border-t grid grid-cols-3 pb-safe" :class="ui.nav">
    <button type="button" @click="tab='inv'" class="py-2.5 text-xs font-medium flex flex-col items-center gap-0.5" :class="tab==='inv'?ui.navActive:'opacity-65'"><span class="text-lg">📦</span><span>สต็อก</span></button>
    <button type="button" @click="tab='shop'" class="py-2.5 text-xs font-medium flex flex-col items-center gap-0.5 relative" :class="tab==='shop'?ui.navActive:'opacity-65'"><span class="text-lg">🛒</span><span>ต้องซื้อ</span>
      <span x-show="shopList.length" class="absolute top-1.5 right-[26%] min-w-5 h-5 px-1 rounded-full bg-red-500 text-white text-[11px] font-bold flex items-center justify-center" x-text="shopList.length"></span></button>
    <button type="button" @click="tab='set'" class="py-2.5 text-xs font-medium flex flex-col items-center gap-0.5" :class="tab==='set'?ui.navActive:'opacity-65'"><span class="text-lg">⚙️</span><span>ตั้งค่า</span></button>
  </nav>

  <!-- ฟอร์มสินค้า -->
  <div x-show="!!f" class="fixed inset-0 z-40 bg-black/60 flex items-end justify-center" @click.self="f=null">
    <div x-if="!!f" class="w-full max-w-xl max-h-[92vh] overflow-y-auto rounded-t-3xl border-t p-4 space-y-3 pb-safe" :class="ui.modal">
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-lg" x-text="f && f.id ? 'แก้ไขสินค้า' : 'เพิ่มสินค้าใหม่'"></h3>
          <button type="button" @click="f=null" class="w-8 h-8 rounded-full flex items-center justify-center opacity-70">✕</button>
        </div>
        <input x-model="f.name" placeholder="ชื่อสินค้า เช่น โฟมล้างหน้า *" class="w-full rounded-xl border p-3 outline-none" :class="ui.input">
        <select x-model="f.cat" class="w-full rounded-xl border p-3 outline-none" :class="ui.input">
          <template x-for="c in cats" :key="c.k">
            <option :value="c.k" x-text="c.e+' '+c.n"></option>
          </template>
        </select>
        <div class="flex gap-2">
          <input x-model="f.barcode" placeholder="บาร์โค้ด (สแกนหรือพิมพ์)" inputmode="numeric" class="flex-1 min-w-0 rounded-xl border p-3 outline-none" :class="ui.input">
          <button type="button" @click="openScan(true)" class="px-4 rounded-xl border text-lg" :class="ui.softBtn">📷</button>
        </div>
        <div class="flex gap-3 items-center">
          <div class="w-16 h-16 shrink-0 rounded-xl flex items-center justify-center text-2xl overflow-hidden border" :class="ui.thumb">
            <template x-if="f && f.img"><img :src="f.img" class="w-full h-full object-cover" alt=""></template>
            <template x-if="f && !f.img"><span x-text="catOf(f.cat).e"></span></template>
          </div>
          <div class="flex-1 space-y-2 min-w-0">
            <input x-model="f.imgUrl" @change="urlImg()" placeholder="วางลิงก์รูปภาพ (URL)" class="w-full rounded-xl border p-2.5 text-sm outline-none" :class="ui.input">
            <div class="flex gap-2">
              <label class="flex-1 text-center py-2 rounded-xl border text-xs font-medium cursor-pointer" :class="ui.softBtn">📸 ถ่าย/เลือกรูป
                <input type="file" accept="image/*" class="hidden" @change="pickImg($event)">
              </label>
              <button type="button" x-show="f && f.img" @click="f.img='';f.imgUrl=''" class="px-3 rounded-xl border text-xs" :class="ui.softBtn">ลบรูป</button>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <label class="font-medium">คงเหลือ
            <input x-model.number="f.qty" type="number" min="0" inputmode="numeric" class="mt-1 w-full rounded-xl border p-3 text-base outline-none" :class="ui.input">
          </label>
          <label class="font-medium">จุดสั่งซื้อขั้นต่ำ
            <input x-model.number="f.min" type="number" min="0" inputmode="numeric" class="mt-1 w-full rounded-xl border p-3 text-base outline-none" :class="ui.input">
          </label>
          <label class="font-medium">ราคา/ชิ้น (฿)
            <input x-model.number="f.price" type="number" min="0" inputmode="decimal" class="mt-1 w-full rounded-xl border p-3 text-base outline-none" :class="ui.input">
          </label>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <template x-for="s in sts" :key="s.k">
            <button type="button" @click="f.status=s.k" class="py-3 rounded-xl text-xs font-bold text-white transition" :class="s.bg+(f.status===s.k?' ring-2 ring-offset-2 '+ui.ring:' opacity-35')" x-text="s.n"></button>
          </template>
        </div>
        <div class="flex gap-2 pt-1">
          <button type="button" x-show="f && f.id" @click="del()" class="px-4 py-3.5 rounded-xl border border-red-400 text-red-500 font-semibold">🗑</button>
          <button type="button" @click="f=null" class="flex-1 py-3.5 rounded-xl border font-semibold" :class="ui.softBtn">ยกเลิก</button>
          <button type="button" @click="commit()" class="flex-[2] py-3.5 rounded-xl font-bold shadow-sm" :class="ui.primary">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <!-- สแกนเนอร์ -->
  <div x-show="scan" class="fixed inset-0 z-50 bg-black flex flex-col p-4 gap-3">
    <div id="reader" class="w-full rounded-2xl overflow-hidden bg-black"></div>
    <p class="text-white text-center text-sm" x-text="scanMsg"></p>
    <button type="button" @click="closeScan()" class="mt-auto py-4 rounded-2xl bg-white text-slate-900 font-bold">ปิดกล้อง</button>
  </div>

  <!-- ผลสแกนเจอสินค้าเดิม -->
  <div x-show="hit" class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center" @click.self="hit=null">
    <template x-if="hit&&items[hit]">
      <div class="w-full max-w-xl rounded-t-3xl border-t p-5 space-y-4 pb-safe" :class="ui.modal">
        <div>
          <p class="text-xs opacity-60">พบสินค้าในสต็อก</p>
          <p class="text-xl font-bold" x-text="items[hit].name"></p>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <template x-for="s in sts" :key="s.k">
            <button type="button" @click="save(hit,{status:s.k})" class="py-3.5 rounded-xl text-xs font-bold text-white" :class="s.bg+((items[hit].status||'high')===s.k?' ring-2 ring-offset-2 '+ui.ring:' opacity-35')" x-text="s.n"></button>
          </template>
        </div>
        <div class="flex items-center justify-center gap-6 py-1">
          <button type="button" @click="dec({id:hit,...items[hit]})" class="w-16 h-16 rounded-2xl border text-3xl font-bold" :class="ui.stepBtn">−</button>
          <span class="text-4xl font-bold" x-text="items[hit].qty||0"></span>
          <button type="button" @click="save(hit,{qty:(items[hit].qty||0)+1})" class="w-16 h-16 rounded-2xl border text-3xl font-bold" :class="ui.stepBtn">＋</button>
        </div>
        <button type="button" @click="hit=null" class="w-full py-4 rounded-2xl font-bold" :class="ui.primary">เสร็จสิ้น</button>
      </div>
    </template>
  </div>

  <!-- Toast -->
  <div x-show="toast" x-transition class="fixed top-16 inset-x-0 z-50 flex justify-center pointer-events-none px-4">
    <span class="px-4 py-2 rounded-full bg-slate-900 text-white text-sm font-medium shadow-md" x-text="toast"></span>
  </div>
</div>
</template>

<script type="module">
import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/module.esm.min.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,update,set,push} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const DEFAULT_CFG = {
  apiKey: "AIzaSyAHIOVYr_gM6SY10P9h5IL3caL1KTxU5e8",
  authDomain: "stocky-d77a4.firebaseapp.com",
  databaseURL: "https://stocky-d77a4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stocky-d77a4",
  storageBucket: "stocky-d77a4.firebasestorage.app",
  messagingSenderId: "267051208812",
  appId: "1:267051208812:web:e3a13bd142f05707758849"
};

const THEMES = {
  pink: {
    isDark: false,
    metaColor: '#f472b6',
    body: 'bg-pink-50 text-slate-800',
    header: 'bg-pink-50/90 border-pink-200/80',
    card: 'bg-white border-pink-100',
    modal: 'bg-white border-pink-100 text-slate-800',
    nav: 'bg-white/95 border-pink-200/80',
    navActive: 'text-pink-500 font-bold',
    primary: 'bg-pink-500 hover:bg-pink-600 text-white',
    accentText: 'text-pink-600',
    accentCheck: 'accent-pink-500',
    pill: 'bg-pink-100 text-pink-700',
    chip: 'bg-white border-pink-200/80 text-slate-700',
    chipActive: 'bg-pink-500 border-pink-500 text-white',
    input: 'bg-white border-pink-200 text-slate-800 focus:border-pink-400',
    thumb: 'bg-pink-50 border-pink-100',
    stepBtn: 'bg-pink-50/80 border-pink-200/70 text-slate-800',
    softBtn: 'bg-pink-50/60 border-pink-200 text-slate-700',
    fabSec: 'bg-white border-pink-200 text-slate-800',
    ring: 'ring-pink-400'
  },
  blue: {
    isDark: false,
    metaColor: '#3b82f6',
    body: 'bg-sky-50 text-slate-800',
    header: 'bg-sky-50/90 border-sky-200/80',
    card: 'bg-white border-sky-100',
    modal: 'bg-white border-sky-100 text-slate-800',
    nav: 'bg-white/95 border-sky-200/80',
    navActive: 'text-blue-600 font-bold',
    primary: 'bg-blue-600 hover:bg-blue-700 text-white',
    accentText: 'text-blue-600',
    accentCheck: 'accent-blue-600',
    pill: 'bg-sky-100 text-blue-700',
    chip: 'bg-white border-sky-200/80 text-slate-700',
    chipActive: 'bg-blue-600 border-blue-600 text-white',
    input: 'bg-white border-sky-200 text-slate-800 focus:border-blue-400',
    thumb: 'bg-sky-50 border-sky-100',
    stepBtn: 'bg-sky-50/80 border-sky-200/70 text-slate-800',
    softBtn: 'bg-sky-50/60 border-sky-200 text-slate-700',
    fabSec: 'bg-white border-sky-200 text-slate-800',
    ring: 'ring-blue-400'
  },
  emerald: {
    isDark: false,
    metaColor: '#10b981',
    body: 'bg-emerald-50/70 text-slate-800',
    header: 'bg-emerald-50/90 border-emerald-200/80',
    card: 'bg-white border-emerald-100',
    modal: 'bg-white border-emerald-100 text-slate-800',
    nav: 'bg-white/95 border-emerald-200/80',
    navActive: 'text-emerald-600 font-bold',
    primary: 'bg-emerald-600 hover:bg-emerald-700 text-white',
    accentText: 'text-emerald-600',
    accentCheck: 'accent-emerald-600',
    pill: 'bg-emerald-100 text-emerald-700',
    chip: 'bg-white border-emerald-200/80 text-slate-700',
    chipActive: 'bg-emerald-600 border-emerald-600 text-white',
    input: 'bg-white border-emerald-200 text-slate-800 focus:border-emerald-400',
    thumb: 'bg-emerald-50 border-emerald-100',
    stepBtn: 'bg-emerald-50/80 border-emerald-200/70 text-slate-800',
    softBtn: 'bg-emerald-50/60 border-emerald-200 text-slate-700',
    fabSec: 'bg-white border-emerald-200 text-slate-800',
    ring: 'ring-emerald-400'
  },
  dark: {
    isDark: true,
    metaColor: '#09090b',
    body: 'bg-zinc-950 text-zinc-100',
    header: 'bg-zinc-950/90 border-zinc-800',
    card: 'bg-zinc-900 border-zinc-800',
    modal: 'bg-zinc-900 border-zinc-800 text-zinc-100',
    nav: 'bg-zinc-950/95 border-zinc-800',
    navActive: 'text-pink-400 font-bold',
    primary: 'bg-pink-500 hover:bg-pink-600 text-white',
    accentText: 'text-pink-400',
    accentCheck: 'accent-pink-500',
    pill: 'bg-zinc-800 text-zinc-200',
    chip: 'bg-zinc-900 border-zinc-800 text-zinc-300',
    chipActive: 'bg-zinc-100 border-zinc-100 text-zinc-950',
    input: 'bg-zinc-900 border-zinc-700 text-zinc-100 focus:border-pink-400',
    thumb: 'bg-zinc-800 border-zinc-700',
    stepBtn: 'bg-zinc-800 border-zinc-700 text-zinc-100',
    softBtn: 'bg-zinc-800/80 border-zinc-700 text-zinc-200',
    fabSec: 'bg-zinc-800 border-zinc-700 text-zinc-100',
    ring: 'ring-zinc-400 ring-offset-zinc-900'
  }
};

let db = null;
const L = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

Alpine.data('app', () => ({
  tab:'inv',
  theme: localStorage.getItem('stocky_theme') || 'pink',
  code: localStorage.getItem('roomCode') || '',
  cfg: L('fbcfg') || DEFAULT_CFG,
  ready:false, online:false,
  items:{}, q:'', cat:'all', st:'all',
  f:null, scan:false, scanMsg:'', scanForForm:false, _handlingScan:false,
  hit:null, toast:'', scanner:null,
  setup:{code:'', cfg:'', err:''},
  themes:[
    {k:'pink', n:'ชมพูหวาน', dot:'bg-pink-400'},
    {k:'blue', n:'ฟ้าสดใส', dot:'bg-blue-500'},
    {k:'emerald', n:'เขียวสบายตา', dot:'bg-emerald-500'},
    {k:'dark', n:'โหมดดำเข้ม', dot:'bg-zinc-900'}
  ],
  cats:[
    {k:'bath',n:'ห้องน้ำ',e:'🛁'},
    {k:'clean',n:'ซักรีด/ทำความสะอาด',e:'🧺'},
    {k:'skin',n:'สกินแคร์/ของใช้ส่วนตัว',e:'🧴'},
    {k:'food',n:'ของกิน/ครัว',e:'🍳'},
    {k:'other',n:'อื่นๆ',e:'📦'}
  ],
  sts:[
    {k:'high',n:'มีเยอะ',bg:'bg-emerald-500',bd:'border-emerald-500'},
    {k:'mid',n:'เหลือครึ่ง',bg:'bg-amber-400',bd:'border-amber-400'},
    {k:'low',n:'ใกล้หมด',bg:'bg-red-500',bd:'border-red-500'}
  ],

  get ui(){ return THEMES[this.theme] || THEMES.pink; },

  applyThemeClass(){
    const isDark = !!this.ui.isDark;
    document.documentElement.classList.toggle('dark', isDark);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', this.ui.metaColor);
  },

  setTheme(k){
    if(!THEMES[k]) return;
    this.theme = k;
    localStorage.setItem('stocky_theme', k);
    this.applyThemeClass();
    this.flash('เปลี่ยนธีมเป็น ' + (this.themes.find(x=>x.k===k)?.n || k));
  },

  init(){
    this.applyThemeClass();
    this.setup.code = this.code;
    this.setup.cfg = this.cfg ? JSON.stringify(this.cfg, null, 1) : '';
    if(!this.code || !this.cfg) return;
    this.items = L('cache_' + this.code) || {};
    this.ready = true;
    try{
      db = getDatabase(initializeApp(this.cfg));
      onValue(ref(db, '.info/connected'), s => this.online = !!s.val());
      onValue(ref(db, this.base() + 'items'), s => {
        this.items = s.val() || {};
        localStorage.setItem('cache_' + this.code, JSON.stringify(this.items));
      }, e => this.flash('อ่านข้อมูลไม่ได้: ' + e.code));
    }catch(e){
      this.flash('Firebase config ผิดพลาด');
    }
  },

  base(){ return 'households/' + this.code + '/'; },
  flash(m){ this.toast = m; clearTimeout(this._t); this._t = setTimeout(() => this.toast = '', 2200); },
  parseCfg(s){
    const m = s.match(/\{[^{}]*apiKey[^{}]*\}/);
    if(!m) throw Error('ไม่พบ apiKey ใน config');
    return new Function('return ' + m[0])();
  },
  saveSetup(){
    try{
      const code = this.setup.code.trim();
      if(!code) throw Error('กรอกรหัสบ้าน');
      if(code.length < 8) throw Error('รหัสบ้านต้องยาวอย่างน้อย 8 ตัวอักษร');
      if(/[.#$\[\]\/]/.test(code)) throw Error('รหัสบ้านห้ามมี . # $ [ ] /');
      const cfg = this.setup.cfg.trim() ? this.parseCfg(this.setup.cfg) : DEFAULT_CFG;
      if(!cfg || !cfg.databaseURL) throw Error('Config ต้องมี databaseURL');
      localStorage.setItem('roomCode', code);
      localStorage.setItem('fbcfg', JSON.stringify(cfg));
      location.reload();
    }catch(e){
      this.setup.err = e.message || 'Config ไม่ถูกต้อง';
    }
  },

  get list(){ return Object.entries(this.items).map(([id, v]) => ({id, ...v})); },
  get filtered(){
    const q = this.q.trim().toLowerCase();
    return this.list
      .filter(i =>
        (this.cat === 'all' || (i.cat || 'other') === this.cat) &&
        (this.st === 'all' || (i.status || 'high') === this.st) &&
        (!q || (i.name || '').toLowerCase().includes(q) || String(i.barcode || '').includes(q))
      )
      .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));
  },
  byCat(k){ return this.filtered.filter(i => (i.cat || 'other') === k); },
  catOf(k){ return this.cats.find(c => c.k === k) || this.cats[4]; },
  stOf(i){ return this.sts.find(s => s.k === (i.status || 'high')) || this.sts[0]; },
  onList(i){ return i.status === 'low' || !!i.onList || (Number(i.min) > 0 && Number(i.qty || 0) <= Number(i.min)); },
  get shopList(){
    return this.list
      .filter(i => this.onList(i))
      .sort((a, b) => !!a.inCart - !!b.inCart || (a.name || '').localeCompare(b.name || '', 'th'));
  },
  get total(){ return this.shopList.reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.buy) || 1), 0); },
  get totalChecked(){ return this.shopList.filter(i => i.inCart).reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.buy) || 1), 0); },
  fmt(n){ return Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: 2}); },
  ago(t){ const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'วันนี้' : d + ' วันก่อน'; },

  save(id, patch){ update(ref(db, this.base() + 'items/' + id), patch).catch(e => this.flash('บันทึกไม่ได้: ' + e.code)); },
  dec(i){ const q = Math.max(0, (Number(i.qty) || 0) - 1); this.save(i.id, {qty: q, lastOpened: Date.now()}); },
  add(pre = {}){ this.f = {name:'', cat:'other', barcode:'', img:'', imgUrl:'', qty:1, min:0, price:0, status:'high', ...pre}; },
  edit(i){ this.f = {...i, imgUrl: /^https?:/.test(i.img || '') ? i.img : ''}; },
  commit(){
    const f = this.f;
    if(!f || !f.name || !f.name.trim()) return this.flash('ใส่ชื่อสินค้าก่อน');
    const data = {
      name: f.name.trim(),
      cat: f.cat || 'other',
      barcode: String(f.barcode || '').trim(),
      img: f.img || '',
      qty: Number(f.qty) || 0,
      min: Number(f.min) || 0,
      price: Number(f.price) || 0,
      status: f.status || 'high'
    };
    if(f.id) this.save(f.id, data);
    else set(push(ref(db, this.base() + 'items')), {...data, buy: 1, createdAt: Date.now()});
    this.f = null;
  },
  del(){
    if(confirm('ลบสินค้านี้?')){
      set(ref(db, this.base() + 'items/' + this.f.id), null);
      this.f = null;
    }
  },
  toggleAllCart(val){
    const up = {};
    this.shopList.forEach(i => { up[i.id + '/inCart'] = !!val; });
    if(Object.keys(up).length) update(ref(db, this.base() + 'items'), up);
  },
  restock(){
    const up = {};
    this.shopList.filter(i => i.inCart).forEach(i => {
      const p = i.id + '/';
      up[p + 'qty'] = (Number(i.qty) || 0) + (Number(i.buy) || 1);
      up[p + 'status'] = 'high';
      up[p + 'onList'] = false;
      up[p + 'inCart'] = false;
      up[p + 'buy'] = 1;
    });
    update(ref(db, this.base() + 'items'), up).then(() => this.flash('เติมสต็อกแล้ว ✅'));
  },

  // รูปภาพ
  urlImg(){ if(this.f) this.f.img = (this.f.imgUrl || '').trim(); },
  pickImg(ev){
    const file = ev.target.files[0];
    if(!file || !this.f) return;
    const img = new Image();
    img.onload = () => {
      const S = 200, c = document.createElement('canvas'), x = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      const sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.width = c.height = Math.min(S, m);
      x.drawImage(img, sx, sy, m, m, 0, 0, c.width, c.height);
      this.f.img = c.toDataURL('image/jpeg', 0.6);
      this.f.imgUrl = '';
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    ev.target.value = '';
  },

  // บาร์โค้ด
  openScan(forForm = false){
    this.scanForForm = forForm;
    this.scan = true;
    this.scanMsg = 'เล็งบาร์โค้ดให้อยู่ในกรอบ';
    this._handlingScan = false;
    this.$nextTick(async () => {
      try{
        this.scanner = new Html5Qrcode('reader');
        await this.scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: {width: 260, height: 140}}, code => this.onScan(code), () => {});
      }catch(e){
        this.scanMsg = 'เปิดกล้องไม่ได้ (ต้องเปิดผ่าน https และอนุญาตกล้อง)';
      }
    });
  },
  async closeScan(){
    const sc = this.scanner;
    this.scanner = null;
    this.scan = false;
    try{ if(sc){ await sc.stop(); await sc.clear(); } }catch{}
  },
  async onScan(rawCode){
    if(this._handlingScan) return;
    this._handlingScan = true;
    const code = String(rawCode || '').trim();
    await this.closeScan();
    if(!code){ this._handlingScan = false; return; }
    if(this.scanForForm && this.f){ this.f.barcode = code; this._handlingScan = false; return; }
    const found = this.list.find(i => String(i.barcode || '').trim() === code);
    if(found){
      this.$nextTick(() => { this.hit = found.id; this._handlingScan = false; });
    }else{
      this.flash('ไม่พบบาร์โค้ด ' + code + ' ในสต็อก');
      this.add({barcode: code});
      this._handlingScan = false;
    }
  },

  // สำรองข้อมูล
  exportJson(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({version: 1, exportedAt: new Date().toISOString(), items: this.items}, null, 1)], {type: 'application/json'}));
    a.download = 'stocky-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
  },
  importJson(ev){
    const file = ev.target.files[0];
    if(!file) return;
    file.text().then(t => {
      const d = JSON.parse(t);
      if(!d.items) throw Error();
      if(!confirm('เขียนทับสินค้าทั้งหมดด้วยไฟล์นี้?')) return;
      return set(ref(db, this.base() + 'items'), d.items).then(() => this.flash('นำเข้าสำเร็จ'));
    }).catch(() => this.flash('ไฟล์ไม่ถูกต้อง'));
    ev.target.value = '';
  }
}));
Alpine.start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
