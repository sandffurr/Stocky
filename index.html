<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stocky</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f9a8d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stocky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'media'}</script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>[x-cloak]{display:none!important}body{-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top)}.pb-safe{padding-bottom:env(safe-area-inset-bottom)}button:active{transform:scale(.95)}</style>
</head>
<body class="bg-pink-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen" x-data="app" x-cloak>

<!-- ตั้งค่าครั้งแรก -->
<template x-if="!ready">
<div class="max-w-md mx-auto p-5 space-y-4">
  <h1 class="text-2xl font-bold">🐰 Stocky</h1>
  <p class="text-sm opacity-70">ตั้งค่าครั้งแรก: ใส่รหัสบ้าน (อย่างน้อย 8 ตัวอักษร) และวาง Firebase Config</p>
  <label class="block text-sm font-medium">รหัสบ้าน (ตั้งให้ยาว เดายาก อย่างน้อย 8 ตัว)
    <input x-model="setup.code" placeholder="home-secret-9988" class="mt-1 w-full rounded-xl border p-3 dark:bg-slate-800 dark:border-slate-700"></label>
  <label class="block text-sm font-medium">Firebase Config (วาง object ทั้งก้อนได้เลย)
    <textarea x-model="setup.cfg" rows="8" placeholder='{ apiKey: "...", authDomain: "...", databaseURL: "https://xxx-default-rtdb.firebaseio.com", projectId: "...", appId: "..." }' class="mt-1 w-full rounded-xl border p-3 font-mono text-xs dark:bg-slate-800 dark:border-slate-700"></textarea></label>
  <p class="text-red-500 text-sm" x-text="setup.err"></p>
  <button type="button" @click="saveSetup()" class="w-full py-4 rounded-2xl bg-pink-400 text-white font-bold text-lg">เริ่มใช้งาน</button>
</div>
</template>

<template x-if="ready">
<div class="pb-36">
  <header class="sticky top-0 z-20 bg-pink-50/90 dark:bg-slate-900/90 backdrop-blur border-b dark:border-slate-800 px-4 py-3 flex items-center justify-between">
    <h1 class="font-bold text-lg"><span class="text-pink-500">🐰 Stocky</span> <span class="text-sm font-normal opacity-60" x-text="{inv:'สต็อกของใช้',shop:'ต้องซื้อ',set:'ตั้งค่า'}[tab]"></span></h1>
    <span class="text-xs flex items-center gap-1"><i class="w-2 h-2 rounded-full" :class="online?'bg-green-500':'bg-slate-400'"></i><span x-text="online?'ออนไลน์':'ออฟไลน์'"></span></span>
  </header>

  <!-- INVENTORY -->
  <section x-show="tab==='inv'" class="p-3 space-y-3">
    <input x-model="q" type="search" placeholder="🔍 ค้นหาชื่อ / บาร์โค้ด" class="w-full rounded-xl border p-3 dark:bg-slate-800 dark:border-slate-700">
    <div class="flex gap-2 overflow-x-auto pb-1">
      <button type="button" @click="cat='all'" class="shrink-0 px-3 py-2 rounded-full text-sm border" :class="cat==='all'&&'bg-slate-800 text-white dark:bg-white dark:text-slate-900'">ทั้งหมด</button>
      <template x-for="c in cats" :key="c.k"><button type="button" @click="cat=c.k" class="shrink-0 px-3 py-2 rounded-full text-sm border" :class="cat===c.k&&'bg-slate-800 text-white dark:bg-white dark:text-slate-900'" x-text="c.e+' '+c.n"></button></template>
    </div>
    <div class="flex gap-2">
      <button type="button" @click="st='all'" class="flex-1 py-2 rounded-xl text-sm border" :class="st==='all'&&'bg-slate-800 text-white dark:bg-white dark:text-slate-900'">ทุกสถานะ</button>
      <template x-for="s in sts" :key="s.k"><button type="button" @click="st=s.k" class="flex-1 py-2 rounded-xl text-sm border" :class="st===s.k&&(s.bg+' text-white border-transparent')" x-text="s.n"></button></template>
    </div>
    <p x-show="!filtered.length" class="text-center opacity-50 py-12">ยังไม่มีสินค้า กด ＋ เพื่อเพิ่ม</p>
    <template x-for="c in cats" :key="c.k">
      <div x-show="byCat(c.k).length">
        <h2 class="font-semibold text-sm opacity-70 mb-2 mt-2" x-text="c.e+' '+c.n"></h2>
        <div class="grid grid-cols-2 gap-3">
          <template x-for="i in byCat(c.k)" :key="i.id">
            <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-3 border-l-4 space-y-2" :class="stOf(i).bd">
              <div class="flex gap-2 items-center cursor-pointer" @click="edit(i)">
                <div class="w-14 h-14 shrink-0 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-2xl overflow-hidden">
                  <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" loading="lazy" alt=""></template>
                  <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
                </div>
                <div class="min-w-0"><p class="font-semibold leading-tight break-words" x-text="i.name"></p>
                  <p class="text-[11px] opacity-60" x-text="i.lastOpened?'แกะล่าสุด '+ago(i.lastOpened):'ยังไม่เคยแกะ'"></p></div>
              </div>
              <div class="flex gap-1">
                <template x-for="s in sts" :key="s.k"><button type="button" @click="save(i.id,{status:s.k})" class="flex-1 h-9 rounded-lg" :class="(i.status||'high')===s.k?s.bg+' ring-2 ring-offset-1 ring-slate-400 dark:ring-offset-slate-800':s.bg+' opacity-25'" :aria-label="s.n"></button></template>
              </div>
              <div class="flex items-center justify-between">
                <button type="button" @click="dec(i)" class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-700 text-xl font-bold">−</button>
                <span class="text-xl font-bold" x-text="i.qty||0"></span>
                <button type="button" @click="save(i.id,{qty:(i.qty||0)+1})" class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-700 text-xl font-bold">＋</button>
              </div>
              <button type="button" @click="save(i.id,{onList:!i.onList,buy:i.buy||1})" class="w-full py-1.5 rounded-lg text-xs border" :class="onList(i)&&'bg-amber-100 dark:bg-amber-900/40'" x-text="onList(i)?'🛒 อยู่ในลิสต์ซื้อ':'＋ เพิ่มลิสต์ซื้อ'"></button>
            </div>
          </template>
        </div>
      </div>
    </template>
  </section>

  <!-- SHOPPING -->
  <section x-show="tab==='shop'" class="p-3 space-y-3">
    <div class="rounded-2xl bg-pink-400 text-white p-4 grid grid-cols-2 gap-2 text-center">
      <div><p class="text-xs opacity-80">งบรวมทั้งลิสต์</p><p class="text-2xl font-bold">฿<span x-text="fmt(total)"></span></p></div>
      <div><p class="text-xs opacity-80">เฉพาะที่ติ๊กแล้ว</p><p class="text-2xl font-bold">฿<span x-text="fmt(totalChecked)"></span></p></div>
    </div>
    <p x-show="!shopList.length" class="text-center opacity-50 py-12">ไม่มีของที่ต้องซื้อ 🎉</p>
    <template x-for="i in shopList" :key="i.id">
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-3 flex items-center gap-3" :class="i.inCart&&'opacity-60'">
        <input type="checkbox" :checked="!!i.inCart" @change="save(i.id,{inCart:$event.target.checked})" class="w-7 h-7 accent-pink-400 shrink-0">
        <div class="w-12 h-12 shrink-0 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-xl overflow-hidden">
          <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" alt=""></template><template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template></div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold leading-tight break-words" :class="i.inCart&&'line-through'" x-text="i.name"></p>
          <p class="text-xs opacity-60">เหลือ <span x-text="i.qty||0"></span> · ฿<span x-text="fmt(i.price||0)"></span>/ชิ้น = ฿<span x-text="fmt((i.price||0)*(i.buy||1))"></span></p>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" @click="save(i.id,{buy:Math.max(1,(i.buy||1)-1)})" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-700 font-bold">−</button>
          <span class="w-6 text-center font-bold" x-text="i.buy||1"></span>
          <button type="button" @click="save(i.id,{buy:(i.buy||1)+1})" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-700 font-bold">＋</button>
        </div>
      </div>
    </template>
    <select @change="if($event.target.value){save($event.target.value,{onList:true,buy:1});$event.target.value=''}" class="w-full rounded-xl border p-3 dark:bg-slate-800 dark:border-slate-700">
      <option value="">＋ เพิ่มรายการจากสต็อกเข้าลิสต์…</option>
      <template x-for="i in list.filter(x=>!onList(x))" :key="i.id"><option :value="i.id" x-text="i.name"></option></template>
    </select>
    <button type="button" @click="restock()" :disabled="!shopList.some(i=>i.inCart)" class="w-full py-4 rounded-2xl bg-pink-400 disabled:opacity-40 text-white font-bold text-lg">✅ ยืนยันการซื้อ (Restock)</button>
  </section>

  <!-- SETTINGS -->
  <section x-show="tab==='set'" class="p-3 space-y-4">
    <div class="rounded-2xl bg-white dark:bg-slate-800 p-4 space-y-2">
      <p class="font-semibold">รหัสบ้าน (อย่างน้อย 8 ตัวอักษร)</p>
      <input x-model="setup.code" class="w-full rounded-xl border p-3 dark:bg-slate-900 dark:border-slate-700">
      <div class="flex gap-2">
        <button type="button" @click="navigator.clipboard.writeText(code).then(()=>flash('คัดลอกแล้ว'))" class="flex-1 py-3 rounded-xl border">📋 คัดลอก</button>
        <button type="button" @click="saveSetup()" class="flex-1 py-3 rounded-xl bg-pink-400 text-white">เปลี่ยนรหัส</button></div>
    </div>
    <div class="rounded-2xl bg-white dark:bg-slate-800 p-4 space-y-2">
      <p class="font-semibold">Firebase Config</p>
      <textarea x-model="setup.cfg" rows="6" class="w-full rounded-xl border p-3 font-mono text-xs dark:bg-slate-900 dark:border-slate-700"></textarea>
      <p class="text-red-500 text-sm" x-text="setup.err"></p>
      <button type="button" @click="saveSetup()" class="w-full py-3 rounded-xl bg-pink-400 text-white">บันทึก Config</button>
    </div>
    <div class="rounded-2xl bg-white dark:bg-slate-800 p-4 space-y-2">
      <p class="font-semibold">สำรองข้อมูล (.json)</p>
      <button type="button" @click="exportJson()" class="w-full py-3 rounded-xl border">⬇️ Export</button>
      <label class="block w-full py-3 rounded-xl border text-center cursor-pointer">⬆️ Import<input type="file" accept=".json,application/json" class="hidden" @change="importJson($event)"></label>
      <p class="text-xs opacity-60">Import จะเขียนทับสินค้าทั้งหมดในบ้านนี้</p>
    </div>
  </section>

  <!-- ปุ่มลอย -->
  <div x-show="tab==='inv'" class="fixed right-4 bottom-24 z-20 flex flex-col gap-3" style="margin-bottom:env(safe-area-inset-bottom)">
    <button type="button" @click="openScan()" class="w-14 h-14 rounded-full bg-slate-800 dark:bg-white dark:text-slate-900 text-white text-2xl shadow-lg">📷</button>
    <button type="button" @click="add()" class="w-14 h-14 rounded-full bg-pink-400 text-white text-3xl shadow-lg">＋</button>
  </div>

  <!-- แท็บบาร์ -->
  <nav class="fixed bottom-0 inset-x-0 z-30 bg-white dark:bg-slate-900 border-t dark:border-slate-800 grid grid-cols-3 pb-safe">
    <button type="button" @click="tab='inv'" class="py-3 text-sm" :class="tab==='inv'&&'text-pink-400 font-bold'">📦<br>สต็อก</button>
    <button type="button" @click="tab='shop'" class="py-3 text-sm relative" :class="tab==='shop'&&'text-pink-400 font-bold'">🛒<br>ต้องซื้อ
      <span x-show="shopList.length" class="absolute top-1 left-1/2 ml-2 min-w-5 h-5 px-1 rounded-full bg-red-500 text-white text-xs flex items-center justify-center" x-text="shopList.length"></span></button>
    <button type="button" @click="tab='set'" class="py-3 text-sm" :class="tab==='set'&&'text-pink-400 font-bold'">⚙️<br>ตั้งค่า</button>
  </nav>

  <!-- ฟอร์มสินค้า -->
  <div x-show="!!f" class="fixed inset-0 z-40 bg-black/50 flex items-end" @click.self="f=null">
    <div x-if="!!f" class="w-full max-h-[92vh] overflow-y-auto rounded-t-3xl bg-white dark:bg-slate-800 p-4 space-y-3 pb-safe">
      <div class="space-y-3">
        <h3 class="font-bold text-lg" x-text="f && f.id ? 'แก้ไขสินค้า' : 'เพิ่มสินค้าใหม่'"></h3>
        <input x-model="f.name" placeholder="ชื่อสินค้า *" class="w-full rounded-xl border p-3 dark:bg-slate-900 dark:border-slate-700">
        <select x-model="f.cat" class="w-full rounded-xl border p-3 dark:bg-slate-900 dark:border-slate-700">
          <template x-for="c in cats" :key="c.k">
            <option :value="c.k" x-text="c.e+' '+c.n"></option>
          </template>
        </select>
        <div class="flex gap-2">
          <input x-model="f.barcode" placeholder="บาร์โค้ด" inputmode="numeric" class="flex-1 min-w-0 rounded-xl border p-3 dark:bg-slate-900 dark:border-slate-700">
          <button type="button" @click="openScan(true)" class="px-4 rounded-xl border">📷</button>
        </div>
        <div class="flex gap-2 items-center">
          <div class="w-16 h-16 shrink-0 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-2xl overflow-hidden">
            <template x-if="f && f.img"><img :src="f.img" class="w-full h-full object-cover" alt=""></template>
            <template x-if="f && !f.img"><span x-text="catOf(f.cat).e"></span></template>
          </div>
          <div class="flex-1 space-y-2 min-w-0">
            <input x-model="f.imgUrl" @change="urlImg()" placeholder="ลิงก์รูป (URL)" class="w-full rounded-xl border p-2 text-sm dark:bg-slate-900 dark:border-slate-700">
            <div class="flex gap-2">
              <label class="flex-1 text-center py-2 rounded-xl border text-sm cursor-pointer">📸 ถ่าย/เลือกรูป
                <input type="file" accept="image/*" class="hidden" @change="pickImg($event)">
              </label>
              <button type="button" x-show="f && f.img" @click="f.img='';f.imgUrl=''" class="px-3 rounded-xl border text-sm">ลบ</button>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <label>คงเหลือ
            <input x-model.number="f.qty" type="number" min="0" inputmode="numeric" class="w-full rounded-xl border p-3 text-base dark:bg-slate-900 dark:border-slate-700">
          </label>
          <label>จุดสั่งซื้อขั้นต่ำ
            <input x-model.number="f.min" type="number" min="0" inputmode="numeric" class="w-full rounded-xl border p-3 text-base dark:bg-slate-900 dark:border-slate-700">
          </label>
          <label>ราคา/ชิ้น (฿)
            <input x-model.number="f.price" type="number" min="0" inputmode="decimal" class="w-full rounded-xl border p-3 text-base dark:bg-slate-900 dark:border-slate-700">
          </label>
        </div>
        <div class="flex gap-2">
          <template x-for="s in sts" :key="s.k">
            <button type="button" @click="f.status=s.k" class="flex-1 py-3 rounded-xl text-sm text-white" :class="s.bg+(f.status===s.k?' ring-2 ring-offset-2 ring-slate-500':' opacity-30')" x-text="s.n"></button>
          </template>
        </div>
        <div class="flex gap-2">
          <button type="button" x-show="f && f.id" @click="del()" class="px-4 py-3 rounded-xl border border-red-400 text-red-500">🗑</button>
          <button type="button" @click="f=null" class="flex-1 py-3 rounded-xl border">ยกเลิก</button>
          <button type="button" @click="commit()" class="flex-[2] py-3 rounded-xl bg-pink-400 text-white font-bold">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <!-- สแกนเนอร์ -->
  <div x-show="scan" class="fixed inset-0 z-50 bg-black flex flex-col p-4 gap-3">
    <div id="reader" class="w-full rounded-xl overflow-hidden bg-black"></div>
    <p class="text-white text-center text-sm" x-text="scanMsg"></p>
    <button type="button" @click="closeScan()" class="mt-auto py-4 rounded-2xl bg-white text-black font-bold">ปิดกล้อง</button>
  </div>

  <!-- ผลสแกนเจอสินค้าเดิม -->
  <div x-show="hit" class="fixed inset-0 z-50 bg-black/60 flex items-end" @click.self="hit=null">
    <template x-if="hit&&items[hit]"><div class="w-full rounded-t-3xl bg-white dark:bg-slate-800 p-5 space-y-4 pb-safe">
      <p class="text-xs opacity-60">พบในสต็อก</p>
      <p class="text-xl font-bold" x-text="items[hit].name"></p>
      <div class="flex gap-2"><template x-for="s in sts" :key="s.k"><button type="button" @click="save(hit,{status:s.k})" class="flex-1 py-4 rounded-xl text-white" :class="s.bg+((items[hit].status||'high')===s.k?' ring-2 ring-offset-2 ring-slate-500':' opacity-30')" x-text="s.n"></button></template></div>
      <div class="flex items-center justify-center gap-6">
        <button type="button" @click="dec({id:hit,...items[hit]})" class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-700 text-3xl">−</button>
        <span class="text-4xl font-bold" x-text="items[hit].qty||0"></span>
        <button type="button" @click="save(hit,{qty:(items[hit].qty||0)+1})" class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-700 text-3xl">＋</button></div>
      <button type="button" @click="hit=null" class="w-full py-4 rounded-2xl bg-pink-400 text-white font-bold">เสร็จ</button>
    </div></template>
  </div>

  <div x-show="toast" x-transition class="fixed top-16 inset-x-0 z-50 flex justify-center pointer-events-none"><span class="px-4 py-2 rounded-full bg-slate-800 text-white text-sm shadow" x-text="toast"></span></div>
</div>
</template>

<script type="module">
import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/module.esm.min.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,update,set,push} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// วาง firebaseConfig ตรงนี้ได้เลย (หรือกรอกในหน้าตั้งค่า)
const DEFAULT_CFG = {
  apiKey: "AIzaSyAHIOVYr_gM6SY10P9h5IL3caL1KTxU5e8",
  authDomain: "stocky-d77a4.firebaseapp.com",
  databaseURL: "https://stocky-d77a4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stocky-d77a4",
  storageBucket: "stocky-d77a4.firebasestorage.app",
  messagingSenderId: "267051208812",
  appId: "1:267051208812:web:e3a13bd142f05707758849"
};

let db = null;
const L = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

Alpine.data('app', () => ({
  tab:'inv', code: localStorage.getItem('roomCode')||'', cfg: L('fbcfg')||DEFAULT_CFG, ready:false, online:false,
  items:{}, q:'', cat:'all', st:'all', f:null, scan:false, scanMsg:'', scanForForm:false, hit:null, toast:'', scanner:null,
  setup:{code:'', cfg:'', err:''},
  cats:[{k:'bath',n:'ห้องน้ำ',e:'🛁'},{k:'clean',n:'ซักรีด/ทำความสะอาด',e:'🧺'},{k:'skin',n:'สกินแคร์/ของใช้ส่วนตัว',e:'🧴'},{k:'food',n:'ของกิน/ครัว',e:'🍳'},{k:'other',n:'อื่นๆ',e:'📦'}],
  sts:[{k:'high',n:'มีเยอะ',bg:'bg-emerald-500',bd:'border-emerald-500'},{k:'mid',n:'เหลือครึ่ง',bg:'bg-yellow-400',bd:'border-yellow-400'},{k:'low',n:'ใกล้หมด',bg:'bg-red-500',bd:'border-red-500'}],

  init(){
    this.setup.code=this.code; this.setup.cfg=this.cfg?JSON.stringify(this.cfg,null,1):'';
    if(!this.code||!this.cfg) return;
    this.items=L('cache_'+this.code)||{}; this.ready=true;
    try{
      db=getDatabase(initializeApp(this.cfg));
      onValue(ref(db,'.info/connected'),s=>this.online=!!s.val());
