<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stocky</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fdf2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stocky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
[x-cloak]{display:none!important}
html,body{
  -webkit-tap-highlight-color:transparent;
  touch-action:pan-x pan-y;
}
button,a,input,select,label{touch-action:pan-x pan-y}
/* iOS จะซูมเองเมื่อโฟกัสช่องที่ตัวอักษร <16px จึงบังคับ 16px บนมือถือ */
@media (max-width:640px){
  input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]):not([type=range]),select,textarea{font-size:16px!important}
}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
.pb-safe{padding-bottom:env(safe-area-inset-bottom)}
button{transition:transform .14s cubic-bezier(.34,1.56,.64,1),background-color .15s,opacity .15s}
button:active{transform:scale(.94)}
.dot-bg{
  background-image:radial-gradient(var(--dot-color, rgba(244,114,182,.22)) 1.25px, transparent 1.25px);
  background-size:18px 18px;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}
.sparkle{animation:floatUp .95s ease-out forwards}
</style>
</head>
<body class="min-h-screen dot-bg transition-colors duration-200 selection:bg-pink-300/40" :class="ui.body" :style="ui.dotStyle" x-data="app" x-cloak>

<!-- ตั้งค่าครั้งแรก -->
<template x-if="!ready">
<div class="max-w-md mx-auto p-5 space-y-4" style="padding-top:calc(1.25rem + env(safe-area-inset-top))">
  <div class="flex items-center justify-between pt-2">
    <div class="flex items-center gap-2.5">
      <img src="icon-180.png" alt="Stocky" class="w-10 h-10 rounded-2xl object-cover shadow-xs">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Stocky</h1>
        <p class="text-xs opacity-65">ผู้ช่วยเช็กสต็อกของใช้ในบ้าน</p>
      </div>
    </div>
    <div class="flex gap-1.5">
      <template x-for="t in themes" :key="t.k">
        <button type="button" @click="setTheme(t.k)" class="w-7 h-7 rounded-full border-2" :class="[t.dot, theme===t.k?'border-slate-900 dark:border-white scale-110':'border-transparent opacity-70']" :title="t.n"></button>
      </template>
    </div>
  </div>

  <div class="rounded-3xl border p-4 space-y-3 shadow-xs" :class="ui.card">
    <p class="text-sm font-semibold">เริ่มต้นใช้งาน 1 นาที ✨</p>
    <label class="block text-xs font-medium opacity-80">ตั้งรหัสบ้าน (ยาวอย่างน้อย 8 ตัวอักษร เพื่อแชร์ข้อมูลกับคนในบ้าน)
      <input x-model="setup.code" placeholder="พิมพ์เอง หรือกดปุ่มสุ่มด้านล่าง" class="mt-1.5 w-full rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input">
    </label>
    <button type="button" @click="setup.code=genCode()" class="w-full py-2.5 rounded-2xl border text-xs font-semibold" :class="ui.softBtn">🎲 สุ่มรหัสบ้านที่เดายาก</button>
    <details class="rounded-2xl border p-3 text-xs" :class="ui.softBtn">
      <summary class="cursor-pointer font-semibold opacity-80">⚙️ ตั้งค่า Firebase Config (ใช้ค่าเริ่มต้นได้เลย)</summary>
      <textarea x-model="setup.cfg" rows="6" placeholder='{ apiKey: "...", databaseURL: "..." }' class="mt-2 w-full rounded-xl border p-2.5 font-mono text-[11px] outline-none" :class="ui.input"></textarea>
    </details>
    <p x-show="setup.err" class="text-red-500 text-xs font-semibold" x-text="setup.err"></p>
    <button type="button" @click="saveSetup()" class="w-full py-3.5 rounded-2xl font-bold text-base shadow-sm" :class="ui.primary">เข้าสู่บ้านของเรา 🚀</button>
  </div>
</div>
</template>

<template x-if="ready">
<div class="pb-32">
  <!-- HEADER -->
  <header class="sticky top-0 z-20 backdrop-blur border-b px-4 py-2.5 flex items-center justify-between" :class="ui.header" :style="'background-color:'+ui.headerBg+';padding-top:calc(.625rem + env(safe-area-inset-top))'">
    <div class="flex items-center gap-2">
      <img src="icon-180.png" alt="Stocky" class="w-7 h-7 rounded-xl object-cover">
      <span class="font-extrabold text-lg tracking-tight" :class="ui.accentText">Stocky</span>
      <span class="text-[11px] px-2.5 py-0.5 rounded-full font-semibold" :class="ui.pill" x-text="{inv:'MyStock',shop:'ต้องซื้อเพิ่ม',set:'ตั้งค่า'}[tab]"></span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1.5 font-medium border" :class="ui.softBtn">
        <i class="w-2 h-2 rounded-full" :class="online?'bg-emerald-500 animate-pulse':'bg-slate-400'"></i>
        <span x-text="online?(pending?'กำลังซิงก์…':'ซิงก์แล้ว'):(pending?('ออฟไลน์ ('+pending+' รอส่ง)'):'ออฟไลน์')"></span>
      </span>
    </div>
  </header>

  <!-- MyStock -->
  <section x-show="tab==='inv'" class="p-3 space-y-3 max-w-4xl mx-auto">

    <!-- สรุปภาพรวม -->
    <div class="rounded-3xl p-4 shadow-md" :class="ui.hero">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-xs font-semibold opacity-90">ของใช้ในบ้านทั้งหมด</p>
          <p class="mt-1 leading-none"><span class="text-4xl font-extrabold" x-text="list.length"></span><span class="text-sm font-bold opacity-90 ml-1.5">รายการ</span></p>
        </div>
        <div x-show="list.length" class="text-right rounded-2xl bg-white/20 px-3 py-1.5">
          <p class="text-[11px] font-semibold opacity-90">พร้อมใช้</p>
          <p class="text-lg font-extrabold leading-tight"><span x-text="Math.round(pct('ok'))"></span>%</p>
        </div>
      </div>

      <div class="mt-3.5 h-2.5 rounded-full bg-white/25 overflow-hidden flex" role="img" aria-label="สัดส่วนสถานะสต็อก">
        <div class="h-full bg-emerald-300 transition-all duration-500" :style="'width:'+pct('ok')+'%'"></div>
        <div class="h-full bg-amber-300 transition-all duration-500" :style="'width:'+pct('low')+'%'"></div>
        <div class="h-full bg-rose-300 transition-all duration-500" :style="'width:'+pct('out')+'%'"></div>
      </div>

      <div class="mt-3 grid grid-cols-4 gap-1.5">
        <template x-for="f in [['all','ทั้งหมด','bg-slate-400'],['ok','มีของ','bg-emerald-500'],['low','ใกล้หมด','bg-amber-400'],['out','หมดแล้ว','bg-rose-500']]" :key="f[0]">
          <button type="button" @click="st=f[0]" class="rounded-2xl py-2 px-1 text-center" :class="st===f[0]?'bg-white text-slate-900 shadow-sm':'bg-white/20 text-white'">
            <span class="block text-lg font-extrabold leading-none" x-text="f[0]==='all'?list.length:countByState(f[0])"></span>
            <span class="mt-1 flex items-center justify-center gap-1 text-[11px] font-bold">
              <i class="inline-block w-1.5 h-1.5 rounded-full" :class="f[2]"></i><span x-text="f[1]"></span>
            </span>
          </button>
        </template>
      </div>
    </div>

    <!-- เตือนของใกล้หมดอายุ -->
    <button type="button" x-show="expSoon>0" @click="sortBy='exp';st='all';cat='all'" class="w-full rounded-2xl border px-3.5 py-2.5 flex items-center gap-2 text-xs font-bold text-left bg-amber-50 border-amber-300 text-amber-900 dark:bg-amber-950/40 dark:border-amber-700 dark:text-amber-200">
      <span class="text-base">⏰</span>
      <span x-text="expSoon+' รายการใกล้หรือเกินวันหมดอายุ'"></span>
      <span class="ml-auto underline shrink-0">ดูก่อนเลย ›</span>
    </button>

    <!-- ค้นหา + เรียงลำดับ -->
    <div class="space-y-2">
      <div class="relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 opacity-60 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input x-model="q" type="search" placeholder="ค้นหาชื่อ หมายเหตุ หรือบาร์โค้ด" class="w-full rounded-full border pl-10 pr-9 py-2.5 text-sm outline-none shadow-xs" :class="ui.input">
        <button type="button" x-show="q" @click="q=''" aria-label="ล้างคำค้นหา" class="absolute right-3 top-1/2 -translate-y-1/2 opacity-70 text-xs px-1">✕</button>
      </div>
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <span class="text-[11px] font-semibold opacity-70 shrink-0">เรียง</span>
        <template x-for="o in [['name','ชื่อ ก-ฮ'],['stock','ใกล้หมดก่อน'],['exp','หมดอายุก่อน']]" :key="o[0]">
          <button type="button" @click="sortBy=o[0]" class="shrink-0 px-2.5 py-1 rounded-full border text-[11px] font-semibold" :class="sortBy===o[0]?ui.chipActive:ui.chip" x-text="o[1]"></button>
        </template>
      </div>
    </div>

    <!-- หมวดหมู่ -->
    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5 items-center">
      <button type="button" @click="cat='all'" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border" :class="cat==='all'?ui.chipActive:ui.chip">✨ ทั้งหมด</button>
      <template x-for="c in allCats" :key="c.k">
        <button type="button" @click="cat=c.k" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border" :class="cat===c.k?ui.chipActive:ui.chip" x-text="c.e+' '+c.n"></button>
      </template>
      <button type="button" @click="openCatModal()" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border border-dashed" :class="ui.softBtn">＋ หมวด</button>
    </div>

    <!-- ไม่พบรายการ -->
    <div x-show="!filtered.length" class="rounded-3xl border p-8 text-center space-y-2" :class="ui.card">
      <img src="icon-180.png" alt="" class="w-20 h-20 mx-auto rounded-3xl shadow-sm">
      <p class="font-extrabold text-sm" x-text="list.length?'ไม่พบรายการที่ตรงกับตัวกรอง':'ยังไม่มีของใช้ในบ้านเลย'"></p>
      <p class="text-xs opacity-70" x-text="list.length?'ลองล้างตัวกรอง หรือเปลี่ยนคำค้นหา':'กดปุ่ม ＋ มุมขวาล่างเพื่อเพิ่มชิ้นแรกได้เลย'"></p>
      <button type="button" x-show="list.length&&(q||st!=='all'||cat!=='all')" @click="q='';st='all';cat='all'" class="mt-1 px-4 py-2 rounded-full text-xs font-bold" :class="ui.primary">ล้างตัวกรอง</button>
    </div>

    <!-- รายการแยกตามหมวดหมู่ -->
    <template x-for="c in allCats" :key="c.k">
      <div x-show="byCat(c.k).length" class="space-y-2">
        <div class="flex items-center justify-between pt-1 px-0.5">
          <h2 class="font-extrabold text-sm flex items-center gap-2">
            <span class="w-7 h-7 rounded-xl flex items-center justify-center text-sm border" :class="ui.thumb" x-text="c.e"></span>
            <span x-text="c.n"></span>
          </h2>
          <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold" :class="ui.pill" x-text="byCat(c.k).length+' ชิ้น'"></span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          <template x-for="i in byCat(c.k)" :key="i.id">
            <div class="rounded-3xl border p-3 flex flex-col gap-2.5 shadow-sm relative overflow-hidden" :class="ui.card">
              <div class="absolute left-0 inset-y-0 w-1.5" :class="stateMeta(i).bar"></div>

              <div class="flex gap-3 items-center cursor-pointer pl-1.5" @click="edit(i)">
                <div class="w-[72px] h-[72px] shrink-0 rounded-2xl flex items-center justify-center text-3xl overflow-hidden border" :class="ui.thumb">
                  <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" loading="lazy" alt=""></template>
                  <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
                </div>

                <div class="min-w-0 flex-1 space-y-1.5">
                  <div class="flex items-start justify-between gap-2">
                    <p class="font-bold text-sm leading-snug break-words line-clamp-2" x-text="i.name"></p>
                    <span x-show="i.price>0" class="text-[11px] font-extrabold shrink-0 px-1.5 py-0.5 rounded-full" :class="ui.pill">฿<span x-text="fmt(i.price)"></span></span>
                  </div>

                  <div class="flex flex-wrap gap-1">
                    <span class="inline-block px-2 py-0.5 rounded-full text-[11px] font-bold leading-none" :class="stateMeta(i).badge" x-text="stateMeta(i).label"></span>
                    <span x-show="expMeta(i)" class="inline-block px-2 py-0.5 rounded-full text-[11px] font-bold leading-none" :class="expMeta(i)?.badge" x-text="expMeta(i)?.label"></span>
                  </div>

                  <div class="h-1.5 rounded-full bg-slate-200/80 dark:bg-zinc-700/80 overflow-hidden" role="img" :aria-label="'ระดับสต็อก '+level(i)+'%'">
                    <div class="h-full rounded-full transition-all duration-500" :class="stateMeta(i).bar" :style="'width:'+level(i)+'%'"></div>
                  </div>

                  <p x-show="i.note" class="text-[11px] opacity-70 truncate" x-text="'📝 '+i.note"></p>

                  <div class="flex items-center justify-between text-[11px] opacity-70">
                    <span x-text="i.lastOpened?'แกะ '+ago(i.lastOpened):'ยังไม่เคยแกะ'"></span>
                    <span x-show="Number(i.min)>0">เตือน ≤ <strong x-text="i.min"></strong></span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 pl-1.5">
                <div class="flex items-center gap-1 rounded-full p-0.5 border shrink-0" :class="ui.softBtn">
                  <button type="button" @click="dec(i)" aria-label="ลดจำนวน" class="w-8 h-8 rounded-full text-base font-extrabold flex items-center justify-center border" :class="ui.card">−</button>
                  <span class="min-w-8 text-center text-base font-extrabold" x-text="Number(i.qty)||0"></span>
                  <button type="button" @click="inc(i)" aria-label="เพิ่มจำนวน" class="w-8 h-8 rounded-full text-base font-extrabold flex items-center justify-center border" :class="ui.card">＋</button>
                </div>

                <button type="button" @click="save(i.id,{onList:!onList(i),snoozed:onList(i),buy:i.buy||1})" class="flex-1 h-9 px-3 rounded-full text-[11px] font-bold border truncate" :class="onList(i)?'bg-amber-400/20 border-amber-400 text-amber-700 dark:text-amber-300':ui.softBtn" x-text="onList(i)?'🛒 ในลิสต์ ('+(i.buy||1)+')':'＋ ใส่ลิสต์ซื้อ'"></button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </section>

  <!-- SHOPPING -->
  <section x-show="tab==='shop'" class="p-3 space-y-3 max-w-2xl mx-auto">
    <div class="rounded-3xl p-4 shadow-sm space-y-3" :class="ui.primary">
      <div class="grid grid-cols-2 gap-2.5 text-center">
        <div class="rounded-2xl bg-black/10 p-2.5">
          <p class="text-xs opacity-90">งบรวมทั้งลิสต์</p>
          <p class="text-2xl font-extrabold mt-0.5">฿<span x-text="fmt(total)"></span></p>
        </div>
        <div class="rounded-2xl bg-black/10 p-2.5">
          <p class="text-xs opacity-90">หยิบใส่ตะกร้าแล้ว</p>
          <p class="text-2xl font-extrabold mt-0.5">฿<span x-text="fmt(totalChecked)"></span></p>
        </div>
      </div>

      <div x-show="shopList.length" class="space-y-1.5">
        <div class="flex items-center justify-between text-xs">
          <span>ความคืบหน้า (<span x-text="checkedCount"></span>/<span x-text="shopList.length"></span> ชิ้น)</span>
          <div class="flex gap-1.5">
            <button type="button" @click="toggleAllCart(true)" class="px-2.5 py-1 rounded-lg bg-black/15 hover:bg-black/25 font-medium">ติ๊กครบ</button>
            <button type="button" @click="toggleAllCart(false)" class="px-2.5 py-1 rounded-lg bg-black/15 hover:bg-black/25 font-medium">ล้างติ๊ก</button>
          </div>
        </div>
        <div class="w-full h-2 rounded-full bg-black/15 overflow-hidden">
          <div class="h-full bg-white rounded-full transition-all duration-300" :style="'width:'+(shopList.length?(checkedCount/shopList.length*100):0)+'%'"></div>
        </div>
      </div>
    </div>

    <div x-show="!shopList.length" class="rounded-3xl border p-12 text-center space-y-2" :class="ui.card">
      <p class="text-4xl">🎉</p>
      <p class="font-bold text-sm">ของใช้ในบ้านยังครบดีอยู่!</p>
      <p class="text-xs opacity-70">เมื่อของชิ้นไหนลดถึงจุดขั้นต่ำ หมด หรือใกล้หมดอายุ ระบบจะดึงมาที่นี่ให้อัตโนมัติ</p>
    </div>

    <div class="space-y-2">
      <template x-for="c in allCats" :key="c.k">
      <div x-show="shopByCat(c.k).length" class="space-y-2">
      <h2 class="font-bold text-xs flex items-center gap-1.5 pt-1 px-0.5"><span x-text="c.e"></span><span x-text="c.n"></span></h2>
      <template x-for="i in shopByCat(c.k)" :key="i.id">
        <div class="rounded-3xl border p-3 flex items-center gap-3 shadow-xs transition" :class="[ui.card, i.inCart&&'opacity-70']">
          <input type="checkbox" :checked="!!i.inCart" @change="save(i.id,{inCart:$event.target.checked})" class="w-6 h-6 rounded-lg shrink-0 cursor-pointer" :class="ui.accentCheck">
          <div class="w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-2xl overflow-hidden border" :class="ui.thumb">
            <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" alt=""></template>
            <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm leading-snug break-words" :class="i.inCart&&'line-through'" x-text="i.name"></p>
            <p x-show="i.note" class="text-[11px] opacity-70 mt-0.5 truncate" x-text="'📝 '+i.note"></p>
            <p class="text-[11px] opacity-65 mt-0.5">
              <span class="font-semibold" :class="Number(i.qty)<=0?'text-rose-500':'text-amber-500'" x-text="Number(i.qty)<=0?'หมดแล้ว':'เหลือ '+i.qty"></span>
              · ฿<span x-text="fmt(i.price||0)"></span>/ชิ้น
            </p>
            <p x-show="expMeta(i)" class="text-[11px] font-semibold mt-0.5" :class="expMeta(i)?.urgent?'text-rose-500':'text-amber-600 dark:text-amber-400'" x-text="expMeta(i)?.label"></p>
            <p class="text-xs font-bold mt-0.5" :class="ui.accentText">รวม ฿<span x-text="fmt((i.price||0)*(i.buy||1))"></span></p>
            <button type="button" @click="save(i.id,{snoozed:true})" class="text-[11px] underline opacity-70 mt-0.5">ข้ามไว้ก่อน</button>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" @click="save(i.id,{buy:Math.max(1,(i.buy||1)-1)})" aria-label="ลดจำนวนที่จะซื้อ" class="w-9 h-9 rounded-xl border font-bold" :class="ui.stepBtn">−</button>
            <span class="w-6 text-center font-extrabold text-sm" x-text="i.buy||1"></span>
            <button type="button" @click="save(i.id,{buy:(i.buy||1)+1})" aria-label="เพิ่มจำนวนที่จะซื้อ" class="w-9 h-9 rounded-xl border font-bold" :class="ui.stepBtn">＋</button>
          </div>
        </div>
      </template>
      </div>
      </template>
    </div>

let db = null;
const L = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const S = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

Alpine.data('app', () => ({
  tab:'inv',
  theme: localStorage.getItem('stocky_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'pink'),
  code: localStorage.getItem('roomCode') || '',
  cfg: L('fbcfg') || DEFAULT_CFG,
  ready:false, online:false, showAdv:false,
  items:{}, customCats:null,
  q:'', cat:'all', st:'all', sortBy:'name',
  f:null, catForm:null,
  scan:false, scanMsg:'', scanForForm:false, _handlingScan:false, _scanSeq:0,
  readerId:'reader-0',
  torchOn:false,
  hit:null, toast:'', scanner:null, sparkles:[],
  pending:0, undoData:null, updateReady:false, _f0:'', _ov:false,
  setup:{code:'', cfg:'', err:''},
  themes:[
    {k:'pink', n:'ชมพูหวาน', dot:'bg-pink-400'},
    {k:'blue', n:'ฟ้าสดใส', dot:'bg-blue-500'},
    {k:'emerald', n:'เขียวมิ้นต์', dot:'bg-emerald-500'},
    {k:'violet', n:'ม่วงพาสเทล', dot:'bg-violet-500'},
    {k:'dark', n:'โหมดดำเข้ม', dot:'bg-zinc-900'}
  ],
  emojiChoices:['🛁','🧺','🧴','🍳','📦','🧻','🪥','🧼','💊','🐶','🐱','👶','🧹','☕','🍜','💄'],

  get ui(){ const k = THEMES[this.theme] ? this.theme : 'pink'; return {...THEMES[k], hero: HERO[k]}; },
  get allCats(){ return Array.isArray(this.customCats) && this.customCats.length ? this.customCats : DEFAULT_CATS; },

  lockPortrait(){
    try{
      if(screen?.orientation && typeof screen.orientation.lock === 'function'){
        screen.orientation.lock('portrait').catch(() => {});
      }
    }catch{}
  },

  applyThemeClass(){
    const isDark = !!this.ui.isDark;
    document.documentElement.classList.toggle('dark', isDark);
    document.documentElement.style.backgroundColor = this.ui.metaColor;
    document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', this.ui.metaColor);
    const statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if(statusBar) statusBar.setAttribute('content', isDark ? 'black-translucent' : 'default');
  },

  setTheme(k){
    if(!THEMES[k]) return;
    this.theme = k;
    localStorage.setItem('stocky_theme', k);
    this.applyThemeClass();
    this.flash('เปลี่ยนธีมเป็น ' + (this.themes.find(x=>x.k===k)?.n || k) + ' ✨');
  },

  init(){
    this.lockPortrait();
    this.applyThemeClass();
    ['gesturestart','gesturechange','gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
    window.addEventListener('stocky-update', () => { this.updateReady = true; });
    // ปุ่ม Back ของมือถือ: ปิด modal ชั้นบนสุดแทนการออกจากแอป
    const anyOpen = () => !!(this.f || this.catForm || this.scan || this.hit);
    this.$watch(anyOpen, open => {
      clearTimeout(this._ovT);
      if(open){
        if(!this._ov){ history.pushState({ov:1}, ''); this._ov = true; }
      }else{
        this._ovT = setTimeout(() => {
          if(this._ov && !anyOpen()){ this._ov = false; history.back(); }
        }, 150);
      }
    });
    window.addEventListener('popstate', () => {
      if(!this._ov) return;
      if(this.hit) this.hit = null;
      else if(this.scan) this.closeScan();
      else if(this.catForm) this.catForm = null;
      else if(this.f) this.f = null;
      if(anyOpen()) history.pushState({ov:1}, ''); else this._ov = false;
    });
    this.setup.code = this.code;
    this.setup.cfg = this.cfg ? JSON.stringify(this.cfg, null, 1) : '';
    if(!this.code || !this.cfg) return;
    this.items = L('cache_' + this.code) || {};
    this.customCats = L('cats_' + this.code) || null;
    this.ready = true;
    try{
      db = getDatabase(initializeApp(this.cfg));
      onValue(ref(db, '.info/connected'), s => this.online = !!s.val());
      onValue(ref(db, this.base() + 'items'), s => {
        this.items = s.val() || {};
        S('cache_' + this.code, JSON.stringify(this.items));
      }, e => this.flash('อ่านข้อมูลไม่ได้: ' + e.code));
      onValue(ref(db, this.base() + 'cats'), s => {
        const val = s.val();
        if(Array.isArray(val) && val.length){
          this.customCats = val;
          S('cats_' + this.code, JSON.stringify(val));
        }
      });
    }catch(e){
      this.flash('Firebase config ผิดพลาด');
    }
  },

  base(){ return 'households/' + this.code + '/'; },
  flash(m, ms = 2200, undo = null){
    this.toast = m; this.undoData = undo;
    clearTimeout(this._t);
    this._t = setTimeout(() => { this.toast = ''; this.undoData = null; }, ms);
  },
  undo(){
    const u = this.undoData;
    if(!u) return;
    set(ref(db, this.base() + 'items/' + u.id), u.data);
    this.undoData = null;
    this.flash('กู้คืนรายการแล้ว ↩️');
  },
  closeForm(){
    if(this.f && JSON.stringify(this.f) !== this._f0 && !confirm('ทิ้งการแก้ไขที่ยังไม่ได้บันทึก?')) return;
    this.f = null;
  },
  genCode(){
    const a = 'abcdefghjkmnpqrstuvwxyz23456789';
    return 'home-' + Array.from(crypto.getRandomValues(new Uint8Array(10)), b => a[b % a.length]).join('');
  },
  burst(){
    const batch = Array.from({length:8}, (_,idx)=>({
      id: Date.now() + idx + Math.random(),
      src: 'icon-180.png',
      x: 20 + Math.random()*60,
      y: 45 + Math.random()*25
    }));
    this.sparkles.push(...batch);
    setTimeout(()=>{ this.sparkles = this.sparkles.filter(s => !batch.includes(s)); }, 1000);
  },

  parseCfg(s){
    const m = s.match(/\{[^{}]*apiKey[^{}]*\}/);
    if(!m) throw Error('ไม่พบ apiKey ใน config');
    const o = {};
    for(const x of m[0].matchAll(/["']?([A-Za-z_]\w*)["']?\s*:\s*(?:"([^"]*)"|'([^']*)')/g)) o[x[1]] = x[2] ?? x[3];
    if(!o.apiKey) throw Error('ไม่พบ apiKey ใน config');
    return o;
  },
  saveSetup(){
    try{
      const code = this.setup.code.trim();
      if(!code) throw Error('กรอกรหัสบ้าน');
      if(code.length < 8) throw Error('รหัสบ้านต้องยาวอย่างน้อย 8 ตัวอักษร');
      if(/[.#$\[\]\/]/.test(code)) throw Error('รหัสบ้านห้ามมี . # $ [ ] /');
      const cfg = this.setup.cfg.trim() ? this.parseCfg(this.setup.cfg) : DEFAULT_CFG;
      if(!cfg || !cfg.databaseURL) throw Error('Config ต้องมี databaseURL');
      localStorage.setItem('roomCode', code);
      localStorage.setItem('fbcfg', JSON.stringify(cfg));
      location.reload();
    }catch(e){
      this.setup.err = e.message || 'Config ไม่ถูกต้อง';
    }
  },

  getState(i){
    const qty = Number(i?.qty) || 0;
    const min = Number(i?.min) || 0;
    if(qty <= 0) return 'out';
    if(min > 0 && qty <= min) return 'low';
    return 'ok';
  },
  stateMeta(i){
    const s = this.getState(i);
    if(s === 'out') return {k:'out', rank:0, label:'หมดแล้ว', bar:'bg-rose-500', badge:'bg-rose-500/15 text-rose-600 dark:text-rose-400'};
    if(s === 'low') return {k:'low', rank:1, label:'ใกล้หมด', bar:'bg-amber-400', badge:'bg-amber-400/20 text-amber-700 dark:text-amber-300'};
    return {k:'ok', rank:2, label:'มีของอยู่', bar:'bg-emerald-500', badge:'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'};
  },
  expMeta(i){
    if(!i?.exp) return null;
    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(i.exp + 'T00:00:00');
    if(Number.isNaN(target.getTime())) return null;
    const diffDays = Math.round((target - today) / 864e5);
    if(diffDays < 0) return {urgent:true, days:diffDays, label:'หมดอายุแล้ว ('+Math.abs(diffDays)+' วัน)', badge:'bg-rose-500/15 text-rose-600 dark:text-rose-400'};
    if(diffDays === 0) return {urgent:true, days:0, label:'หมดอายุวันนี้', badge:'bg-rose-500/15 text-rose-600 dark:text-rose-400'};
    if(diffDays <= 7) return {urgent:true, days:diffDays, label:'หมดใน '+diffDays+' วัน', badge:'bg-amber-400/20 text-amber-700 dark:text-amber-300'};
    return {urgent:false, days:diffDays, label:'EXP '+target.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}), badge:'bg-slate-500/10 text-slate-600 dark:text-slate-300'};
  },
  countByState(k){ return this.list.filter(i => this.getState(i) === k).length; },

  get list(){ return Object.entries(this.items).map(([id, v]) => ({id, ...v})); },
  get filtered(){
    const q = this.q.trim().toLowerCase();
    const list = this.list.filter(i =>
      (this.cat === 'all' || this.resolveCatKey(i.cat) === this.cat) &&
      (this.st === 'all' || this.getState(i) === this.st) &&
      (!q ||
        (i.name || '').toLowerCase().includes(q) ||
        (i.note || '').toLowerCase().includes(q) ||
        String(i.barcode || '').includes(q))
    );
    return list.sort((a, b) => {
      if(this.sortBy === 'stock'){
        return this.stateMeta(a).rank - this.stateMeta(b).rank || (a.name || '').localeCompare(b.name || '', 'th');
      }
      if(this.sortBy === 'exp'){
        const da = a.exp ? new Date(a.exp + 'T00:00:00').getTime() : Number.MAX_SAFE_INTEGER;
        const dbTime = b.exp ? new Date(b.exp + 'T00:00:00').getTime() : Number.MAX_SAFE_INTEGER;
        return da - dbTime || (a.name || '').localeCompare(b.name || '', 'th');
      }
      return (a.name || '').localeCompare(b.name || '', 'th');
    });
  },
  resolveCatKey(k){
    const validKeys = new Set(this.allCats.map(c => c.k));
    if(validKeys.has(k)) return k;
    return this.allCats[0]?.k || '';
  },
  byCat(k){
    return this.filtered.filter(i => this.resolveCatKey(i.cat) === k);
  },
  catOf(k){
    return this.allCats.find(c => c.k === k) || this.allCats[0] || {k:'', n:'', e:'📦'};
  },

  onList(i){
    if(i.snoozed) return false;
    const expUrgent = !!this.expMeta(i)?.urgent;
    if(i.onList === false && this.getState(i) === 'ok' && !expUrgent) return false;
    return this.getState(i) !== 'ok' || expUrgent || !!i.onList;
  },
  get shopList(){
    return this.list
      .filter(i => this.onList(i))
      .sort((a, b) => !!a.inCart - !!b.inCart || (a.name || '').localeCompare(b.name || '', 'th'));
  },
  get expSoon(){ return this.list.filter(i => this.expMeta(i)?.urgent).length; },
  pct(k){ const n = this.list.length; return n ? this.countByState(k) / n * 100 : 0; },
  level(i){ const q = Math.max(0, Number(i.qty) || 0), m = Number(i.min) || 0; return Math.round(Math.min(1, q / Math.max(m * 2, q, 1)) * 100); },
  shopByCat(k){ return this.shopList.filter(i => this.resolveCatKey(i.cat) === k); },
  get checkedCount(){ return this.shopList.filter(i => i.inCart).length; },
  get total(){ return this.shopList.reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.buy) || 1), 0); },
  get totalChecked(){ return this.shopList.filter(i => i.inCart).reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.buy) || 1), 0); },
  fmt(n){ return Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: 2}); },
  ago(t){ const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'วันนี้' : d + ' วันก่อน'; },

  openCatModal(c = null){
    this.catForm = c ? {k: c.k, n: c.n, e: c.e, isEdit: true} : {k: 'cat_' + Date.now(), n: '', e: '✨', isEdit: false};
  },
  saveCat(){
    if(!this.catForm || !this.catForm.n.trim()) return this.flash('กรอกชื่อหมวดหมู่ก่อน');
    const next = [...this.allCats];
    const clean = {k: this.catForm.k, n: this.catForm.n.trim(), e: (this.catForm.e || '📦').trim()};
    const idx = next.findIndex(x => x.k === clean.k);
    if(idx >= 0) next[idx] = clean; else next.push(clean);
    this.customCats = next;
    S('cats_' + this.code, JSON.stringify(next));
    set(ref(db, this.base() + 'cats'), next).catch(() => {});
    if(this.f && !this.catForm.isEdit) this.f.cat = clean.k;
    this.catForm = null;
    this.flash('บันทึกหมวดหมู่แล้ว ' + clean.e);
  },
  delCat(c){
    if(this.allCats.length <= 1) return this.flash('ต้องมีหมวดหมู่อย่างน้อย 1 หมวด');
    if(!confirm('ลบหมวด "' + c.n + '" ? (สินค้าในหมวดนี้จะย้ายไปอยู่หมวดแรกแทน)')) return;
    const next = this.allCats.filter(x => x.k !== c.k);
    this.customCats = next;
    S('cats_' + this.code, JSON.stringify(next));
    set(ref(db, this.base() + 'cats'), next).catch(() => {});
    if(this.cat === c.k) this.cat = 'all';
    this.flash('ลบหมวดหมู่แล้ว');
  },

  save(id, patch){
    this.pending++;
    update(ref(db, this.base() + 'items/' + id), patch)
      .catch(e => this.flash('บันทึกไม่ได้: ' + e.code))
      .finally(() => { this.pending = Math.max(0, this.pending - 1); });
  },
  // ใช้ increment() ของ Firebase: 2 คนกดพร้อมกันก็ไม่ทับกัน
  dec(i){
    const cur = Number(i.qty) || 0;
    if(cur <= 0) return;
    const q = cur - 1;
    const patch = {qty: increment(-1), lastOpened: Date.now(), snoozed: false};
    if(q === 0 || (Number(i.min) > 0 && q <= Number(i.min))) patch.onList = true;
    this.save(i.id, patch);
  },
  inc(i){
    const q = (Number(i.qty) || 0) + 1;
    const min = Number(i.min) || 0;
    const patch = {qty: increment(1)};
    if(q > min && !this.expMeta(i)?.urgent) patch.onList = false;
    this.save(i.id, patch);
  },
  add(pre = {}){
    const defaultCat = this.cat !== 'all' ? this.cat : (this.allCats[0]?.k || '');
    this.f = {name:'', cat:defaultCat, barcode:'', img:'', imgUrl:'', qty:1, min:1, price:0, exp:'', note:'', ...pre};
    this._f0 = JSON.stringify(this.f);
  },
  edit(i){ this.f = {...i, cat: this.resolveCatKey(i.cat), exp: i.exp || '', note: i.note || '', imgUrl: /^https?:/.test(i.img || '') ? i.img : ''}; this._f0 = JSON.stringify(this.f); },
  commit(){
    const f = this.f;
    if(!f || !f.name || !f.name.trim()) return this.flash('ใส่ชื่อสินค้าก่อนน้า');
    const qty = Number(f.qty) || 0;
    const min = Number(f.min) || 0;
    const exp = String(f.exp || '').trim();
    const note = String(f.note || '').trim();
    const expUrgent = !!this.expMeta({exp})?.urgent;
    const data = {
      name: f.name.trim(),
      cat: this.resolveCatKey(f.cat),
      barcode: String(f.barcode || '').trim(),
      img: f.img || '',
      qty,
      min,
      price: Number(f.price) || 0,
      exp,
      note,
      onList: qty <= 0 || (min > 0 && qty <= min) || expUrgent ? true : !!f.onList,
      snoozed: false
    };
    if(f.id) this.save(f.id, data);
    else set(push(ref(db, this.base() + 'items')), {...data, buy: 1, createdAt: Date.now()});
    this.f = null;
    this.flash('บันทึกเรียบร้อย ✨');
  },
  del(){
    const id = this.f.id, data = {...this.items[id]};
    set(ref(db, this.base() + 'items/' + id), null);
    this.f = null;
    this.flash('ลบรายการแล้ว', 6000, {id, data});
  },
  toggleAllCart(val){
    const up = {};
    this.shopList.forEach(i => { up[i.id + '/inCart'] = !!val; });
    if(Object.keys(up).length) update(ref(db, this.base() + 'items'), up);
  },
  restock(){
    const up = {};
    let cleared = 0;
    this.shopList.filter(i => i.inCart).forEach(i => {
      const p = i.id + '/';
      up[p + 'qty'] = Math.max(0, Number(i.qty) || 0) + (Number(i.buy) || 1);
      up[p + 'onList'] = false;
      up[p + 'snoozed'] = false;
      if(this.expMeta(i)?.urgent){ up[p + 'exp'] = ''; cleared++; }
      up[p + 'inCart'] = false;
      up[p + 'buy'] = 1;
    });
    update(ref(db, this.base() + 'items'), up).then(() => {
      this.burst();
      this.flash(cleared ? 'เติมของแล้ว 🎉 ล้างวันหมดอายุเก่า ' + cleared + ' รายการ (ใส่วันใหม่ได้ที่การ์ดสินค้า)' : 'เติมของเข้าคลังเรียบร้อย! 🎉', cleared ? 4500 : 2200);
    });
  },

  urlImg(){ if(this.f) this.f.img = (this.f.imgUrl || '').trim(); },
  pickImg(ev){
    const file = ev.target.files[0];
    if(!file || !this.f) return;
    const img = new Image();
    img.onload = () => {
      const S = 200, c = document.createElement('canvas'), x = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      const sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.width = c.height = Math.min(S, m);
      x.drawImage(img, sx, sy, m, m, 0, 0, c.width, c.height);
      this.f.img = c.toDataURL('image/jpeg', 0.6);
      this.f.imgUrl = '';
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    ev.target.value = '';
  },

  // บาร์โค้ด: ปรับกรอบและโฟกัสให้สแกนระยะไกลขึ้นได้
  openScan(forForm = false){
    this.lockPortrait();
    const seq = ++this._scanSeq;
    this.scanForForm = forForm;
    this.readerId = 'reader-' + seq;
    this.scan = true;
    this.torchOn = false;
    this.scanMsg = 'กำลังเปิดกล้อง...';
    this._handlingScan = false;

    this.$nextTick(async () => {
      await this.stopScannerOnly();
      if(seq !== this._scanSeq || !this.scan) return;
      try{
        if(typeof Html5Qrcode === 'undefined') throw Error('ไม่พบไลบรารีสแกน');
        const formats = typeof Html5QrcodeSupportedFormats !== 'undefined' ? [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.QR_CODE
        ] : undefined;

        const inst = new Html5Qrcode(this.readerId, formats ? {formatsToSupport: formats, verbose: false} : {verbose: false});
        this.scanner = inst;
        await inst.start(
          {facingMode: 'environment'},
          {
            fps: 15,
            qrbox: (w) => ({width: Math.min(320, Math.floor(w * 0.9)), height: 150}),
            videoConstraints: {
              facingMode: {ideal: 'environment'},
              width: {ideal: 1280},
              height: {ideal: 720}
            }
          },
          code => this.onScan(code),
          () => {}
        );
        if(seq !== this._scanSeq || !this.scan){
          await this.stopScannerOnly();
          return;
        }
        try{
          const track = this.getVideoTrack();
          if(track && typeof track.applyConstraints === 'function'){
            await track.applyConstraints({advanced: [{focusMode: 'continuous'}]});
          }
        }catch{}
        this.scanMsg = 'ถือห่างจากบาร์โค้ดได้พอประมาณ (15–35 ซม.) ให้ตรงเส้นแดง';
      }catch(e){
        if(seq === this._scanSeq){
          this.scanMsg = 'เปิดกล้องไม่ได้ กรุณาอนุญาตกล้องและเปิดผ่าน HTTPS';
        }
      }
    });
  },

  getVideoTrack(){
    const vid = document.querySelector('#' + this.readerId + ' video') || document.querySelector('video');
    const stream = vid?.srcObject;
    return stream?.getVideoTracks?.()[0] || null;
  },

  async toggleTorch(){
    const next = !this.torchOn;
    try{
      const track = this.getVideoTrack();
      if(track && typeof track.applyConstraints === 'function'){
        await track.applyConstraints({advanced: [{torch: next}]});
        this.torchOn = next;
        this.flash(next ? 'เปิดไฟฉายแล้ว 🔦' : 'ปิดไฟฉายแล้ว');
        return;
      }
      if(this.scanner && typeof this.scanner.applyVideoConstraints === 'function'){
        await this.scanner.applyVideoConstraints({advanced: [{torch: next}]});
        this.torchOn = next;
        this.flash(next ? 'เปิดไฟฉายแล้ว 🔦' : 'ปิดไฟฉายแล้ว');
        return;
      }
      throw Error('unsupported');
    }catch{
      this.torchOn = false;
      this.flash('เบราว์เซอร์หรือกล้องเครื่องนี้ไม่รองรับการสั่งไฟฉายผ่านเว็บ');
    }
  },

  async stopScannerOnly(){
    const sc = this.scanner;
    this.scanner = null;
    if(sc){
      try{
        if(sc.isScanning) await sc.stop();
      }catch{}
      try{
        await sc.clear();
      }catch{}
    }
    document.querySelectorAll('[id^="reader"] video').forEach(vid => {
      if(vid && vid.srcObject){
        try{ vid.srcObject.getTracks().forEach(t => t.stop()); }catch{}
        vid.srcObject = null;
      }
    });
  },

  async closeScan(){
    this._scanSeq++;
    this.torchOn = false;
    this.scan = false;
    await this.stopScannerOnly();
  },

  async onScan(rawCode){
    if(this._handlingScan) return;
    this._handlingScan = true;
    const code = String(rawCode || '').trim();
    await this.closeScan();
    if(!code){ this._handlingScan = false; return; }
    if(navigator.vibrate) navigator.vibrate(40);
    if(this.scanForForm && this.f){
      this.f.barcode = code;
      this.flash('สแกนบาร์โค้ดแล้ว: ' + code);
      this._handlingScan = false;
      return;
    }
    const found = this.list.find(i => String(i.barcode || '').trim() === code);
    if(found){
      this.$nextTick(() => { this.hit = found.id; this._handlingScan = false; });
    }else{
      this.flash('ไม่พบบาร์โค้ด ' + code + ' เพิ่มใหม่ได้เลย');
      this.add({barcode: code});
      this._handlingScan = false;
    }
  },

  exportJson(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({version: 2, exportedAt: new Date().toISOString(), cats: this.allCats, items: this.items}, null, 1)], {type: 'application/json'}));
    a.download = 'stocky-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
  },
  importJson(ev){
    const file = ev.target.files[0];
    if(!file) return;
    file.text().then(t => {
      const d = JSON.parse(t);
      if(!d.items || typeof d.items !== 'object' || !Object.values(d.items).every(v => v && typeof v === 'object' && typeof v.name === 'string')) throw Error();
      if(!confirm('เขียนทับสินค้าทั้งหมดด้วยไฟล์นี้?')) return;
      const tasks = [set(ref(db, this.base() + 'items'), d.items)];
      if(Array.isArray(d.cats) && d.cats.length) tasks.push(set(ref(db, this.base() + 'cats'), d.cats));
      return Promise.all(tasks).then(() => this.flash('นำเข้าสำเร็จ ✨'));
    }).catch(() => this.flash('ไฟล์ไม่ถูกต้อง'));
    ev.target.value = '';
  }
}));
Alpine.start();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw && nw.addEventListener('statechange', () => {
        if(nw.state === 'installed' && navigator.serviceWorker.controller) window.dispatchEvent(new Event('stocky-update'));
      });
    });
  }).catch(() => {});
}
</script>
