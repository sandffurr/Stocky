<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Stocky</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fdf2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stocky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
[x-cloak]{display:none!important}
html,body{
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top);
  touch-action:pan-x pan-y;
}
button,a,input,select,label{touch-action:manipulation}
.pb-safe{padding-bottom:env(safe-area-inset-bottom)}
button{transition:transform .14s cubic-bezier(.34,1.56,.64,1),background-color .15s,opacity .15s}
button:active{transform:scale(.94)}
.dot-bg{
  background-image:radial-gradient(var(--dot-color, rgba(244,114,182,.22)) 1.25px, transparent 1.25px);
  background-size:18px 18px;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}
.sparkle{animation:floatUp .95s ease-out forwards}
</style>
</head>
<body class="min-h-screen dot-bg transition-colors duration-200 selection:bg-pink-300/40" :class="ui.body" :style="ui.dotStyle" x-data="app" x-cloak>

<!-- ตั้งค่าครั้งแรก -->
<template x-if="!ready">
<div class="max-w-md mx-auto p-5 space-y-4">
  <div class="flex items-center justify-between pt-2">
    <div class="flex items-center gap-2.5">
      <span class="text-3xl">🐰</span>
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Stocky</h1>
        <p class="text-xs opacity-65">ผู้ช่วยเช็กสต็อกของใช้ในบ้าน</p>
      </div>
    </div>
    <div class="flex gap-1.5">
      <template x-for="t in themes" :key="t.k">
        <button type="button" @click="setTheme(t.k)" class="w-7 h-7 rounded-full border-2" :class="[t.dot, theme===t.k?'border-slate-900 dark:border-white scale-110':'border-transparent opacity-60']" :title="t.n"></button>
      </template>
    </div>
  </div>

  <div class="rounded-3xl border p-4 space-y-3 shadow-xs" :class="ui.card">
    <p class="text-sm font-semibold">เริ่มต้นใช้งาน 1 นาที ✨</p>
    <label class="block text-xs font-medium opacity-80">ตั้งรหัสบ้าน (ยาวอย่างน้อย 8 ตัวอักษร เพื่อแชร์ข้อมูลกับคนในบ้าน)
      <input x-model="setup.code" placeholder="เช่น myhome-2026" class="mt-1.5 w-full rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input">
    </label>
    <details class="rounded-2xl border p-3 text-xs" :class="ui.softBtn">
      <summary class="cursor-pointer font-semibold opacity-80">⚙️ ตั้งค่า Firebase Config (ใช้ค่าเริ่มต้นได้เลย)</summary>
      <textarea x-model="setup.cfg" rows="6" placeholder='{ apiKey: "...", databaseURL: "..." }' class="mt-2 w-full rounded-xl border p-2.5 font-mono text-[11px] outline-none" :class="ui.input"></textarea>
    </details>
    <p x-show="setup.err" class="text-red-500 text-xs font-semibold" x-text="setup.err"></p>
    <button type="button" @click="saveSetup()" class="w-full py-3.5 rounded-2xl font-bold text-base shadow-sm" :class="ui.primary">เข้าสู่บ้านของเรา 🚀</button>
  </div>
</div>
</template>

<template x-if="ready">
<div class="pb-36">
  <!-- HEADER -->
  <header class="sticky top-0 z-20 backdrop-blur border-b px-4 py-3 flex items-center justify-between" :class="ui.header" :style="'background-color:'+ui.headerBg">
    <div class="flex items-center gap-2">
      <span class="text-xl">🐰</span>
      <span class="font-extrabold text-lg tracking-tight" :class="ui.accentText">Stocky</span>
      <span class="text-[11px] px-2.5 py-0.5 rounded-full font-semibold" :class="ui.pill" x-text="{inv:'คลังของใช้',shop:'ต้องซื้อเพิ่ม',set:'ตั้งค่า'}[tab]"></span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1.5 font-medium border" :class="ui.softBtn">
        <i class="w-2 h-2 rounded-full" :class="online?'bg-emerald-500 animate-pulse':'bg-slate-400'"></i>
        <span x-text="online?'ซิงก์แล้ว':'ออฟไลน์'"></span>
      </span>
    </div>
  </header>

  <!-- INVENTORY -->
  <section x-show="tab==='inv'" class="p-3 space-y-3 max-w-2xl mx-auto">
    <!-- แถบสรุปสถานะอัตโนมัติ 3 ระดับ -->
    <div class="grid grid-cols-4 gap-1.5">
      <button type="button" @click="st='all'" class="rounded-2xl border p-2.5 text-center transition" :class="st==='all'?ui.chipActive:ui.card">
        <span class="block text-base font-extrabold" x-text="list.length"></span>
        <span class="block text-[11px] opacity-75">ทั้งหมด</span>
      </button>
      <button type="button" @click="st='ok'" class="rounded-2xl border p-2.5 text-center transition" :class="st==='ok'?'bg-emerald-500 border-emerald-500 text-white shadow-xs':ui.card">
        <span class="block text-base font-extrabold" :class="st!=='ok'&&'text-emerald-500'" x-text="countByState('ok')"></span>
        <span class="block text-[11px] opacity-80">มีของอยู่</span>
      </button>
      <button type="button" @click="st='low'" class="rounded-2xl border p-2.5 text-center transition" :class="st==='low'?'bg-amber-400 border-amber-400 text-slate-900 shadow-xs':ui.card">
        <span class="block text-base font-extrabold" :class="st!=='low'&&'text-amber-500'" x-text="countByState('low')"></span>
        <span class="block text-[11px] opacity-80">ใกล้หมด</span>
      </button>
      <button type="button" @click="st='out'" class="rounded-2xl border p-2.5 text-center transition" :class="st==='out'?'bg-rose-500 border-rose-500 text-white shadow-xs':ui.card">
        <span class="block text-base font-extrabold" :class="st!=='out'&&'text-rose-500'" x-text="countByState('out')"></span>
        <span class="block text-[11px] opacity-80">หมดแล้ว</span>
      </button>
    </div>

    <!-- ค้นหา -->
    <div class="relative">
      <input x-model="q" type="search" placeholder="🔍 ค้นหาชื่อของใช้ หรือเลขบาร์โค้ด..." class="w-full rounded-2xl border pl-4 pr-9 py-3 text-sm outline-none" :class="ui.input">
      <button type="button" x-show="q" @click="q=''" class="absolute right-3 top-1/2 -translate-y-1/2 opacity-60 text-sm px-1.5">✕</button>
    </div>

    <!-- แถบหมวดหมู่ + ปุ่มเพิ่มหมวดเอง -->
    <div class="flex gap-2 overflow-x-auto pb-1 items-center">
      <button type="button" @click="cat='all'" class="shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border" :class="cat==='all'?ui.chipActive:ui.chip">✨ ทั้งหมด</button>
      <template x-for="c in allCats" :key="c.k">
        <button type="button" @click="cat=c.k" class="shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border" :class="cat===c.k?ui.chipActive:ui.chip" x-text="c.e+' '+c.n"></button>
      </template>
      <button type="button" @click="openCatModal()" class="shrink-0 px-3 py-2 rounded-full text-xs font-bold border border-dashed" :class="ui.softBtn">＋ หมวด</button>
    </div>

    <!-- Empty State -->
    <div x-show="!filtered.length" class="rounded-3xl border p-10 text-center space-y-2" :class="ui.card">
      <p class="text-4xl">🧺</p>
      <p class="font-bold text-sm">ไม่พบรายการในหน้านี้</p>
      <p class="text-xs opacity-60">กดปุ่ม ＋ มุมขวาล่างเพื่อเพิ่มของใช้ชิ้นใหม่ได้เลย</p>
    </div>

    <!-- รายการแยกตามหมวดหมู่ -->
    <template x-for="c in allCats" :key="c.k">
      <div x-show="byCat(c.k).length" class="space-y-2">
        <div class="flex items-center justify-between pt-1 px-0.5">
          <h2 class="font-bold text-sm flex items-center gap-1.5">
            <span x-text="c.e"></span>
            <span x-text="c.n"></span>
          </h2>
          <span class="text-[11px] opacity-55" x-text="byCat(c.k).length+' ชิ้น'"></span>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          <template x-for="i in byCat(c.k)" :key="i.id">
            <div class="rounded-3xl border p-3 flex flex-col justify-between gap-2.5 shadow-xs relative overflow-hidden" :class="ui.card">
              <div class="absolute top-0 inset-x-0 h-1" :class="stateMeta(i).bar"></div>

              <div class="flex gap-2.5 items-start cursor-pointer pt-0.5" @click="edit(i)">
                <div class="w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-2xl overflow-hidden border" :class="ui.thumb">
                  <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" loading="lazy" alt=""></template>
                  <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
                </div>
                <div class="min-w-0 flex-1">
                  <p class="font-bold text-sm leading-snug break-words line-clamp-2" x-text="i.name"></p>
                  <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] font-bold" :class="stateMeta(i).badge" x-text="stateMeta(i).label"></span>
                </div>
              </div>

              <div class="flex items-center justify-between text-[11px] opacity-65 px-0.5">
                <span x-text="i.lastOpened?'แกะ '+ago(i.lastOpened):'ยังไม่เคยแกะ'"></span>
                <span x-show="i.price>0">฿<span x-text="fmt(i.price)"></span></span>
              </div>

              <div class="flex items-center justify-between gap-1 rounded-2xl p-1 border" :class="ui.softBtn">
                <button type="button" @click="dec(i)" class="w-9 h-9 rounded-xl text-lg font-extrabold flex items-center justify-center border" :class="ui.card">−</button>
                <div class="text-center leading-none">
                  <span class="text-lg font-extrabold" x-text="Number(i.qty)||0"></span>
                  <span x-show="Number(i.min)>0" class="block text-[10px] opacity-60 mt-0.5">เตือน ≤ <span x-text="i.min"></span></span>
                </div>
                <button type="button" @click="inc(i)" class="w-9 h-9 rounded-xl text-lg font-extrabold flex items-center justify-center border" :class="ui.card">＋</button>
              </div>

              <button type="button" @click="save(i.id,{onList:!onList(i),buy:i.buy||1})" class="w-full py-2 rounded-2xl text-xs font-bold border" :class="onList(i)?'bg-amber-400/20 border-amber-400 text-amber-700 dark:text-amber-300':ui.softBtn" x-text="onList(i)?'🛒 อยู่ในลิสต์ ('+(i.buy||1)+')':'＋ ใส่ลิสต์ซื้อ'"></button>
            </div>
          </template>
        </div>
      </div>
    </template>
  </section>

  <!-- SHOPPING -->
  <section x-show="tab==='shop'" class="p-3 space-y-3 max-w-2xl mx-auto">
    <div class="rounded-3xl p-4 shadow-sm space-y-3" :class="ui.primary">
      <div class="grid grid-cols-2 gap-2.5 text-center">
        <div class="rounded-2xl bg-black/10 p-2.5">
          <p class="text-xs opacity-90">งบรวมทั้งลิสต์</p>
          <p class="text-2xl font-extrabold mt-0.5">฿<span x-text="fmt(total)"></span></p>
        </div>
        <div class="rounded-2xl bg-black/10 p-2.5">
          <p class="text-xs opacity-90">หยิบใส่ตะกร้าแล้ว</p>
          <p class="text-2xl font-extrabold mt-0.5">฿<span x-text="fmt(totalChecked)"></span></p>
        </div>
      </div>

      <div x-show="shopList.length" class="space-y-1.5">
        <div class="flex items-center justify-between text-xs">
          <span>ความคืบหน้า (<span x-text="checkedCount"></span>/<span x-text="shopList.length"></span> ชิ้น)</span>
          <div class="flex gap-1.5">
            <button type="button" @click="toggleAllCart(true)" class="px-2.5 py-1 rounded-lg bg-black/15 hover:bg-black/25 font-medium">ติ๊กครบ</button>
            <button type="button" @click="toggleAllCart(false)" class="px-2.5 py-1 rounded-lg bg-black/15 hover:bg-black/25 font-medium">ล้างติ๊ก</button>
          </div>
        </div>
        <div class="w-full h-2 rounded-full bg-black/15 overflow-hidden">
          <div class="h-full bg-white rounded-full transition-all duration-300" :style="'width:'+(shopList.length?(checkedCount/shopList.length*100):0)+'%'"></div>
        </div>
      </div>
    </div>

    <div x-show="!shopList.length" class="rounded-3xl border p-12 text-center space-y-2" :class="ui.card">
      <p class="text-4xl">🎉</p>
      <p class="font-bold text-sm">ของใช้ในบ้านยังครบดีอยู่!</p>
      <p class="text-xs opacity-60">เมื่อของชิ้นไหนลดถึงจุดขั้นต่ำหรือหมด ระบบจะดึงมาที่นี่ให้อัตโนมัติ</p>
    </div>

    <div class="space-y-2">
      <template x-for="i in shopList" :key="i.id">
        <div class="rounded-3xl border p-3 flex items-center gap-3 shadow-xs transition" :class="[ui.card, i.inCart&&'opacity-60']">
          <input type="checkbox" :checked="!!i.inCart" @change="save(i.id,{inCart:$event.target.checked})" class="w-6 h-6 rounded-lg shrink-0 cursor-pointer" :class="ui.accentCheck">
          <div class="w-12 h-12 shrink-0 rounded-2xl flex items-center justify-center text-xl overflow-hidden border" :class="ui.thumb">
            <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" alt=""></template>
            <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm leading-snug break-words" :class="i.inCart&&'line-through'" x-text="i.name"></p>
            <p class="text-[11px] opacity-65 mt-0.5">
              <span class="font-semibold" :class="Number(i.qty)<=0?'text-rose-500':'text-amber-500'" x-text="Number(i.qty)<=0?'หมดแล้ว':'เหลือ '+i.qty"></span>
              · ฿<span x-text="fmt(i.price||0)"></span>/ชิ้น
            </p>
            <p class="text-xs font-bold mt-0.5" :class="ui.accentText">รวม ฿<span x-text="fmt((i.price||0)*(i.buy||1))"></span></p>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" @click="save(i.id,{buy:Math.max(1,(i.buy||1)-1)})" class="w-9 h-9 rounded-xl border font-bold" :class="ui.stepBtn">−</button>
            <span class="w-6 text-center font-extrabold text-sm" x-text="i.buy||1"></span>
            <button type="button" @click="save(i.id,{buy:(i.buy||1)+1})" class="w-9 h-9 rounded-xl border font-bold" :class="ui.stepBtn">＋</button>
          </div>
        </div>
      </template>
    </div>

    <select @change="if($event.target.value){save($event.target.value,{onList:true,buy:1});$event.target.value=''}" class="w-full rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input">
      <option value="">＋ เลือกของจากสต็อกมาใส่ลิสต์เพิ่มเอง…</option>
      <template x-for="i in list.filter(x=>!onList(x))" :key="i.id">
        <option :value="i.id" x-text="catOf(i.cat).e+' '+i.name"></option>
      </template>
    </select>

    <button type="button" @click="restock()" :disabled="!shopList.some(i=>i.inCart)" class="w-full py-4 rounded-2xl disabled:opacity-40 font-extrabold text-base shadow-sm" :class="ui.primary">🛍️ ยืนยันการซื้อ & เติมเข้าสต็อก</button>
  </section>

  <!-- SETTINGS -->
  <section x-show="tab==='set'" class="p-3 space-y-3 max-w-2xl mx-auto">
    <div class="rounded-3xl border p-4 space-y-3 shadow-xs" :class="ui.card">
      <div>
        <p class="font-bold text-base">🎨 ธีมสีของแอป</p>
        <p class="text-xs opacity-65">เปลี่ยนบรรยากาศแอปได้ตามชอบ</p>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        <template x-for="t in themes" :key="t.k">
          <button type="button" @click="setTheme(t.k)" class="flex items-center gap-2.5 p-3 rounded-2xl border text-left font-semibold text-xs" :class="theme===t.k?ui.chipActive:ui.chip">
            <span class="w-5 h-5 rounded-full shrink-0 border border-black/15" :class="t.dot"></span>
            <span x-text="t.n"></span>
          </button>
        </template>
      </div>
    </div>

    <div class="rounded-3xl border p-4 space-y-3 shadow-xs" :class="ui.card">
      <div class="flex items-center justify-between">
        <div>
          <p class="font-bold text-base">🗂️ หมวดหมู่ของใช้</p>
          <p class="text-xs opacity-65">เพิ่ม ลบ หรือเปลี่ยนอีโมจิหมวดได้เอง</p>
        </div>
        <button type="button" @click="openCatModal()" class="px-3.5 py-2 rounded-xl text-xs font-bold" :class="ui.primary">＋ เพิ่มหมวด</button>
      </div>
      <div class="space-y-1.5">
        <template x-for="c in allCats" :key="c.k">
          <div class="flex items-center justify-between p-2.5 rounded-2xl border" :class="ui.softBtn">
            <div class="flex items-center gap-2.5">
              <span class="text-xl w-8 h-8 rounded-xl flex items-center justify-center border" :class="ui.card" x-text="c.e"></span>
              <span class="font-semibold text-sm" x-text="c.n"></span>
            </div>
            <div class="flex items-center gap-1">
              <button type="button" @click="openCatModal(c)" class="px-2.5 py-1.5 rounded-xl text-xs border" :class="ui.card">แก้ไข</button>
              <button type="button" x-show="c.k!=='other'" @click="delCat(c)" class="px-2.5 py-1.5 rounded-xl text-xs border border-red-300 text-red-500">ลบ</button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <div class="rounded-3xl border p-4 space-y-2.5 shadow-xs" :class="ui.card">
      <div>
        <p class="font-bold text-base">🏠 รหัสบ้าน (แชร์ซิงก์ข้อมูล)</p>
        <p class="text-xs opacity-65">ส่งรหัสนี้ให้คนในบ้านกรอกเพื่อใช้สต็อกร่วมกัน</p>
      </div>
      <input x-model="setup.code" class="w-full rounded-2xl border p-3 text-sm outline-none" :class="ui.input">
      <div class="flex gap-2">
        <button type="button" @click="navigator.clipboard.writeText(code).then(()=>flash('คัดลอกรหัสบ้านแล้ว 📋'))" class="flex-1 py-3 rounded-2xl border font-semibold text-xs" :class="ui.softBtn">📋 คัดลอกรหัส</button>
        <button type="button" @click="saveSetup()" class="flex-1 py-3 rounded-2xl font-bold text-xs" :class="ui.primary">บันทึกรหัสบ้าน</button>
      </div>
    </div>

    <div class="pt-4">
      <button type="button" @click="showAdv=!showAdv" class="w-full py-3 rounded-2xl border text-xs font-semibold opacity-70 flex items-center justify-center gap-1.5" :class="ui.softBtn">
        <span>🛠️ ตั้งค่าระบบหลังบ้าน & สำรองข้อมูล</span>
        <span x-text="showAdv?'▲':'▼'"></span>
      </button>

      <div x-show="showAdv" x-transition class="mt-3 space-y-3">
        <div class="rounded-3xl border p-4 space-y-2.5" :class="ui.card">
          <p class="font-bold text-sm">🔥 Firebase Config (ฐานข้อมูลคลาวด์)</p>
          <textarea x-model="setup.cfg" rows="6" class="w-full rounded-2xl border p-3 font-mono text-[11px] outline-none" :class="ui.input"></textarea>
          <p x-show="setup.err" class="text-red-500 text-xs" x-text="setup.err"></p>
          <button type="button" @click="saveSetup()" class="w-full py-3 rounded-2xl font-bold text-xs" :class="ui.primary">อัปเดต Firebase Config</button>
        </div>

        <div class="rounded-3xl border p-4 space-y-2.5" :class="ui.card">
          <p class="font-bold text-sm">💾 สำรอง / กู้คืนข้อมูล (.json)</p>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" @click="exportJson()" class="py-3 rounded-2xl border font-semibold text-xs" :class="ui.softBtn">⬇️ Export ไฟล์สำรอง</button>

    this.flash('เปลี่ยนธีมเป็น ' + (this.themes.find(x=>x.k===k)?.n || k) + ' ✨');
  },

  init(){
    this.applyThemeClass();
    document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
    this.setup.code = this.code;
    this.setup.cfg = this.cfg ? JSON.stringify(this.cfg, null, 1) : '';
    if(!this.code || !this.cfg) return;
    this.items = L('cache_' + this.code) || {};
    this.customCats = L('cats_' + this.code) || null;
    this.ready = true;
    try{
      db = getDatabase(initializeApp(this.cfg));
      onValue(ref(db, '.info/connected'), s => this.online = !!s.val());
      onValue(ref(db, this.base() + 'items'), s => {
        this.items = s.val() || {};
        localStorage.setItem('cache_' + this.code, JSON.stringify(this.items));
      }, e => this.flash('อ่านข้อมูลไม่ได้: ' + e.code));
      onValue(ref(db, this.base() + 'cats'), s => {
        const val = s.val();
        if(Array.isArray(val) && val.length){
          this.customCats = val;
          localStorage.setItem('cats_' + this.code, JSON.stringify(val));
        }
      });
    }catch(e){
      this.flash('Firebase config ผิดพลาด');
    }
  },

  base(){ return 'households/' + this.code + '/'; },
  flash(m){ this.toast = m; clearTimeout(this._t); this._t = setTimeout(() => this.toast = '', 2200); },
  burst(emojis=['✨','🛍️','🎉','💖']){
    const batch = Array.from({length:8}, (_,idx)=>({
      id: Date.now() + idx + Math.random(),
      e: emojis[idx % emojis.length],
      x: 20 + Math.random()*60,
      y: 45 + Math.random()*25
    }));
    this.sparkles.push(...batch);
    setTimeout(()=>{ this.sparkles = this.sparkles.filter(s => !batch.includes(s)); }, 1000);
  },

  parseCfg(s){
    const m = s.match(/\{[^{}]*apiKey[^{}]*\}/);
    if(!m) throw Error('ไม่พบ apiKey ใน config');
    return new Function('return ' + m[0])();
  },
  saveSetup(){
    try{
      const code = this.setup.code.trim();
      if(!code) throw Error('กรอกรหัสบ้าน');
      if(code.length < 8) throw Error('รหัสบ้านต้องยาวอย่างน้อย 8 ตัวอักษร');
      if(/[.#$\[\]\/]/.test(code)) throw Error('รหัสบ้านห้ามมี . # $ [ ] /');
      const cfg = this.setup.cfg.trim() ? this.parseCfg(this.setup.cfg) : DEFAULT_CFG;
      if(!cfg || !cfg.databaseURL) throw Error('Config ต้องมี databaseURL');
      localStorage.setItem('roomCode', code);
      localStorage.setItem('fbcfg', JSON.stringify(cfg));
      location.reload();
    }catch(e){
      this.setup.err = e.message || 'Config ไม่ถูกต้อง';
    }
  },

  getState(i){
    const qty = Number(i?.qty) || 0;
    const min = Number(i?.min) || 0;
    if(qty <= 0) return 'out';
    if(min > 0 && qty <= min) return 'low';
    return 'ok';
  },
  stateMeta(i){
    const s = this.getState(i);
    if(s === 'out') return {k:'out', label:'หมดแล้ว', bar:'bg-rose-500', badge:'bg-rose-500/15 text-rose-600 dark:text-rose-400'};
    if(s === 'low') return {k:'low', label:'ใกล้หมด', bar:'bg-amber-400', badge:'bg-amber-400/20 text-amber-700 dark:text-amber-300'};
    return {k:'ok', label:'มีของอยู่', bar:'bg-emerald-500', badge:'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'};
  },
  countByState(k){ return this.list.filter(i => this.getState(i) === k).length; },

  get list(){ return Object.entries(this.items).map(([id, v]) => ({id, ...v})); },
  get filtered(){
    const q = this.q.trim().toLowerCase();
    return this.list
      .filter(i =>
        (this.cat === 'all' || (i.cat || 'other') === this.cat) &&
        (this.st === 'all' || this.getState(i) === this.st) &&
        (!q || (i.name || '').toLowerCase().includes(q) || String(i.barcode || '').includes(q))
      )
      .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));
  },
  byCat(k){
    const validKeys = new Set(this.allCats.map(c => c.k));
    return this.filtered.filter(i => {
      const ck = validKeys.has(i.cat) ? i.cat : 'other';
      return ck === k;
    });
  },
  catOf(k){ return this.allCats.find(c => c.k === k) || this.allCats.find(c => c.k === 'other') || DEFAULT_CATS[4]; },

  onList(i){
    if(i.onList === false && this.getState(i) === 'ok') return false;
    return this.getState(i) !== 'ok' || !!i.onList;
  },
  get shopList(){
    return this.list
      .filter(i => this.onList(i))
      .sort((a, b) => !!a.inCart - !!b.inCart || (a.name || '').localeCompare(b.name || '', 'th'));
  },
  get checkedCount(){ return this.shopList.filter(i => i.inCart).length; },
  get total(){ return this.shopList.reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.buy) || 1), 0); },
  get totalChecked(){ return this.shopList.filter(i => i.inCart).reduce((s, i) => s + (Number(i.price) || 0) * (Number(i.buy) || 1), 0); },
  fmt(n){ return Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: 2}); },
  ago(t){ const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'วันนี้' : d + ' วันก่อน'; },

  openCatModal(c = null){
    this.catForm = c ? {k: c.k, n: c.n, e: c.e, isEdit: true} : {k: 'cat_' + Date.now(), n: '', e: '✨', isEdit: false};
  },
  saveCat(){
    if(!this.catForm || !this.catForm.n.trim()) return this.flash('กรอกชื่อหมวดหมู่ก่อน');
    const next = [...this.allCats];
    const clean = {k: this.catForm.k, n: this.catForm.n.trim(), e: (this.catForm.e || '📦').trim()};
    const idx = next.findIndex(x => x.k === clean.k);
    if(idx >= 0) next[idx] = clean; else next.push(clean);
    this.customCats = next;
    localStorage.setItem('cats_' + this.code, JSON.stringify(next));
    set(ref(db, this.base() + 'cats'), next).catch(() => {});
    if(this.f && !this.catForm.isEdit) this.f.cat = clean.k;
    this.catForm = null;
    this.flash('บันทึกหมวดหมู่แล้ว ' + clean.e);
  },
  delCat(c){
    if(c.k === 'other') return;
    if(!confirm('ลบหมวด "' + c.n + '" ? (สินค้าในหมวดนี้จะย้ายไปอยู่หมวดอื่นๆ)')) return;
    const next = this.allCats.filter(x => x.k !== c.k);
    this.customCats = next;
    localStorage.setItem('cats_' + this.code, JSON.stringify(next));
    set(ref(db, this.base() + 'cats'), next).catch(() => {});
    if(this.cat === c.k) this.cat = 'all';
    this.flash('ลบหมวดหมู่แล้ว');
  },

  save(id, patch){ update(ref(db, this.base() + 'items/' + id), patch).catch(e => this.flash('บันทึกไม่ได้: ' + e.code)); },
  dec(i){
    const q = Math.max(0, (Number(i.qty) || 0) - 1);
    const patch = {qty: q, lastOpened: Date.now()};
    if(q === 0 || (Number(i.min) > 0 && q <= Number(i.min))) patch.onList = true;
    this.save(i.id, patch);
  },
  inc(i){
    const q = (Number(i.qty) || 0) + 1;
    const min = Number(i.min) || 0;
    const patch = {qty: q};
    if(q > min) patch.onList = false;
    this.save(i.id, patch);
  },
  add(pre = {}){
    const defaultCat = this.cat !== 'all' ? this.cat : (this.allCats[0]?.k || 'other');
    this.f = {name:'', cat:defaultCat, barcode:'', img:'', imgUrl:'', qty:1, min:1, price:0, ...pre};
  },
  edit(i){ this.f = {...i, imgUrl: /^https?:/.test(i.img || '') ? i.img : ''}; },
  commit(){
    const f = this.f;
    if(!f || !f.name || !f.name.trim()) return this.flash('ใส่ชื่อสินค้าก่อนน้า');
    const qty = Number(f.qty) || 0;
    const min = Number(f.min) || 0;
    const data = {
      name: f.name.trim(),
      cat: f.cat || 'other',
      barcode: String(f.barcode || '').trim(),
      img: f.img || '',
      qty,
      min,
      price: Number(f.price) || 0,
      onList: qty <= 0 || (min > 0 && qty <= min) ? true : !!f.onList
    };
    if(f.id) this.save(f.id, data);
    else set(push(ref(db, this.base() + 'items')), {...data, buy: 1, createdAt: Date.now()});
    this.f = null;
    this.flash('บันทึกเรียบร้อย ✨');
  },
  del(){
    if(confirm('ลบรายการนี้ออกจากคลัง?')){
      set(ref(db, this.base() + 'items/' + this.f.id), null);
      this.f = null;
      this.flash('ลบรายการแล้ว');
    }
  },
  toggleAllCart(val){
    const up = {};
    this.shopList.forEach(i => { up[i.id + '/inCart'] = !!val; });
    if(Object.keys(up).length) update(ref(db, this.base() + 'items'), up);
  },
  restock(){
    const up = {};
    this.shopList.filter(i => i.inCart).forEach(i => {
      const p = i.id + '/';
      up[p + 'qty'] = (Number(i.qty) || 0) + (Number(i.buy) || 1);
      up[p + 'onList'] = false;
      up[p + 'inCart'] = false;
      up[p + 'buy'] = 1;
    });
    update(ref(db, this.base() + 'items'), up).then(() => {
      this.burst(['🎉','✨','🛍️','🐰']);
      this.flash('เติมของเข้าคลังเรียบร้อย! 🎉');
    });
  },

  urlImg(){ if(this.f) this.f.img = (this.f.imgUrl || '').trim(); },
  pickImg(ev){
    const file = ev.target.files[0];
    if(!file || !this.f) return;
    const img = new Image();
    img.onload = () => {
      const S = 200, c = document.createElement('canvas'), x = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      const sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.width = c.height = Math.min(S, m);
      x.drawImage(img, sx, sy, m, m, 0, 0, c.width, c.height);
      this.f.img = c.toDataURL('image/jpeg', 0.6);
      this.f.imgUrl = '';
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    ev.target.value = '';
  },

  // บาร์โค้ด
  openScan(forForm = false){
    this.scanForForm = forForm;
    this.scan = true;
    this.torchOn = false;
    this.scanMsg = 'กำลังเปิดกล้อง...';
    this._handlingScan = false;

    this.$nextTick(async () => {
      await this.stopScannerOnly();
      try{
        if(typeof Html5Qrcode === 'undefined') throw Error('ไม่พบไลบรารีสแกน');
        const formats = typeof Html5QrcodeSupportedFormats !== 'undefined' ? [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.QR_CODE
        ] : undefined;

        this.scanner = new Html5Qrcode('reader', formats ? {formatsToSupport: formats, verbose: false} : {verbose: false});
        await this.scanner.start(
          {facingMode: 'environment'},
          {
            fps: 15,
            qrbox: {width: 280, height: 120},
            aspectRatio: 1.333,
            videoConstraints: {
              facingMode: {ideal: 'environment'},
              width: {ideal: 1280},
              height: {ideal: 720}
            }
          },
          code => this.onScan(code),
          () => {}
        );
        this.scanMsg = 'ถือบาร์โค้ดห่างกล้องประมาณ 10–15 ซม. ให้ตรงเส้นแดง';
      }catch(e){
        this.scanMsg = 'เปิดกล้องไม่ได้ กรุณาอนุญาตกล้องและเปิดผ่าน HTTPS';
      }
    });
  },

  getVideoTrack(){
    const vid = document.querySelector('#reader video');
    const stream = vid?.srcObject;
    return stream?.getVideoTracks?.()[0] || null;
  },

  async toggleTorch(){
    const next = !this.torchOn;
    try{
      const track = this.getVideoTrack();
      if(track && typeof track.applyConstraints === 'function'){
        await track.applyConstraints({advanced: [{torch: next}]});
        this.torchOn = next;
        this.flash(next ? 'เปิดไฟฉายแล้ว 🔦' : 'ปิดไฟฉายแล้ว');
        return;
      }
      if(this.scanner && typeof this.scanner.applyVideoConstraints === 'function'){
        await this.scanner.applyVideoConstraints({advanced: [{torch: next}]});
        this.torchOn = next;
        this.flash(next ? 'เปิดไฟฉายแล้ว 🔦' : 'ปิดไฟฉายแล้ว');
        return;
      }
      throw Error('unsupported');
    }catch{
      this.torchOn = false;
      this.flash('เบราว์เซอร์หรือกล้องเครื่องนี้ไม่รองรับการสั่งไฟฉายผ่านเว็บ');
    }
  },

  async stopScannerOnly(){
    const sc = this.scanner;
    this.scanner = null;
    if(sc){
      try{ if(sc.isScanning) await sc.stop(); }catch{}
      try{ await sc.clear(); }catch{}
    }
    const vid = document.querySelector('#reader video');
    if(vid && vid.srcObject){
      try{ vid.srcObject.getTracks().forEach(t => t.stop()); }catch{}
      vid.srcObject = null;
    }
  },

  async closeScan(){
    this.torchOn = false;
    this.scan = false;
    await this.stopScannerOnly();
  },

  async onScan(rawCode){
    if(this._handlingScan) return;
    this._handlingScan = true;
    const code = String(rawCode || '').trim();
    await this.closeScan();
    if(!code){ this._handlingScan = false; return; }
    if(navigator.vibrate) navigator.vibrate(40);
    if(this.scanForForm && this.f){
      this.f.barcode = code;
      this.flash('สแกนบาร์โค้ดแล้ว: ' + code);
      this._handlingScan = false;
      return;
    }
    const found = this.list.find(i => String(i.barcode || '').trim() === code);
    if(found){
      this.$nextTick(() => { this.hit = found.id; this._handlingScan = false; });
    }else{
      this.flash('ไม่พบบาร์โค้ด ' + code + ' เพิ่มใหม่ได้เลย');
      this.add({barcode: code});
      this._handlingScan = false;
    }
  },

  exportJson(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({version: 2, exportedAt: new Date().toISOString(), cats: this.allCats, items: this.items}, null, 1)], {type: 'application/json'}));
    a.download = 'stocky-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
  },
  importJson(ev){
    const file = ev.target.files[0];
    if(!file) return;
    file.text().then(t => {
      const d = JSON.parse(t);
      if(!d.items) throw Error();
      if(!confirm('เขียนทับสินค้าทั้งหมดด้วยไฟล์นี้?')) return;
      const tasks = [set(ref(db, this.base() + 'items'), d.items)];
      if(Array.isArray(d.cats) && d.cats.length) tasks.push(set(ref(db, this.base() + 'cats'), d.cats));
      return Promise.all(tasks).then(() => this.flash('นำเข้าสำเร็จ ✨'));
    }).catch(() => this.flash('ไฟล์ไม่ถูกต้อง'));
    ev.target.value = '';
  }
}));
Alpine.start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
