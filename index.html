let db = null;
const L = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const S = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

Alpine.data('app', () => ({
  tab:'inv',
  theme: localStorage.getItem('stocky_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'pink'),
  code: localStorage.getItem('roomCode') || '',
  cfg: L('fbcfg') || DEFAULT_CFG,
  ready:false, online:false, showAdv:false,
  items:{}, customCats:null,
  q:'', cat:'all', st:'all', sortBy:'name',
  f:null, catForm:null,
  scan:false, scanMsg:'', scanForForm:false, _handlingScan:false, _scanSeq:0, hitInfo:null, choice:null, drag:null,
  readerId:'reader-0',
  torchOn:false,
  hit:null, toast:'', scanner:null, sparkles:[],
  pending:0, undoData:null, updateReady:false, _f0:'', _ov:false, loaded:false, showTips:false, detail:null, toastAct:null, showRetired:false, houseName:'', houseDraft:'', lookup:{busy:false, src:'', miss:false, detail:''},
  setup:{code:'', cfg:'', err:''},
  themes:[
    {k:'pink', n:'ชมพูหวาน', dot:'bg-pink-400'},
    {k:'blue', n:'ฟ้าสดใส', dot:'bg-blue-500'},
    {k:'emerald', n:'เขียวมิ้นต์', dot:'bg-emerald-500'},
    {k:'violet', n:'ม่วงพาสเทล', dot:'bg-violet-500'},
    {k:'dark', n:'โหมดดำเข้ม', dot:'bg-zinc-900'}
  ],
  emojiChoices:['🛁','🧺','🧴','🍳','📦','🧻','🪥','🧼','💊','🐶','🐱','👶','🧹','☕','🍜','💄'],

  get ui(){ const k = THEMES[this.theme] ? this.theme : 'pink'; return {...THEMES[k], hero: HERO[k]}; },
  get allCats(){ return Array.isArray(this.customCats) && this.customCats.length ? this.customCats : DEFAULT_CATS; },

  lockPortrait(){
    try{
      if(screen?.orientation && typeof screen.orientation.lock === 'function'){
        screen.orientation.lock('portrait').catch(() => {});
      }
    }catch{}
  },

  applyThemeClass(){
    const isDark = !!this.ui.isDark;
    document.documentElement.classList.toggle('dark', isDark);
    document.documentElement.style.backgroundColor = this.ui.metaColor;
    document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', this.ui.metaColor);
    const statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if(statusBar) statusBar.setAttribute('content', isDark ? 'black-translucent' : 'default');
  },

  setTheme(k){
    if(!THEMES[k]) return;
    this.theme = k;
    localStorage.setItem('stocky_theme', k);
    this.applyThemeClass();
    this.flash('เปลี่ยนธีมเป็น ' + (this.themes.find(x=>x.k===k)?.n || k) + ' ✨');
  },

  init(){
    this.lockPortrait();
    this.applyThemeClass();
    ['gesturestart','gesturechange','gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
    window.addEventListener('stocky-update', () => { this.updateReady = true; });
    // ปุ่ม Back ของมือถือ: ปิด modal ชั้นบนสุดแทนการออกจากแอป
    const anyOpen = () => !!(this.f || this.catForm || this.scan || this.hit || this.detail || this.choice);
    this.$watch(anyOpen, open => {
      clearTimeout(this._ovT);
      if(open){
        if(!this._ov){ history.pushState({ov:1}, ''); this._ov = true; }
      }else{
        this._ovT = setTimeout(() => {
          if(this._ov && !anyOpen()){ this._ov = false; history.back(); }
        }, 150);
      }
    });
    window.addEventListener('popstate', () => {
      if(!this._ov) return;
      if(this.choice) this.choice = null;
      else if(this.hit) this.hit = null;
      else if(this.scan) this.closeScan();
      else if(this.catForm) this.catForm = null;
      else if(this.f) this.f = null;
      else if(this.detail) this.detail = null;
      if(anyOpen()) history.pushState({ov:1}, ''); else this._ov = false;
    });
    this.setup.code = this.code;
    this.setup.cfg = this.cfg ? JSON.stringify(this.cfg, null, 1) : '';
    if(!this.code || !this.cfg) return;
    this.items = L('cache_' + this.code) || {};
    this.loaded = L('cache_' + this.code) !== null;
    this.showTips = localStorage.getItem('stocky_tips') !== '1' && Object.keys(this.items).length <= 3;
    setTimeout(() => { this.loaded = true; }, 6000);
    this.customCats = L('cats_' + this.code) || null;
    this.houseName = localStorage.getItem('house_' + this.code) || '';
    this.houseDraft = this.houseName;
    this.ready = true;
    try{
      db = getDatabase(initializeApp(this.cfg));
      onValue(ref(db, '.info/connected'), s => this.online = !!s.val());
      onValue(ref(db, this.base() + 'items'), s => {
        this.items = s.val() || {};
        this.loaded = true;
        // แก้จำนวนติดลบ (เกิดเมื่อสองเครื่องกด − พร้อมกัน) กลับเป็น 0
        for(const [id, v] of Object.entries(this.items)){
          if(Number(v?.qty) < 0) update(ref(db, this.base() + 'items/' + id), {qty: 0}).catch(() => {});
        }
        S('cache_' + this.code, JSON.stringify(this.items));
        if(!this._catSyncTried && L('catSync1') !== 1 && Object.keys(this.items).length){ this._catSyncTried = true; this.catalogSyncAll(false); }
      }, e => { this.loaded = true; this.flash('อ่านข้อมูลไม่ได้: ' + e.code); });
      onValue(ref(db, this.base() + 'meta/name'), s => {
        const v = s.val();
        this.houseName = typeof v === 'string' ? v : '';
        this.houseDraft = this.houseName;
        S('house_' + this.code, this.houseName);
      });
      onValue(ref(db, this.base() + 'cats'), s => {
        const val = s.val();
        if(Array.isArray(val) && val.length){
          this.customCats = val;
          S('cats_' + this.code, JSON.stringify(val));
        }
      });
    }catch(e){
      this.flash('Firebase config ผิดพลาด');
    }
  },

  base(){ return 'households/' + this.code + '/'; },
  flash(m, ms = 2200, undo = null, act = null){
    this.toast = m; this.undoData = undo; this.toastAct = act;
    clearTimeout(this._t);
    this._t = setTimeout(() => { this.toast = ''; this.undoData = null; this.toastAct = null; }, ms);
  },
  runToastAct(){ const a = this.toastAct; this.toast = ''; this.toastAct = null; if(a) a.fn(); },
  // เลิกใช้ / ไม่ซื้อซ้ำ: ซ่อนจากหน้าหลักและลิสต์ซื้อ แต่เก็บข้อมูลไว้
  retire(i){
    const cur = this.items[i.id];
    if(!cur) return;
    const data = {...cur};
    this.save(i.id, {retired: true, onList: false, inCart: false, snoozed: false});
    this.flash('เลิกใช้ "' + (cur.name || '') + '" แล้ว', 6000, {id: i.id, data});
  },
  unretire(i){
    this.save(i.id, {retired: null});
    this.flash('กลับมาใช้ "' + (i.name || '') + '" อีกครั้งแล้ว ↩️');
  },
  undo(){
    const u = this.undoData;
    if(!u) return;
    set(ref(db, this.base() + 'items/' + u.id), u.data);
    this.undoData = null;
    this.flash('กู้คืนรายการแล้ว ↩️');
  },
  closeForm(){
    if(this.f && JSON.stringify(this.f) !== this._f0 && !confirm('ทิ้งการแก้ไขที่ยังไม่ได้บันทึก?')) return;
    this.f = null;
  },
  genCode(){
    const a = 'abcdefghjkmnpqrstuvwxyz23456789';
    return 'home-' + Array.from(crypto.getRandomValues(new Uint8Array(10)), b => a[b % a.length]).join('');
  },
  burst(){
    const batch = Array.from({length:8}, (_,idx)=>({
      id: Date.now() + idx + Math.random(),
      src: 'icon-180.png',
      x: 20 + Math.random()*60,
      y: 45 + Math.random()*25
    }));
    this.sparkles.push(...batch);
    setTimeout(()=>{ this.sparkles = this.sparkles.filter(s => !batch.includes(s)); }, 1000);
  },

  parseCfg(s){
    const m = s.match(/\{[^{}]*apiKey[^{}]*\}/);
    if(!m) throw Error('ไม่พบ apiKey ใน config');
    const o = {};
    for(const x of m[0].matchAll(/["']?([A-Za-z_]\w*)["']?\s*:\s*(?:"([^"]*)"|'([^']*)')/g)) o[x[1]] = x[2] ?? x[3];
    if(!o.apiKey) throw Error('ไม่พบ apiKey ใน config');
    return o;
  },
  saveSetup(){
    try{
      const code = this.setup.code.trim();
      if(!code) throw Error('กรอกรหัสบ้าน');
      if(code.length < 8) throw Error('รหัสบ้านต้องยาวอย่างน้อย 8 ตัวอักษร');
      if(/[.#$\[\]\/]/.test(code)) throw Error('รหัสบ้านห้ามมี . # $ [ ] /');
      const cfg = this.setup.cfg.trim() ? this.parseCfg(this.setup.cfg) : DEFAULT_CFG;
      if(!cfg || !cfg.databaseURL) throw Error('Config ต้องมี databaseURL');
      localStorage.setItem('roomCode', code);
      localStorage.setItem('fbcfg', JSON.stringify(cfg));
      location.reload();
    }catch(e){
      this.setup.err = e.message || 'Config ไม่ถูกต้อง';
    }
  },

  // ---------- หลายบาร์โค้ดต่อสินค้า (ล็อต / ขนาด / แพ็ก) ----------
  codeList(i){ return Object.entries(i?.codes || {}).map(([code, v]) => ({code, label: String(v?.l || ''), units: Math.max(1, Number(v?.u) || 1)})); },
  findByCode(code){
    code = String(code || '').trim();
    if(!code) return null;
    for(const i of this.allList){
      if(String(i.barcode || '').trim() === code) return {item: i, label: '', units: 1, primary: true};
      const c = i.codes && i.codes[code];
      if(c) return {item: i, label: String(c.l || ''), units: Math.max(1, Number(c.u) || 1), primary: false};
    }
    return null;
  },
  packInfo(i){ return this.codeList(i).filter(c => c.units > 1).sort((a, b) => a.units - b.units)[0] || null; },
  packStep(i){ return this.packInfo(i)?.units || 1; },
  buyStep(i, dir){
    const st = this.packStep(i), b = this.buyOf(i);
    return dir > 0 ? Math.floor(b / st) * st + st : Math.max(st, Math.ceil(b / st) * st - st);
  },
  packText(i){ const p = this.packInfo(i); return p ? '≈ ' + Math.ceil(this.buyOf(i) / p.units) + ' แพ็ก (' + p.units + ' ชิ้น/แพ็ก)' : ''; },
  incBy(i, n, quiet){
    n = Math.max(1, Math.floor(Number(n) || 1));
    const raw = Number(this.items[i.id]?.qty) || 0;
    const q = Math.max(0, raw) + n, min = Number(i.min) || 0;
    const patch = {qty: raw < 0 ? n : increment(n)};
    if(q > min && !this.expMeta(i)?.urgent) patch.onList = false;
    this.save(i.id, patch);
    if(!quiet) this.flash('เพิ่ม +' + n + ' ชิ้นแล้ว ✅');
  },
  addFormCode(code){
    if(!this.f) return;
    code = String(code || '').trim();
    if(!code) return;
    if(code === String(this.f.barcode || '').trim() || (this.f.codes || []).some(c => String(c.code).trim() === code)){ this.flash('มีเลขนี้ในรายการนี้แล้ว'); return; }
    this.f.codes = [...(this.f.codes || []), {code, label: '', units: 1}];
    this.flash('เพิ่มเลข ' + code + ' แล้ว ตั้งป้ายและจำนวนชิ้นได้ด้านล่าง');
  },
  async askScan(code){
    this.choice = {code, step: 'ask', name: '', src: '', q: '', pick: null, label: 'ล็อตใหม่', units: 1, img: '', looking: true};
    const cat = await this.catalogGet(code);                       // 1) ฐานข้อมูลกลาง (ห้องอื่นเคยเพิ่มไว้)
    if(!this.choice || this.choice.code !== code) return;
    if(cat){
      Object.assign(this.choice, {name: cat.name, src: 'ฐานข้อมูลกลาง', q: cat.name, img: cat.img, units: cat.units, looking: false});
      if(cat.label) this.choice.label = cat.label;
      return;
    }
    if(!/^\d{6,14}$/.test(code)){ this.choice.looking = false; return; }
    const r = await this.lookupProduct(code);                      // 2) Open Food Facts ฯลฯ
    if(!this.choice || this.choice.code !== code) return;
    this.choice.looking = false;
    if(r && !r.fail){ this.choice.name = r.name; this.choice.src = r.source; this.choice.q = r.name; }
  },
  get choiceHits(){
    const c = this.choice;
    if(!c) return [];
    const q = this.norm(c.q);
    const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'th');
    if(!q) return this.allList.slice().sort(byName).slice(0, 8);
    const tokens = String(c.q).split(/\s+/).map(t => this.norm(t)).filter(t => t.length >= 3);
    const rank = i => {
      const n = this.norm(i.name);
      return n === q ? 0 : n.startsWith(q) ? 1 : (n.includes(q) || q.includes(n) || tokens.some(t => n.includes(t))) ? 2 : 3;
    };
    return this.allList.map(i => ({i, r: rank(i)})).filter(x => x.r < 3)
      .sort((a, b) => a.r - b.r || byName(a.i, b.i)).slice(0, 8).map(x => x.i);
  },
  choicePick(h){ this.choice.pick = h.id; this.choice.step = 'link'; },
  choiceNew(){
    const c = this.choice; if(!c) return;
    this.choice = null;
    this.add({barcode: c.code, name: c.name || '', img: c.img || ''});
    if(c.name) this.lookup = {busy: false, src: c.src, miss: false, detail: ''};
    else this.lookupInto(c.code);
  },
  choiceLink(){
    const c = this.choice;
    if(!c || !c.pick || !this.items[c.pick]) return;
    const label = String(c.label || '').trim().slice(0, 20);
    const units = Math.max(1, Math.floor(Number(c.units) || 1));
    this.save(c.pick, {['codes/' + c.code]: {l: label, u: units}});
    const pi = this.items[c.pick];
    if(pi) this.catalogPublish(c.code, pi.name, pi.img, units, label);
    this.choice = null;
    this.hitInfo = {id: c.pick, label, units, code: c.code};
    this.hit = c.pick;
    this.flash('ผูกเลข ' + c.code + ' กับรายการเดิมแล้ว 🔗');
  },
  cloneFrom(i){
    this.detail = null;
    this.add({name: i.name, cat: this.resolveCatKey(i.cat), price: i.price || 0, min: i.min || 0, buyEach: i.buyEach || ''});
    this.flash('คัดลอกจาก "' + i.name + '" แก้ชื่อส่วนที่ต่าง (สูตร/กลิ่น) ได้เลย', 4000);
  },

  // จำนวนที่ควรซื้อ: ที่ผู้ใช้กดปรับ > "ซื้อครั้งละ" ที่ตั้งไว้ > คำนวณให้พอพ้นจุดเตือน (ราว 2 เท่าของจุดเตือน)
  buyOf(i){
    const b = Number(i?.buy); if(b > 0) return b;
    const e = Number(i?.buyEach); if(e > 0) return e;
    const q = Math.max(0, Number(i?.qty) || 0), m = Number(i?.min) || 0;
    const base = m > 0 ? Math.max(1, Math.max(m * 2, m + 1) - q) : 1;
    const pk = this.packInfo(i);
    return pk ? Math.ceil(base / pk.units) * pk.units : base;   // ถ้ามีเลขแพ็ก ปัดขึ้นเป็นจำนวนเต็มแพ็ก
  },
  getState(i){
    const qty = Number(i?.qty) || 0;
    const min = Number(i?.min) || 0;
    if(qty <= 0) return 'out';
    if(min > 0 && qty <= min) return 'low';
    return 'ok';
  },
  stateMeta(i){
    const s = this.getState(i);
    if(s === 'out') return {k:'out', rank:0, label:'หมดแล้ว', bar:'bg-rose-500', badge:'bg-rose-500/15 text-rose-600 dark:text-rose-400'};
    if(s === 'low') return {k:'low', rank:1, label:'ใกล้หมด', bar:'bg-amber-400', badge:'bg-amber-400/20 text-amber-700 dark:text-amber-300'};
    return {k:'ok', rank:2, label:'มีของอยู่', bar:'bg-emerald-500', badge:'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'};
  },
  expMeta(i){
    if(!i?.exp) return null;
    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(i.exp + 'T00:00:00');
    if(Number.isNaN(target.getTime())) return null;
    const diffDays = Math.round((target - today) / 864e5);
    if(diffDays < 0) return {urgent:true, days:diffDays, label:'หมดอายุแล้ว ('+Math.abs(diffDays)+' วัน)', badge:'bg-rose-500/15 text-rose-600 dark:text-rose-400'};
    if(diffDays === 0) return {urgent:true, days:0, label:'หมดอายุวันนี้', badge:'bg-rose-500/15 text-rose-600 dark:text-rose-400'};
    if(diffDays <= 7) return {urgent:true, days:diffDays, label:'หมดใน '+diffDays+' วัน', badge:'bg-amber-400/20 text-amber-700 dark:text-amber-300'};
    return {urgent:false, days:diffDays, label:'EXP '+target.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}), badge:'bg-slate-500/10 text-slate-600 dark:text-slate-300'};
  },
  countByState(k){ return this.list.filter(i => this.getState(i) === k).length; },

  get allList(){ return Object.entries(this.items).map(([id, v]) => ({id, ...v, qty: Math.max(0, Number(v?.qty) || 0)})); },
  get list(){ return this.allList.filter(i => !i.retired); },
  get retiredList(){ return this.allList.filter(i => i.retired).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th')); },
  get filtered(){
    const q = this.q.trim().toLowerCase();
    const list = this.list.filter(i =>
      (this.cat === 'all' || this.resolveCatKey(i.cat) === this.cat) &&
      (this.st === 'all' || this.getState(i) === this.st) &&
      (!q ||
        (i.name || '').toLowerCase().includes(q) ||
        (i.note || '').toLowerCase().includes(q) ||
        String(i.barcode || '').includes(q) || Object.keys(i.codes || {}).some(k => k.includes(q)))
    );
    return list.sort((a, b) => {
      if(this.sortBy === 'stock'){
        return this.stateMeta(a).rank - this.stateMeta(b).rank || (a.name || '').localeCompare(b.name || '', 'th');
      }
      if(this.sortBy === 'exp'){
        const da = a.exp ? new Date(a.exp + 'T00:00:00').getTime() : Number.MAX_SAFE_INTEGER;
        const dbTime = b.exp ? new Date(b.exp + 'T00:00:00').getTime() : Number.MAX_SAFE_INTEGER;
        return da - dbTime || (a.name || '').localeCompare(b.name || '', 'th');
      }
      return (a.name || '').localeCompare(b.name || '', 'th');
    });
  },
  resolveCatKey(k){
    const validKeys = new Set(this.allCats.map(c => c.k));
    if(validKeys.has(k)) return k;
    return this.allCats[0]?.k || '';
  },
  byCat(k){
    return this.filtered.filter(i => this.resolveCatKey(i.cat) === k);
  },
  get detailItem(){ const v = this.detail && this.items[this.detail]; return v ? {id: this.detail, ...v, qty: Math.max(0, Number(v.qty) || 0)} : null; },
  openDetail(i){ this.detail = i.id; },
  editFromDetail(){ const i = this.detailItem; if(!i) return; this.detail = null; this.edit(i); },
  thDate(v){ const d = new Date(v + 'T00:00:00'); return isNaN(d) ? v : d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'}); },
  detailRows(i){
    const m = Number(i.min) || 0, e = this.expMeta(i);
    return [
      ['เตือนเมื่อเหลือ', m > 0 ? '≤ ' + m : 'ไม่ได้ตั้ง'],
      ['ราคา', Number(i.price) > 0 ? '฿' + this.fmt(i.price) : '—'],
      ['วันหมดอายุ', i.exp ? this.thDate(i.exp) + (e ? ' (' + e.label.replace(/^EXP /, '') + ')' : '') : '—'],
      ['แกะล่าสุด', i.lastOpened ? this.ago(i.lastOpened) : 'ยังไม่เคยแกะ'],
      ['บาร์โค้ด', i.barcode || '—'],
      i.retired ? ['สถานะ', '🚫 เลิกใช้แล้ว'] : ['ลิสต์ซื้อ', this.onList(i) ? 'อยู่ในลิสต์ (ซื้อ ' + this.buyOf(i) + ')' : 'ไม่อยู่ในลิสต์']
    ];
  },
  catOf(k){
    return this.allCats.find(c => c.k === k) || this.allCats[0] || {k:'', n:'', e:'📦'};
  },

  onList(i){
    if(i.snoozed) return false;
    const expUrgent = !!this.expMeta(i)?.urgent && i.expAck !== i.exp;
    if(i.onList === false && this.getState(i) === 'ok' && !expUrgent) return false;
    return this.getState(i) !== 'ok' || expUrgent || !!i.onList;
  },
  get shopList(){
    return this.list
      .filter(i => this.onList(i))
      .sort((a, b) => !!a.inCart - !!b.inCart || (a.name || '').localeCompare(b.name || '', 'th'));
  },
  // วิเคราะห์ความถี่การแกะจากบันทึก log แล้วแนะนำจุดเตือน (พอใช้ ~7 วัน)
  usage(i){
    const ts = Object.keys(i?.log || {}).map(Number).filter(Boolean).sort((a, b) => a - b);
    if(ts.length < 4) return null;
    const span = (ts[ts.length - 1] - ts[0]) / 864e5;
    if(span < 3 || (Date.now() - ts[ts.length - 1]) / 864e5 > 90) return null;
    const perDay = (ts.length - 1) / span;
    return {perWeek: perDay * 7, min: Math.max(1, Math.min(99, Math.ceil(perDay * 7)))};
  },
  applyMin(i){
    const u = this.usage(i);
    if(!u) return;
    this.save(i.id, {min: u.min});
    this.flash('ตั้งเตือนเมื่อเหลือ ≤ ' + u.min + ' แล้ว 💡');
  },
  dismissTips(){ S('stocky_tips', '1'); this.showTips = false; },
  get expSoon(){ return this.list.filter(i => this.expMeta(i)?.urgent).length; },
  pct(k){ const n = this.list.length; return n ? this.countByState(k) / n * 100 : 0; },
  level(i){ const q = Math.max(0, Number(i.qty) || 0), m = Number(i.min) || 0; return Math.round(Math.min(1, q / Math.max(m * 2, q, 1)) * 100); },
  shopByCat(k){ return this.shopList.filter(i => this.resolveCatKey(i.cat) === k).sort((a, b) => (!!a.inCart) - (!!b.inCart)); },
  shopCatTotal(k){ return this.shopByCat(k).reduce((t, i) => t + (Number(i.price) || 0) * this.buyOf(i), 0); },
  get checkedCount(){ return this.shopList.filter(i => i.inCart).length; },
  get total(){ return this.shopList.reduce((s, i) => s + (Number(i.price) || 0) * this.buyOf(i), 0); },
  get totalChecked(){ return this.shopList.filter(i => i.inCart).reduce((s, i) => s + (Number(i.price) || 0) * this.buyOf(i), 0); },
  fmt(n){ return Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: 2}); },
  ago(t){ const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'วันนี้' : d + ' วันก่อน'; },

  saveHouseName(){
    const n = String(this.houseDraft || '').trim().slice(0, 24);
    this.houseName = n; this.houseDraft = n;
    S('house_' + this.code, n);
    set(ref(db, this.base() + 'meta/name'), n || null).catch(() => {});
    this.flash(n ? 'ตั้งชื่อบ้านแล้ว 🏠' : 'ล้างชื่อบ้านแล้ว');
  },
  moveCat(c, dir){ const i = this.allCats.findIndex(x => x.k === c.k); this.moveCatTo(i, i + dir); },
  moveCatTo(from, to){
    const next = [...this.allCats];
    if(from < 0 || to < 0 || from >= next.length || to >= next.length || from === to) return;
    const [m] = next.splice(from, 1);
    next.splice(to, 0, m);
    this.customCats = next;
    S('cats_' + this.code, JSON.stringify(next));
    set(ref(db, this.base() + 'cats'), next).catch(() => {});
  },
  // แถวที่ตัวชี้อยู่ (ตำแหน่งบนหน้า) ใช้เป็นตำแหน่งปลายทาง
  dragTarget(pageY, rows){
    for(let i = 0; i < rows.length; i++){ if(pageY < rows[i].top + rows[i].h) return i; }
    return Math.max(0, rows.length - 1);
  },
  // ลากเรียงลำดับหมวด (pointer events ใช้ได้ทั้งนิ้วและเมาส์) เลื่อนหน้าให้เองเมื่อลากใกล้ขอบจอ
  dragStart(ev, idx){
    if(ev.button > 0) return;
    ev.preventDefault();
    const rows = [...document.querySelectorAll('[data-cat-row]')].map(r => { const b = r.getBoundingClientRect(); return {top: b.top + window.scrollY, h: b.height}; });
    const y0 = ev.clientY, sy0 = window.scrollY;
    let lastY = y0, raf = 0;
    this.drag = {from: idx, over: idx, dy: 0};
    const update = () => {
      if(!this.drag) return;
      this.drag.dy = (lastY - y0) + (window.scrollY - sy0);
      this.drag.over = this.dragTarget(lastY + window.scrollY, rows);
    };
    const loop = () => {
      if(!this.drag) return;
      if(lastY < 90) window.scrollBy(0, -10); else if(lastY > window.innerHeight - 90) window.scrollBy(0, 10);
      update();
      raf = requestAnimationFrame(loop);
    };
    const move = e => { lastY = e.clientY; update(); };
    const finish = apply => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      cancelAnimationFrame(raf);
      const d = this.drag; this.drag = null;
      if(apply && d && d.over !== d.from) this.moveCatTo(d.from, d.over);
    };
    const up = () => finish(true), cancel = () => finish(false);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', cancel);
    raf = requestAnimationFrame(loop);
  },
  openCatModal(c = null){
    this.catForm = c ? {k: c.k, n: c.n, e: c.e, isEdit: true} : {k: 'cat_' + Date.now(), n: '', e: '✨', isEdit: false};
  },
  saveCat(){
    if(!this.catForm || !this.catForm.n.trim()) return this.flash('กรอกชื่อหมวดหมู่ก่อน');
    const next = [...this.allCats];
    const clean = {k: this.catForm.k, n: this.catForm.n.trim(), e: (this.catForm.e || '📦').trim()};
    const idx = next.findIndex(x => x.k === clean.k);
    if(idx >= 0) next[idx] = clean; else next.push(clean);
    this.customCats = next;
    S('cats_' + this.code, JSON.stringify(next));
    set(ref(db, this.base() + 'cats'), next).catch(() => {});
    if(this.f && !this.catForm.isEdit) this.f.cat = clean.k;
    this.catForm = null;
    this.flash('บันทึกหมวดหมู่แล้ว ' + clean.e);
  },
  delCat(c){
    if(this.allCats.length <= 1) return this.flash('ต้องมีหมวดหมู่อย่างน้อย 1 หมวด');
    if(!confirm('ลบหมวด "' + c.n + '" ? (สินค้าในหมวดนี้จะย้ายไปอยู่หมวดแรกแทน)')) return;
    const next = this.allCats.filter(x => x.k !== c.k);
    this.customCats = next;
    S('cats_' + this.code, JSON.stringify(next));
    set(ref(db, this.base() + 'cats'), next).catch(() => {});
    if(this.cat === c.k) this.cat = 'all';
    this.flash('ลบหมวดหมู่แล้ว');
  },

  save(id, patch){
    this.pending++;
    update(ref(db, this.base() + 'items/' + id), patch)
      .catch(e => this.flash('บันทึกไม่ได้: ' + e.code))
      .finally(() => { this.pending = Math.max(0, this.pending - 1); });
  },
  // ใช้ increment() ของ Firebase: 2 คนกดพร้อมกันก็ไม่ทับกัน
  dec(i){
    const cur = Number(i.qty) || 0;
    if(cur <= 0) return;
    const q = cur - 1;
    const now = Date.now();
    const patch = {qty: increment(-1), lastOpened: now, snoozed: false};
    patch['log/' + now] = 1;
    const old = Object.keys(i.log || {}).sort();
    old.slice(0, Math.max(0, old.length - 19)).forEach(k => { patch['log/' + k] = null; });
    if(q === 0 || (Number(i.min) > 0 && q <= Number(i.min))) patch.onList = true;
    this.save(i.id, patch);
    if(q === 0) this.flash('หมดแล้ว เข้าลิสต์ซื้อ 🛒', 5000, null, {label: 'ไม่ซื้อแล้ว', fn: () => this.retire(i)});
  },
  inc(i){ this.incBy(i, 1, true); },
  norm(v){ return String(v || '').toLowerCase().replace(/\s+/g, ''); },
  // แนะนำจากของเดิมตอนพิมพ์ชื่อ (เฉพาะตอนเพิ่มใหม่) รวมของที่เลิกใช้แล้วด้วย
  get nameHints(){
    if(!this.f || this.f.id) return [];
    const q = this.norm(this.f.name);
    if(!q) return [];
    const rank = i => { const n = this.norm(i.name); return n === q ? 0 : n.startsWith(q) ? 1 : n.includes(q) ? 2 : 3; };
    return this.allList.map(i => ({i, r: rank(i)})).filter(x => x.r < 3)
      .sort((a, b) => a.r - b.r || (!!a.i.retired - !!b.i.retired) || (a.i.name || '').localeCompare(b.i.name || '', 'th'))
      .slice(0, 5).map(x => x.i);
  },
  get nameExact(){ const h = this.nameHints[0]; return !!h && this.norm(h.name) === this.norm(this.f?.name); },
  pickHint(h){ this.f = null; this.detail = h.id; },
  useHint(h){ if(!this.f) return; this.f.name = h.name; this.f.cat = this.resolveCatKey(h.cat); },
  add(pre = {}){
    const defaultCat = this.cat !== 'all' ? this.cat : (this.allCats[0]?.k || '');
    this.lookup = {busy:false, src:'', miss:false, detail:''};
    this.f = {name:'', cat:defaultCat, barcode:'', img:'', imgUrl:'', qty:1, min:0, price:0, exp:'', note:'', codes:[], ...pre};
    this._f0 = JSON.stringify(this.f);
  },
  edit(i){ this.lookup = {busy:false, src:'', miss:false, detail:''}; this.f = {...i, codes: this.codeList(i), cat: this.resolveCatKey(i.cat), exp: i.exp || '', note: i.note || '', imgUrl: /^https?:/.test(i.img || '') ? i.img : ''}; this._f0 = JSON.stringify(this.f); },
  commit(){
    const f = this.f;
    if(!f || !f.name || !f.name.trim()) return this.flash('ใส่ชื่อสินค้าก่อนน้า');
    const bc = String(f.barcode || '').trim();
    const codesObj = {};
    for(const c of (f.codes || [])){
      const code = String(c.code || '').replace(/[.#$\[\]\/\s]/g, '');
      if(!code || code === bc || codesObj[code]) continue;
      codesObj[code] = {l: String(c.label || '').trim().slice(0, 20), u: Math.max(1, Math.floor(Number(c.units) || 1))};
    }
    if(!f.id){
      const dupName = this.allList.find(i => this.norm(i.name) === this.norm(f.name));
      if(dupName && !confirm('มี "' + dupName.name + '"' + (dupName.retired ? ' (เลิกใช้แล้ว)' : '') + ' อยู่ในรายการแล้ว ต้องการเพิ่มซ้ำจริงไหม?')) return;
    }
    const clash = [bc, ...Object.keys(codesObj)].filter(Boolean).map(c => ({c, h: this.findByCode(c)})).find(x => x.h && x.h.item.id !== f.id);
    if(clash && !confirm('เลข ' + clash.c + ' ถูกใช้กับ "' + clash.h.item.name + '" อยู่แล้ว ต้องการผูกซ้ำจริงไหม?')) return;
    const qty = Number(f.qty) || 0;
    const min = Number(f.min) || 0;
    const exp = String(f.exp || '').trim();
    const note = String(f.note || '').trim();
    const prevItem = f.id ? this.items[f.id] : null;
    const ackKept = !!prevItem && !!exp && prevItem.expAck === exp;
    const expUrgent = !!this.expMeta({exp})?.urgent && !ackKept;
    const buyEach = Math.floor(Number(f.buyEach) || 0);
    const data = {
      name: f.name.trim(),
      cat: this.resolveCatKey(f.cat),
      barcode: String(f.barcode || '').trim(),
      img: f.img || '',
      qty,
      min,
      price: Number(f.price) || 0,
      exp,
      note,
      onList: qty <= 0 || (min > 0 && qty <= min) || expUrgent ? true : !!f.onList,
      snoozed: false,
      buyEach: buyEach > 0 ? buyEach : null,
      codes: Object.keys(codesObj).length ? codesObj : null
    };
    if(prevItem && prevItem.expAck && !ackKept) data.expAck = null;
    if(f.id) this.save(f.id, data);
    else set(push(ref(db, this.base() + 'items')), {...data, createdAt: Date.now()});
    this.catalogPublishItem({...data, codes: codesObj});
    this.f = null;
    this.flash('บันทึกเรียบร้อย ✨');
  },
  del(){
    const id = this.f.id, data = {...this.items[id]};
    set(ref(db, this.base() + 'items/' + id), null);
    this.f = null;
    this.flash('ลบรายการแล้ว', 6000, {id, data});
  },
  toggleAllCart(val){
    const up = {};
    this.shopList.forEach(i => { up[i.id + '/inCart'] = !!val; });
    if(Object.keys(up).length) update(ref(db, this.base() + 'items'), up);
  },
  restock(){
    const up = {};
    let cleared = 0, kept = 0;
    this.shopList.filter(i => i.inCart).forEach(i => {
      const p = i.id + '/';
      const prev = Math.max(0, Number(i.qty) || 0);
      up[p + 'qty'] = prev + this.buyOf(i);
      up[p + 'onList'] = false;
      up[p + 'snoozed'] = false;
      up[p + 'inCart'] = false;
      up[p + 'buy'] = null;
      const em = this.expMeta(i);
      if(i.exp){
        if(prev <= 0 || (em && em.days < 0)){ up[p + 'exp'] = ''; up[p + 'expAck'] = null; cleared++; }   // ของเก่าหมด/เลยกำหนด: ให้ใส่วันของล็อตใหม่
        else if(em && em.urgent){ up[p + 'expAck'] = i.exp; kept++; }                                  // ของเก่ายังเหลือ: เก็บวันเดิมไว้เตือน แต่ไม่ดึงกลับเข้าลิสต์ซื้อ
      }
    });
    update(ref(db, this.base() + 'items'), up).then(() => {
      this.burst();
      const extra = [cleared ? 'ล้างวันหมดอายุเก่า ' + cleared + ' รายการ (ใส่วันใหม่ได้ที่การ์ด)' : '', kept ? 'เก็บวันหมดอายุของที่เหลือเดิมไว้ ' + kept + ' รายการ' : ''].filter(Boolean).join(' · ');
      this.flash(extra ? 'เติมของแล้ว 🎉 ' + extra : 'เติมของเข้าคลังเรียบร้อย! 🎉', extra ? 5000 : 2200);
    });
  },

  urlImg(){ if(this.f) this.f.img = (this.f.imgUrl || '').trim(); },
  pickImg(ev){
    const file = ev.target.files[0];
    if(!file || !this.f) return;
    const img = new Image();
    img.onload = () => {
      const S = 200, c = document.createElement('canvas'), x = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      const sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.width = c.height = Math.min(S, m);
      x.drawImage(img, sx, sy, m, m, 0, 0, c.width, c.height);
      this.f.img = c.toDataURL('image/jpeg', 0.6);
      this.f.imgUrl = '';
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    ev.target.value = '';
  },

  // บาร์โค้ด: ปรับกรอบและโฟกัสให้สแกนระยะไกลขึ้นได้
  openScan(forForm = false){
    this.lockPortrait();
    const seq = ++this._scanSeq;
    this.scanForForm = forForm;
    this.readerId = 'reader-' + seq;
    this.scan = true;
    this.torchOn = false;
    this.scanMsg = 'กำลังเปิดกล้อง...';
    this._handlingScan = false;

    this.$nextTick(async () => {
      await this.stopScannerOnly();
      if(seq !== this._scanSeq || !this.scan) return;
      try{
        if(typeof Html5Qrcode === 'undefined') throw Error('ไม่พบไลบรารีสแกน');
        const formats = typeof Html5QrcodeSupportedFormats !== 'undefined' ? [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.QR_CODE
        ] : undefined;

        const inst = new Html5Qrcode(this.readerId, formats ? {formatsToSupport: formats, verbose: false} : {verbose: false});
        this.scanner = inst;
        await inst.start(
          {facingMode: 'environment'},
          {
            fps: 15,
            qrbox: (w) => ({width: Math.min(320, Math.floor(w * 0.9)), height: 150}),
            videoConstraints: {
              facingMode: {ideal: 'environment'},
              width: {ideal: 1280},
              height: {ideal: 720}
            }
          },
          code => this.onScan(code),
          () => {}
        );
        if(seq !== this._scanSeq || !this.scan){
          await this.stopScannerOnly();
          return;
        }
        try{
          const track = this.getVideoTrack();
          if(track && typeof track.applyConstraints === 'function'){
            await track.applyConstraints({advanced: [{focusMode: 'continuous'}]});
          }
        }catch{}
        this.scanMsg = 'ถือห่างจากบาร์โค้ดได้พอประมาณ (15–35 ซม.) ให้ตรงเส้นแดง';
      }catch(e){
        if(seq === this._scanSeq){
          this.scanMsg = 'เปิดกล้องไม่ได้ กรุณาอนุญาตกล้องและเปิดผ่าน HTTPS';
        }
      }
    });
  },

  getVideoTrack(){
    const vid = document.querySelector('#' + this.readerId + ' video') || document.querySelector('video');
    const stream = vid?.srcObject;
    return stream?.getVideoTracks?.()[0] || null;
  },

  async toggleTorch(){
    const next = !this.torchOn;
    try{
      const track = this.getVideoTrack();
      if(track && typeof track.applyConstraints === 'function'){
        await track.applyConstraints({advanced: [{torch: next}]});
        this.torchOn = next;
        this.flash(next ? 'เปิดไฟฉายแล้ว 🔦' : 'ปิดไฟฉายแล้ว');
        return;
      }
      if(this.scanner && typeof this.scanner.applyVideoConstraints === 'function'){
        await this.scanner.applyVideoConstraints({advanced: [{torch: next}]});
        this.torchOn = next;
        this.flash(next ? 'เปิดไฟฉายแล้ว 🔦' : 'ปิดไฟฉายแล้ว');
        return;
      }
      throw Error('unsupported');
    }catch{
      this.torchOn = false;
      this.flash('เบราว์เซอร์หรือกล้องเครื่องนี้ไม่รองรับการสั่งไฟฉายผ่านเว็บ');
    }
  },

  async stopScannerOnly(){
    const sc = this.scanner;
    this.scanner = null;
    if(sc){
      try{
        if(sc.isScanning) await sc.stop();
      }catch{}
      try{
        await sc.clear();
      }catch{}
    }
    document.querySelectorAll('[id^="reader"] video').forEach(vid => {
      if(vid && vid.srcObject){
        try{ vid.srcObject.getTracks().forEach(t => t.stop()); }catch{}
        vid.srcObject = null;
      }
    });
  },

  async closeScan(){
    this._scanSeq++;
    this.torchOn = false;
    this.scan = false;
    await this.stopScannerOnly();
  },

  // ---------- ฐานข้อมูลสินค้ากลาง (ใช้ร่วมกันทุกห้อง) ----------
  // เก็บที่ /catalog/{บาร์โค้ด} = {n: ชื่อ, i: รูป, u: จำนวนชิ้น/แพ็ก, l: ป้าย} ไม่มีสต็อก/ราคา/หมวดของบ้านใครปนไปด้วย
  catKey(code){ const k = String(code || '').trim(); return (k.length >= 4 && k.length <= 40 && !/[.#$\[\]\/\s]/.test(k)) ? k : ''; },
  async catalogGet(code){
    const k = this.catKey(code);
    if(!k || !db) return null;
    this._catCache = this._catCache || {};
    if(this._catCache[k] !== undefined) return this._catCache[k];
    try{
      const snap = await Promise.race([get(ref(db, 'catalog/' + k)), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
      const v = snap.val();
      const r = v && typeof v.n === 'string' && v.n ? {name: v.n, img: typeof v.i === 'string' ? v.i : '', units: Math.max(1, Number(v.u) || 1), label: typeof v.l === 'string' ? v.l : ''} : null;
      this._catCache[k] = r;
      return r;
    }catch{ return null; }   // ออฟไลน์/หมดเวลา: ข้ามไปใช้แหล่งข้อมูลอื่น
  },
  // เพิ่มเข้าฐานข้อมูลกลางแบบไม่ทับของเดิม: ยังไม่มีเลขนี้ → เพิ่มใหม่ / มีแล้วแต่ยังไม่มีรูปและเรามีรูป → เติมรูปให้
  async catalogPublish(code, name, img, units, label){
    const k = this.catKey(code);
    name = String(name || '').trim().slice(0, 80);
    if(!k || !name || !db) return;
    img = (typeof img === 'string' && img.length <= 30000 && /^(data:image\/|https?:\/\/)/.test(img)) ? img : '';
    try{
      const old = (await get(ref(db, 'catalog/' + k))).val();
      if(!old){
        const v = {n: name, t: Date.now()};
        if(img) v.i = img;
        if(Number(units) > 1) v.u = Math.floor(Number(units));
        if(label) v.l = String(label).slice(0, 20);
        await set(ref(db, 'catalog/' + k), v);
      }else if(img && !old.i){
        await update(ref(db, 'catalog/' + k), {i: img});
      }else return;
      if(this._catCache) delete this._catCache[k];
    }catch{}
  },
  async catalogPublishItem(it){
    if(!it || !it.name) return;
    const bc = String(it.barcode || '').trim();
    if(bc) await this.catalogPublish(bc, it.name, it.img, 1, '');
    for(const c of this.codeList(it)) await this.catalogPublish(c.code, it.name, it.img, c.units, c.label);
  },
  async catalogSyncAll(manual){
    const list = Object.values(this.items || {}).filter(i => i && i.name && !i.retired);
    for(const it of list) await this.catalogPublishItem(it);
    S('catSync1', '1');
    if(manual) this.flash('แชร์สินค้าเข้าฐานข้อมูลกลางแล้ว 🌐');
  },

  // ค้นชื่อสินค้าจาก Open Food Facts (API v3) แล้วลอง Beauty / Products / Pet Food Facts พร้อมกัน
  // (ยังไม่ดึงรูป)
  async lookupProduct(code){
    const FIELDS = 'product_name,product_name_th,brands,quantity';
    const SRC = [
      ['https://world.openfoodfacts.org', 'Open Food Facts'],
      ['https://world.openbeautyfacts.org', 'Open Beauty Facts'],
      ['https://world.openproductsfacts.org', 'Open Products Facts'],
      ['https://world.openpetfoodfacts.org', 'Open Pet Food Facts']
    ];
    const ask = async ([base, label]) => {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 8000);
      try{
        const res = await fetch(base + '/api/v3/product/' + encodeURIComponent(code) + '.json?fields=' + FIELDS, {signal: ctl.signal});
        let d = null;
        try{ d = await res.json(); }catch{}
        const p = d && d.product;
        if(p && (p.product_name || p.product_name_th || p.brands)) return {label, p};
        return {label, err: res.ok ? 'ไม่มีชื่อสินค้า' : 'ไม่พบ (' + res.status + ')'};
      }catch(e){
        return {label, err: e && e.name === 'AbortError' ? 'หมดเวลา' : 'เชื่อมต่อไม่ได้'};
      }
      finally{ clearTimeout(t); }
    };
    const jobs = SRC.map(ask);              // ยิงพร้อมกัน ไม่ต้องรอทีละแหล่ง
    const results = [await jobs[0], ...(await Promise.all(jobs.slice(1)))];
    const hit = results.find(r => r.p);     // ลำดับแรก (Food) มาก่อน
    if(!hit) return {fail: results.map(r => r.label + ': ' + r.err).join(' · ')};
    const p = hit.p;
    let name = String(p.product_name_th || p.product_name || '').trim();
    const brand = String(p.brands || '').split(',')[0].trim();
    const qty = String(p.quantity || '').trim();
    if(brand && name && !name.toLowerCase().includes(brand.toLowerCase())) name = brand + ' ' + name;
    else if(brand && !name) name = brand;
    if(qty && name && !name.toLowerCase().includes(qty.toLowerCase())) name += ' ' + qty;
    return {name: name.slice(0, 80), source: hit.label};
  },
  async lookupInto(code){
    code = String(code || '').trim();
    if(!this.f) return;
    const cat = await this.catalogGet(code);
    if(!this.f || String(this.f.barcode || '').trim() !== code) return;
    if(cat){
      let filled = false;
      if(!String(this.f.name || '').trim()){ this.f.name = cat.name; filled = true; }
      if(!this.f.img && cat.img){ this.f.img = cat.img; this.f.imgUrl = /^https?:/.test(cat.img) ? cat.img : ''; filled = true; }
      this.lookup = {busy:false, src: filled ? 'ฐานข้อมูลกลาง' : '', miss:false, detail:''};
      if(filled) return;
    }
    if(!/^\d{6,14}$/.test(code)){ this.lookup = {busy:false, src:'', miss:true, detail:'บาร์โค้ดต้องเป็นตัวเลข 6–14 หลัก'}; return; }
    this.lookup = {busy:true, src:'', miss:false, detail:''};
    const r = await this.lookupProduct(code);
    if(!this.f || String(this.f.barcode || '').trim() !== code){ this.lookup = {busy:false, src:'', miss:false, detail:''}; return; }
    if(r.fail){ this.lookup = {busy:false, src:'', miss:true, detail:r.fail}; return; }
    let filled = false;
    if(!String(this.f.name || '').trim() && r.name){ this.f.name = r.name; filled = true; }
    this.lookup = {busy:false, src: filled ? r.source : '', miss:false, detail:''};
  },

  async onScan(rawCode){
    if(this._handlingScan) return;
    this._handlingScan = true;
    const code = String(rawCode || '').trim();
    await this.closeScan();
    if(!code){ this._handlingScan = false; return; }
    if(navigator.vibrate) navigator.vibrate(40);
    if(this.scanForForm === 'code' && this.f){
      this.addFormCode(code);
      this._handlingScan = false;
      return;
    }
    if(this.scanForForm && this.f){
      this.f.barcode = code;
      this.flash('สแกนบาร์โค้ดแล้ว: ' + code);
      this._handlingScan = false;
      this.lookupInto(code);
      return;
    }
    const hitInfo = this.findByCode(code);
    const found = hitInfo && hitInfo.item;
    if(found && found.retired){
      this.$nextTick(() => {
        if(confirm('"' + found.name + '" เลิกใช้ไปแล้ว ให้กลับมาใช้อีกครั้งไหม?')){ this.unretire(found); this.hitInfo = {id: found.id, label: hitInfo.label, units: hitInfo.units, code}; this.hit = found.id; }
        this._handlingScan = false;
      });
    }else if(found){
      this.$nextTick(() => { this.hitInfo = {id: found.id, label: hitInfo.label, units: hitInfo.units, code}; this.hit = found.id; this._handlingScan = false; });
    }else{
      this._handlingScan = false;
      this.askScan(code);
    }
  },

  exportJson(){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({version: 2, exportedAt: new Date().toISOString(), cats: this.allCats, items: this.items}, null, 1)], {type: 'application/json'}));
    a.download = 'stocky-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
  },
  importJson(ev){
    const file = ev.target.files[0];
    if(!file) return;
    file.text().then(t => {
      const d = JSON.parse(t);
      if(!d.items || typeof d.items !== 'object' || !Object.values(d.items).every(v => v && typeof v === 'object' && typeof v.name === 'string')) throw Error();
      if(!confirm('เขียนทับสินค้าทั้งหมดด้วยไฟล์นี้?')) return;
      const tasks = [set(ref(db, this.base() + 'items'), d.items)];
      if(Array.isArray(d.cats) && d.cats.length) tasks.push(set(ref(db, this.base() + 'cats'), d.cats));
      return Promise.all(tasks).then(() => this.flash('นำเข้าสำเร็จ ✨'));
    }).catch(() => this.flash('ไฟล์ไม่ถูกต้อง'));
    ev.target.value = '';
  }
}));
Alpine.start();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw && nw.addEventListener('statechange', () => {
        if(nw.state === 'installed' && navigator.serviceWorker.controller) window.dispatchEvent(new Event('stocky-update'));
      });
    });
  }).catch(() => {});
}
