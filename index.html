<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stocky</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fdf2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stocky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
[x-cloak]{display:none!important}
html,body{
  -webkit-tap-highlight-color:transparent;
  touch-action:pan-x pan-y;
}
button,a,input,select,label{touch-action:pan-x pan-y}
/* iOS จะซูมเองเมื่อโฟกัสช่องที่ตัวอักษร <16px จึงบังคับ 16px บนมือถือ */
@media (max-width:640px){
  input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]):not([type=range]),select,textarea{font-size:16px!important}
}
.sk{background:linear-gradient(90deg,rgba(148,163,184,.18),rgba(148,163,184,.34),rgba(148,163,184,.18));background-size:200% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:1rem}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
.pb-safe{padding-bottom:env(safe-area-inset-bottom)}
button{transition:transform .14s cubic-bezier(.34,1.56,.64,1),background-color .15s,opacity .15s}
button:active{transform:scale(.94)}
.dot-bg{
  background-image:radial-gradient(var(--dot-color, rgba(244,114,182,.22)) 1.25px, transparent 1.25px);
  background-size:18px 18px;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}
.sparkle{animation:floatUp .95s ease-out forwards}
</style>
</head>
<body class="min-h-screen dot-bg transition-colors duration-200 selection:bg-pink-300/40" :class="ui.body" :style="ui.dotStyle" x-data="app" x-cloak>

<!-- ตั้งค่าครั้งแรก -->
<template x-if="!ready">
<div class="max-w-md mx-auto p-5 space-y-4" style="padding-top:calc(1.25rem + env(safe-area-inset-top))">
  <div class="flex items-center justify-between pt-2">
    <div class="flex items-center gap-2.5">
      <img src="icon-180.png" alt="Stocky" class="w-10 h-10 rounded-2xl object-cover shadow-xs">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Stocky</h1>
        <p class="text-xs opacity-65">ผู้ช่วยเช็กสต็อกของใช้ในบ้าน</p>
      </div>
    </div>
    <div class="flex gap-1.5">
      <template x-for="t in themes" :key="t.k">
        <button type="button" @click="setTheme(t.k)" class="w-7 h-7 rounded-full border-2" :class="[t.dot, theme===t.k?'border-slate-900 dark:border-white scale-110':'border-transparent opacity-70']" :title="t.n"></button>
      </template>
    </div>
  </div>

  <div class="rounded-3xl border p-4 space-y-3 shadow-xs" :class="ui.card">
    <p class="text-sm font-semibold">เริ่มต้นใช้งาน 1 นาที ✨</p>
    <label class="block text-xs font-medium opacity-80">ตั้งรหัสบ้าน (ยาวอย่างน้อย 8 ตัวอักษร เพื่อแชร์ข้อมูลกับคนในบ้าน)
      <input x-model="setup.code" placeholder="พิมพ์เอง หรือกดปุ่มสุ่มด้านล่าง" class="mt-1.5 w-full rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input">
    </label>
    <button type="button" @click="setup.code=genCode()" class="w-full py-2.5 rounded-2xl border text-xs font-semibold" :class="ui.softBtn">🎲 สุ่มรหัสบ้านที่เดายาก</button>
    <details class="rounded-2xl border p-3 text-xs" :class="ui.softBtn">
      <summary class="cursor-pointer font-semibold opacity-80">⚙️ ตั้งค่า Firebase Config (ใช้ค่าเริ่มต้นได้เลย)</summary>
      <textarea x-model="setup.cfg" rows="6" placeholder='{ apiKey: "...", databaseURL: "..." }' class="mt-2 w-full rounded-xl border p-2.5 font-mono text-[11px] outline-none" :class="ui.input"></textarea>
    </details>
    <p x-show="setup.err" class="text-red-500 text-xs font-semibold" x-text="setup.err"></p>
    <button type="button" @click="saveSetup()" class="w-full py-3.5 rounded-2xl font-bold text-base shadow-sm" :class="ui.primary">เข้าสู่บ้านของเรา 🚀</button>
  </div>
</div>
</template>

<template x-if="ready">
<div class="pb-32">
  <!-- HEADER -->
  <header class="sticky top-0 z-20 backdrop-blur border-b px-4 py-2.5 flex items-center justify-between" :class="ui.header" :style="'background-color:'+ui.headerBg+';padding-top:calc(.625rem + env(safe-area-inset-top))'">
    <img src="icon-180.png" alt="Stocky" class="w-8 h-8 rounded-xl object-cover">
    <div class="absolute inset-x-0 bottom-0 flex items-center justify-center px-24 pointer-events-none" style="top:env(safe-area-inset-top)">
      <h1 class="font-extrabold text-base tracking-tight truncate" :class="ui.accentText" x-text="houseName||'Stocky'"></h1>
    </div>
    <span class="text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1.5 font-medium border" :class="ui.softBtn" role="status">
      <i class="w-2 h-2 rounded-full" :class="online?'bg-emerald-500 animate-pulse':'bg-slate-400'"></i>
      <span :class="(!online||pending)?'':'hidden sm:inline'" x-text="online?(pending?'ซิงก์…':'ซิงก์แล้ว'):(pending?('รอส่ง '+pending):'ออฟไลน์')"></span>
    </span>
  </header>

  <!-- MyStock -->
  <section x-show="tab==='inv'" class="p-3 space-y-3 max-w-4xl mx-auto">

    <!-- โครงระหว่างรอข้อมูล -->
    <div x-show="!loaded" class="space-y-3" role="status" aria-busy="true">
      <span class="sr-only">กำลังโหลดข้อมูล…</span>
      <div class="sk h-[172px] !rounded-3xl"></div>
      <div class="sk h-11 !rounded-full"></div>
      <div class="flex gap-1.5">
        <div class="sk h-8 w-20 !rounded-full"></div><div class="sk h-8 w-24 !rounded-full"></div><div class="sk h-8 w-20 !rounded-full"></div>
      </div>
      <template x-for="n in 3" :key="n">
        <div class="rounded-3xl border p-3 space-y-3" :class="ui.card">
          <div class="flex gap-3 items-center">
            <div class="sk w-[72px] h-[72px] shrink-0"></div>
            <div class="flex-1 space-y-2">
              <div class="sk h-4 w-3/4"></div>
              <div class="sk h-4 w-1/3 !rounded-full"></div>
              <div class="sk h-2 w-full !rounded-full"></div>
            </div>
          </div>
          <div class="flex gap-2"><div class="sk h-10 w-28 !rounded-full"></div><div class="sk h-9 flex-1 !rounded-full"></div></div>
        </div>
      </template>
    </div>

    <div x-show="loaded" class="space-y-3">

    <!-- คำแนะนำเปิดครั้งแรก -->
    <div x-show="showTips" x-transition class="rounded-3xl border p-4 space-y-3" :class="ui.card">
      <div class="flex items-center gap-2.5">
        <img src="icon-180.png" alt="" class="w-9 h-9 rounded-xl object-cover">
        <p class="font-extrabold text-sm">ยินดีต้อนรับสู่ Stocky 👋</p>
      </div>
      <ul class="text-xs space-y-1.5 opacity-90">
        <li>➕ กดปุ่ม ＋ มุมขวาล่างเพื่อเพิ่มของ หรือสแกนบาร์โค้ดจากกล้อง</li>
        <li>➖ ทุกครั้งที่แกะของมาใช้ให้กด − ของใกล้หมดจะเข้า "ต้องซื้อเพิ่ม" ให้เอง</li>
        <li>💡 ใช้ไปสักพัก Stocky จะแนะนำค่า "เตือนเมื่อเหลือ" ตามที่คุณใช้จริง</li>
        <li>👨‍👩‍👧 ส่งรหัสบ้านให้คนในบ้าน (ในตั้งค่า) จะเห็นสต็อกชุดเดียวกัน</li>
      </ul>
      <button type="button" @click="dismissTips()" class="w-full py-2.5 rounded-2xl text-xs font-bold" :class="ui.primary">เข้าใจแล้ว</button>
    </div>

    <!-- สรุปภาพรวม -->
    <div class="rounded-3xl p-4 shadow-sm border" :class="ui.hero.box">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-xs font-semibold opacity-80">ของใช้ในบ้านทั้งหมด</p>
          <p class="mt-1 leading-none"><span class="text-4xl font-extrabold" x-text="list.length"></span><span class="text-sm font-bold opacity-80 ml-1.5">รายการ</span></p>
        </div>
        <div x-show="list.length" class="text-right rounded-2xl px-3 py-1.5" :class="ui.hero.badge">
          <p class="text-[11px] font-semibold opacity-80">พร้อมใช้</p>
          <p class="text-lg font-extrabold leading-tight"><span x-text="Math.round(pct('ok'))"></span>%</p>
        </div>
      </div>

      <div class="mt-3.5 h-2.5 rounded-full overflow-hidden flex" :class="ui.hero.track" role="img" aria-label="สัดส่วนสถานะสต็อก">
        <div class="h-full bg-emerald-400 transition-all duration-500" :style="'width:'+pct('ok')+'%'"></div>
        <div class="h-full bg-amber-400 transition-all duration-500" :style="'width:'+pct('low')+'%'"></div>
        <div class="h-full bg-rose-400 transition-all duration-500" :style="'width:'+pct('out')+'%'"></div>
      </div>

      <div class="mt-3 grid grid-cols-4 gap-1.5">
        <template x-for="f in [['all','ทั้งหมด','bg-slate-400'],['ok','มีของ','bg-emerald-500'],['low','ใกล้หมด','bg-amber-400'],['out','หมดแล้ว','bg-rose-500']]" :key="f[0]">
          <button type="button" @click="st=(st===f[0]&&f[0]!=='all')?'all':f[0]" class="rounded-2xl py-2 px-1 text-center" :class="st===f[0]?ui.hero.on:ui.hero.off">
            <span class="block text-lg font-extrabold leading-none" x-text="f[0]==='all'?list.length:countByState(f[0])"></span>
            <span class="mt-1 flex items-center justify-center gap-1 text-[11px] font-bold">
              <i class="inline-block w-1.5 h-1.5 rounded-full" :class="f[2]"></i><span x-text="f[1]"></span>
            </span>
          </button>
        </template>
      </div>
    </div>

    <!-- เตือนของใกล้หมดอายุ -->
    <button type="button" x-show="expSoon>0" @click="sortBy='exp';st='all';cat='all'" class="w-full rounded-2xl border px-3.5 py-2.5 flex items-center gap-2 text-xs font-bold text-left bg-amber-50 border-amber-300 text-amber-900 dark:bg-amber-950/40 dark:border-amber-700 dark:text-amber-200">
      <span class="text-base">⏰</span>
      <span x-text="expSoon+' รายการใกล้หรือเกินวันหมดอายุ'"></span>
      <span class="ml-auto underline shrink-0">ดูก่อนเลย ›</span>
    </button>

    <!-- ค้นหา + เรียงลำดับ -->
    <div class="space-y-2">
      <div class="relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 opacity-60 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input x-model="q" type="search" placeholder="ค้นหาชื่อ หมายเหตุ หรือบาร์โค้ด" class="w-full rounded-full border pl-10 pr-9 py-2.5 text-sm outline-none shadow-xs" :class="ui.input">
        <button type="button" x-show="q" @click="q=''" aria-label="ล้างคำค้นหา" class="absolute right-3 top-1/2 -translate-y-1/2 opacity-70 text-xs px-1">✕</button>
      </div>
      <div class="flex items-center justify-between gap-2 text-[11px]">
        <span class="font-semibold opacity-80 min-w-0">
          <span x-text="'แสดง '+filtered.length+' จาก '+list.length"></span>
          <button type="button" x-show="q||st!=='all'||cat!=='all'" @click="q='';st='all';cat='all'" class="ml-1.5 underline font-bold" :class="ui.accentText">ล้างตัวกรอง</button>
        </span>
        <div class="flex items-center gap-0.5 rounded-full border p-0.5 shrink-0" :class="ui.softBtn" role="group" aria-label="เรียงลำดับ">
          <span class="pl-2 pr-1 opacity-70">เรียง</span>
          <template x-for="o in [['name','ก-ฮ'],['stock','สต็อกน้อย'],['exp','หมดอายุ']]" :key="o[0]">
            <button type="button" @click="sortBy=o[0]" class="px-2.5 py-1 rounded-full font-semibold" :class="sortBy===o[0]?ui.chipActive:''" x-text="o[1]"></button>
          </template>
        </div>
      </div>
    </div>

    <!-- หมวดหมู่ -->
    <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5 items-center">
      <button type="button" @click="cat='all'" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border" :class="cat==='all'?ui.chipActive:ui.chip">✨ ทั้งหมด</button>
      <template x-for="c in allCats" :key="c.k">
        <button type="button" @click="cat=c.k" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border" :class="cat===c.k?ui.chipActive:ui.chip" x-text="c.e+' '+c.n"></button>
      </template>
      <button type="button" @click="openCatModal()" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border border-dashed" :class="ui.softBtn">＋ หมวด</button>
    </div>

    <!-- ไม่พบรายการ -->
    <div x-show="!filtered.length" class="rounded-3xl border p-8 text-center space-y-2" :class="ui.card">
      <img src="icon-180.png" alt="" class="w-20 h-20 mx-auto rounded-3xl shadow-sm">
      <p class="font-extrabold text-sm" x-text="list.length?'ไม่พบรายการที่ตรงกับตัวกรอง':'ยังไม่มีของใช้ในบ้านเลย'"></p>
      <p class="text-xs opacity-70" x-text="list.length?'ลองล้างตัวกรอง หรือเปลี่ยนคำค้นหา':'กดปุ่ม ＋ มุมขวาล่างเพื่อเพิ่มชิ้นแรกได้เลย'"></p>
      <button type="button" x-show="list.length&&(q||st!=='all'||cat!=='all')" @click="q='';st='all';cat='all'" class="mt-1 px-4 py-2 rounded-full text-xs font-bold" :class="ui.primary">ล้างตัวกรอง</button>
    </div>

    <!-- รายการแยกตามหมวดหมู่ -->
    <template x-for="c in allCats" :key="c.k">
      <div x-show="byCat(c.k).length" class="space-y-2">
        <div class="flex items-center justify-between pt-1 px-0.5">
          <h2 class="font-extrabold text-sm flex items-center gap-2">
            <span class="w-7 h-7 rounded-xl flex items-center justify-center text-sm border" :class="ui.thumb" x-text="c.e"></span>
            <span x-text="c.n"></span>
          </h2>
          <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold" :class="ui.pill" x-text="byCat(c.k).length+' ชิ้น'"></span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          <template x-for="i in byCat(c.k)" :key="i.id">
            <div class="rounded-3xl border p-3 flex flex-col gap-2.5 shadow-sm relative overflow-hidden" :class="ui.card">
              <div class="absolute left-0 inset-y-0 w-1.5" :class="stateMeta(i).bar"></div>

              <div class="flex gap-3 items-center cursor-pointer pl-1.5" role="button" tabindex="0" @click="openDetail(i)" @keydown.enter="openDetail(i)">
                <div class="w-[72px] h-[72px] shrink-0 rounded-2xl flex items-center justify-center text-3xl overflow-hidden border" :class="ui.thumb">
                  <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" loading="lazy" alt=""></template>
                  <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
                </div>

                <div class="min-w-0 flex-1 space-y-1.5">
                  <div class="flex items-start justify-between gap-2">
                    <p class="font-bold text-sm leading-snug break-words line-clamp-2" x-text="i.name"></p>
                    <span x-show="i.price>0" class="text-[11px] font-extrabold shrink-0 px-1.5 py-0.5 rounded-full" :class="ui.pill">฿<span x-text="fmt(i.price)"></span></span>
                  </div>

                  <div class="flex flex-wrap gap-1">
                    <span class="inline-block px-2 py-0.5 rounded-full text-[11px] font-bold leading-none" :class="stateMeta(i).badge" x-text="stateMeta(i).label"></span>
                    <span x-show="expMeta(i)" class="inline-block px-2 py-0.5 rounded-full text-[11px] font-bold leading-none" :class="expMeta(i)?.badge" x-text="expMeta(i)?.label"></span>
                  </div>

                  <div class="h-1.5 rounded-full bg-slate-200/80 dark:bg-zinc-700/80 overflow-hidden" role="img" :aria-label="'ระดับสต็อก '+level(i)+'%'">
                    <div class="h-full rounded-full transition-all duration-500" :class="stateMeta(i).bar" :style="'width:'+level(i)+'%'"></div>
                  </div>

                  <p x-show="i.note" class="text-[11px] opacity-70 truncate" x-text="'📝 '+i.note"></p>

                  <div class="flex items-center justify-between text-[11px] opacity-70">
                    <span x-text="i.lastOpened?'แกะ '+ago(i.lastOpened):'ยังไม่เคยแกะ'"></span>
                    <span x-show="Number(i.min)>0">เตือน ≤ <strong x-text="i.min"></strong></span>
                    <button type="button" x-show="!(Number(i.min)>0) && usage(i)" @click.stop="applyMin(i)" class="underline font-bold" :class="ui.accentText">💡 ตั้งเตือน ≤ <span x-text="usage(i)?.min"></span></button>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 pl-1.5">
                <div class="flex items-center gap-1 rounded-full p-0.5 border shrink-0" :class="ui.softBtn">
                  <button type="button" @click="dec(i)" aria-label="ลดจำนวน" class="w-8 h-8 rounded-full text-base font-extrabold flex items-center justify-center border" :class="ui.card">−</button>
                  <span class="min-w-8 text-center text-base font-extrabold" x-text="Number(i.qty)||0"></span>
                  <button type="button" @click="inc(i)" aria-label="เพิ่มจำนวน" class="w-8 h-8 rounded-full text-base font-extrabold flex items-center justify-center border" :class="ui.card">＋</button>
                </div>

                <button type="button" @click="save(i.id,{onList:!onList(i),snoozed:onList(i)})" class="flex-1 h-9 px-3 rounded-full text-[11px] font-bold border truncate" :class="onList(i)?'bg-amber-400/20 border-amber-400 text-amber-700 dark:text-amber-300':ui.softBtn" x-text="onList(i)?'🛒 ในลิสต์ ('+buyOf(i)+')':'＋ ใส่ลิสต์ซื้อ'"></button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- เลิกใช้แล้ว -->
    <div x-show="retiredList.length" class="pt-2">
      <button type="button" @click="showRetired=!showRetired" class="w-full py-3 rounded-2xl border text-xs font-semibold flex items-center justify-center gap-1.5 opacity-80" :class="ui.softBtn">
        <span>📦 เลิกใช้แล้ว (<span x-text="retiredList.length"></span>)</span>
        <span x-text="showRetired?'▲':'▼'"></span>
      </button>
      <div x-show="showRetired" x-transition class="mt-2 space-y-2">
        <template x-for="i in retiredList" :key="i.id">
          <div class="rounded-2xl border p-2.5 flex items-center gap-3 opacity-80" :class="ui.card">
            <button type="button" @click="openDetail(i)" class="flex items-center gap-3 min-w-0 flex-1 text-left">
              <div class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center text-lg overflow-hidden border" :class="ui.thumb">
                <template x-if="i.img"><img :src="i.img" class="w-full h-full object-cover" loading="lazy" alt=""></template>
                <template x-if="!i.img"><span x-text="catOf(i.cat).e"></span></template>
              </div>
              <span class="font-semibold text-sm truncate" x-text="i.name"></span>
            </button>
            <button type="button" @click="unretire(i)" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold border" :class="ui.softBtn">↩️ กลับมาใช้</button>
          </div>
        </template>
      </div>
    </div>
    </div>
  </section>

        </div>

        <div x-show="detailItem.note" class="rounded-2xl border px-3 py-2.5 text-sm" :class="ui.card">
          <p class="text-[11px] opacity-70 font-semibold mb-0.5">📝 หมายเหตุ</p>
          <p class="break-words whitespace-pre-line" x-text="detailItem.note"></p>
        </div>

        <div x-show="usage(detailItem)" class="rounded-2xl border px-3 py-2.5 text-xs flex items-center gap-2.5" :class="ui.softBtn">
          <span class="text-base">💡</span>
          <span class="flex-1">ใช้ราว <b x-text="Math.round((usage(detailItem)?.perWeek||0)*10)/10"></b> ชิ้น/สัปดาห์ แนะนำเตือนเมื่อเหลือ ≤ <b x-text="usage(detailItem)?.min"></b></span>
          <button type="button" x-show="usage(detailItem)?.min !== (Number(detailItem.min)||0)" @click="applyMin(detailItem)" class="shrink-0 px-3 py-1.5 rounded-full font-bold" :class="ui.primary">ใช้ค่านี้</button>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" x-show="detailItem.retired" @click="unretire(detailItem);detail=null" class="flex-1 py-3.5 rounded-2xl border text-xs font-bold" :class="ui.softBtn">↩️ กลับมาใช้อีก</button>
          <button type="button" x-show="!detailItem.retired" @click="save(detailItem.id,{onList:!onList(detailItem),snoozed:onList(detailItem)})" class="flex-1 py-3.5 rounded-2xl border text-xs font-bold" :class="onList(detailItem)?'bg-amber-400/20 border-amber-400 text-amber-700 dark:text-amber-300':ui.softBtn" x-text="onList(detailItem)?'🛒 เอาออกจากลิสต์':'＋ ใส่ลิสต์ซื้อ'"></button>
          <button type="button" @click="editFromDetail()" class="flex-[2] py-3.5 rounded-2xl font-extrabold shadow-sm" :class="ui.primary">✏️ แก้ไข</button>
        </div>
        <button type="button" x-show="!detailItem.retired" @click="cloneFrom(detailItem)" class="w-full py-2 text-xs font-semibold underline opacity-70">🧪 เพิ่มสูตร/กลิ่นใหม่จากรายการนี้</button>
        <button type="button" x-show="!detailItem.retired" @click="retire(detailItem);detail=null" class="w-full py-2 text-xs font-semibold underline opacity-70">🚫 ไม่ซื้อซ้ำแล้ว (เลิกใช้)</button>
      </div>
    </template>
  </div>

  <!-- Modal เพิ่ม/แก้ไขสินค้า -->
  <div x-show="!!f" class="fixed inset-0 z-40 bg-black/60 flex items-end justify-center" @click.self="closeForm()">
    <template x-if="!!f"><div class="w-full max-w-xl max-h-[92vh] overflow-y-auto rounded-t-3xl border-t p-4 space-y-3 pb-safe" :class="ui.modal">
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="font-extrabold text-lg" x-text="f && f.id ? '✏️ แก้ไขรายการ' : '✨ เพิ่มของใช้ใหม่'"></h3>
          <button type="button" @click="closeForm()" aria-label="ปิด" class="w-8 h-8 rounded-full flex items-center justify-center opacity-70">✕</button>
        </div>

        <input x-model="f.name" placeholder="ชื่อสินค้า เช่น สบู่เหลว, โฟมล้างหน้า *" class="w-full rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input" autocomplete="off">

        <!-- ของที่มีอยู่แล้ว (ช่วยพิมพ์ + กันเพิ่มซ้ำ) -->
        <div x-show="nameHints.length" class="rounded-2xl border overflow-hidden" :class="ui.softBtn">
          <p class="px-3 pt-2 text-[11px] font-bold" :class="nameExact?'text-amber-600 dark:text-amber-400':'opacity-80'" x-text="nameExact?'⚠️ มีรายการชื่อนี้อยู่แล้ว แตะเพื่อไปดูของเดิม':'มีของคล้ายกันอยู่แล้ว แตะเพื่อดูของเดิม'"></p>
          <template x-for="h in nameHints" :key="h.id">
            <div class="flex items-center gap-2 px-2 py-1">
              <button type="button" @click="pickHint(h)" class="flex items-center gap-2.5 min-w-0 flex-1 text-left py-1">
                <span class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center border text-base overflow-hidden" :class="ui.thumb">
                  <template x-if="h.img"><img :src="h.img" class="w-full h-full object-cover" alt=""></template>
                  <template x-if="!h.img"><span x-text="catOf(h.cat).e"></span></template>
                </span>
                <span class="min-w-0">
                  <span class="block text-sm font-bold truncate" x-text="h.name"></span>
                  <span class="block text-[11px] opacity-70" x-text="h.retired?'🚫 เลิกใช้แล้ว':('เหลือ '+(Number(h.qty)||0))"></span>
                </span>
              </button>
              <button type="button" @click="useHint(h)" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold border" :class="ui.card">ใช้ชื่อนี้</button>
            </div>
          </template>
        </div>

        <div class="flex gap-2">
          <select x-model="f.cat" x-effect="allCats.length; f && f.cat; $nextTick(() => { if(f) $el.value = f.cat; })" class="flex-1 rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input">
            <template x-for="c in allCats" :key="c.k">
              <option :value="c.k" :selected="f && c.k === f.cat" x-text="c.e+' '+c.n"></option>
            </template>
          </select>
          <button type="button" @click="openCatModal()" class="px-3.5 rounded-2xl border text-xs font-bold shrink-0" :class="ui.softBtn">＋ หมวด</button>
        </div>

        <div class="flex gap-2">
          <input x-model="f.barcode" placeholder="เลขบาร์โค้ด (สแกนหรือพิมพ์)" inputmode="numeric" class="flex-1 min-w-0 rounded-2xl border p-3.5 text-sm outline-none" :class="ui.input">
          <button type="button" @click="openScan(true)" aria-label="สแกนบาร์โค้ดใส่ช่องนี้" class="px-4 rounded-2xl border text-lg" :class="ui.softBtn">📷</button>
          <button type="button" @click="lookupInto(f.barcode)" aria-label="ค้นหาชื่อสินค้าจากบาร์โค้ด" class="px-4 rounded-2xl border text-lg" :class="ui.softBtn">🔎</button>
        </div>

        <!-- บาร์โค้ดอื่นของสินค้านี้ (ล็อต / ขนาด / แพ็ก) -->
        <div class="space-y-2">
          <template x-for="(c, ci) in f.codes" :key="ci">
            <div class="rounded-2xl border p-2.5 space-y-1.5" :class="ui.softBtn">
              <div class="flex gap-1.5">
                <input x-model="c.code" inputmode="numeric" placeholder="เลขบาร์โค้ดอื่น" class="flex-1 min-w-0 rounded-xl border p-2.5 text-sm outline-none" :class="ui.input">
                <button type="button" @click="f.codes.splice(ci,1)" aria-label="ลบเลขนี้" class="w-10 rounded-xl border text-sm" :class="ui.card">✕</button>
              </div>
              <div class="flex items-center gap-1.5">
                <input x-model="c.label" maxlength="20" placeholder="ป้าย เช่น ล็อตใหม่ / 500 มล. / แพ็ก" class="flex-1 min-w-0 rounded-xl border p-2.5 text-sm outline-none" :class="ui.input">
                <span class="text-[11px] font-semibold shrink-0">ได้</span>
                <input x-model.number="c.units" type="number" min="1" inputmode="numeric" class="w-16 rounded-xl border p-2.5 text-sm font-bold text-center outline-none" :class="ui.input">
                <span class="text-[11px] font-semibold shrink-0">ชิ้น</span>
              </div>
              <div class="flex gap-1.5">
                <template x-for="l in ['ล็อตใหม่','ขนาดอื่น','แพ็ก']" :key="l">
                  <button type="button" @click="c.label=l" class="px-2.5 py-0.5 rounded-full border text-[11px] font-semibold" :class="c.label===l?ui.chipActive:ui.chip" x-text="l"></button>
                </template>
              </div>
            </div>
          </template>
          <div class="flex gap-2">
            <button type="button" @click="f.codes.push({code:'',label:'',units:1})" class="flex-1 py-2 rounded-xl border border-dashed text-xs font-bold" :class="ui.softBtn">＋ บาร์โค้ดอื่นของสินค้านี้ (ล็อต / ขนาด / แพ็ก)</button>
            <button type="button" @click="openScan('code')" aria-label="สแกนบาร์โค้ดอื่น" class="px-3.5 rounded-xl border text-base" :class="ui.softBtn">📷</button>
          </div>
        </div>

        <div x-show="lookup.busy||lookup.src||lookup.miss" class="text-[11px] font-semibold rounded-xl px-3 py-2 space-y-1" :class="ui.softBtn">
          <div class="flex items-center gap-2">
            <span x-show="lookup.busy" class="inline-block w-3 h-3 rounded-full border-2 border-current border-t-transparent animate-spin"></span>
            <span class="flex-1" x-text="lookup.busy?'กำลังค้นหาชื่อสินค้า…':(lookup.src?('✨ เติมข้อมูลจาก '+lookup.src+' กรุณาตรวจและแก้ไขได้'):'ไม่พบข้อมูลสินค้านี้ กรอกชื่อเองได้เลย')"></span>
            <button type="button" x-show="lookup.miss" @click="lookupInto(f.barcode)" class="underline font-bold shrink-0">ลองอีกครั้ง</button>
          </div>
          <p x-show="lookup.miss&&lookup.detail" class="font-normal opacity-70 break-words" x-text="lookup.detail"></p>
        </div>

        <div class="flex gap-3 items-center">
          <div class="w-20 h-20 shrink-0 rounded-2xl flex items-center justify-center text-3xl overflow-hidden border" :class="ui.thumb">
            <template x-if="f && f.img"><img :src="f.img" class="w-full h-full object-cover" alt=""></template>
            <template x-if="f && !f.img"><span x-text="catOf(f.cat).e"></span></template>
          </div>
          <div class="flex-1 space-y-2 min-w-0">
            <input x-model="f.imgUrl" @change="urlImg()" placeholder="วางลิงก์รูปภาพ (URL)" class="w-full rounded-xl border p-2.5 text-xs outline-none" :class="ui.input">
            <div class="flex gap-2">
              <label class="flex-1 text-center py-2 rounded-xl border text-xs font-semibold cursor-pointer" :class="ui.softBtn">📸 ถ่าย/เลือกรูป
                <input type="file" accept="image/*" class="hidden" @change="pickImg($event)">
              </label>
              <button type="button" x-show="f && f.img" @click="f.img='';f.imgUrl=''" class="px-3 rounded-xl border text-xs" :class="ui.softBtn">ลบรูป</button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-xs">
          <label class="font-semibold">คงเหลือตอนนี้
            <input x-model.number="f.qty" type="number" min="0" inputmode="numeric" class="mt-1 w-full rounded-2xl border p-3 text-base font-bold outline-none" :class="ui.input">
          </label>
          <label class="font-semibold">เตือนเมื่อเหลือ ≤ <span class="font-normal opacity-70 text-[11px]">(0 = ไม่เตือน)</span>
            <input x-model.number="f.min" type="number" min="0" inputmode="numeric" class="mt-1 w-full rounded-2xl border p-3 text-base font-bold outline-none" :class="ui.input">
          </label>
          <label class="font-semibold">ราคา/ชิ้น (฿)
            <input x-model.number="f.price" type="number" min="0" inputmode="decimal" class="mt-1 w-full rounded-2xl border p-3 text-base font-bold outline-none" :class="ui.input">
          </label>
        </div>

        <div x-show="f.id && usage(f) && usage(f).min !== (Number(f.min)||0)" class="rounded-2xl border px-3 py-2.5 text-xs flex items-center gap-2.5" :class="ui.softBtn">
          <span class="text-base">💡</span>
          <span class="flex-1">จากที่แกะของชิ้นนี้ราว <b x-text="Math.round((usage(f)?.perWeek||0)*10)/10"></b> ชิ้น/สัปดาห์ แนะนำให้เตือนเมื่อเหลือ ≤ <b x-text="usage(f)?.min"></b> (พอใช้ราว 7 วัน)</span>
          <button type="button" @click="f.min=usage(f).min" class="shrink-0 px-3 py-1.5 rounded-full font-bold" :class="ui.primary">ใช้ค่านี้</button>
        </div>

        <label class="block text-xs font-semibold">ซื้อครั้งละ (ชิ้น) <span class="font-normal opacity-70 text-[11px]">เว้นว่าง = ให้แอปคำนวณให้</span>
          <input x-model.number="f.buyEach" type="number" min="0" inputmode="numeric" placeholder="อัตโนมัติ" class="mt-1 w-full rounded-2xl border p-3 text-base font-bold outline-none" :class="ui.input">
        </label>

        <div class="rounded-2xl p-2.5 border flex items-center justify-between text-xs" :class="ui.softBtn">
          <span>สถานะอัตโนมัติ:</span>
          <span class="px-2.5 py-1 rounded-full font-bold" :class="stateMeta(f).badge" x-text="stateMeta(f).label"></span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
          <label class="font-semibold">วันหมดอายุ (ชิ้นที่หมดก่อน)
            <input x-model="f.exp" type="date" class="mt-1 w-full rounded-2xl border p-3 text-sm outline-none" :class="ui.input">
          </label>
          <label class="font-semibold">หมายเหตุ
            <input x-model="f.note" type="text" placeholder="เช่น สูตรอ่อนโยน, ชั้นล่างตู้เย็น" class="mt-1 w-full rounded-2xl border p-3 text-sm outline-none" :class="ui.input">
          </label>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" x-show="f && f.id" @click="del()" class="px-4 py-3.5 rounded-2xl border border-rose-400 text-rose-500 font-bold">🗑</button>
          <button type="button" @click="closeForm()" class="flex-1 py-3.5 rounded-2xl border font-semibold" :class="ui.softBtn">ยกเลิก</button>
          <button type="button" @click="commit()" class="flex-[2] py-3.5 rounded-2xl font-extrabold shadow-sm" :class="ui.primary">บันทึก</button>
        </div>
      </div>
    </div></template>
  </div>

  <!-- Modal เพิ่ม/แก้ไขหมวดหมู่ + เลือกอีโมจิ -->
  <div x-show="!!catForm" class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center" @click.self="catForm=null">
    <template x-if="!!catForm"><div class="w-full max-w-xl rounded-t-3xl border-t p-4 space-y-3 pb-safe" :class="ui.modal">
      <div class="flex items-center justify-between">
        <h3 class="font-extrabold text-base" x-text="catForm.isEdit?'✏️ แก้ไขหมวดหมู่':'✨ เพิ่มหมวดหมู่ใหม่'"></h3>
        <button type="button" @click="catForm=null" aria-label="ปิด" class="w-8 h-8 rounded-full flex items-center justify-center opacity-70">✕</button>
      </div>
      <div class="flex gap-2">
        <input x-model="catForm.e" maxlength="4" placeholder="อีโมจิ" class="w-16 text-center text-2xl rounded-2xl border p-2.5 outline-none" :class="ui.input">
        <input x-model="catForm.n" placeholder="ชื่อหมวด เช่น ของใช้สัตว์เลี้ยง, ยาสามัญ" class="flex-1 rounded-2xl border p-3 text-sm outline-none" :class="ui.input">
      </div>
      <div>
        <p class="text-[11px] opacity-65 mb-1.5">แตะเลือกอีโมจิด่วน:</p>
        <div class="grid grid-cols-8 gap-1.5">
          <template x-for="em in emojiChoices" :key="em">
            <button type="button" @click="catForm.e=em" class="h-10 rounded-xl border text-xl flex items-center justify-center" :class="catForm.e===em?ui.chipActive:ui.softBtn" x-text="em"></button>
          </template>
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button type="button" @click="catForm=null" class="flex-1 py-3 rounded-2xl border font-semibold text-sm" :class="ui.softBtn">ยกเลิก</button>
        <button type="button" @click="saveCat()" class="flex-[2] py-3 rounded-2xl font-extrabold text-sm" :class="ui.primary">บันทึกหมวดหมู่</button>
      </div>
    </div></template>
  </div>

  <!-- สแกนเนอร์ (ปุ่มไฟฉายอยู่ตรงกลางครึ่งล่าง ระยะนิ้วโป้งกด) -->
  <div x-show="scan" class="fixed inset-0 z-50 bg-black flex flex-col justify-between p-4 pb-safe gap-3">
    <div class="flex items-center justify-between gap-2 text-white">
      <span class="text-sm font-bold shrink-0">📷 สแกนบาร์โค้ด</span>
      <button type="button" @click="closeScan()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/15 text-white border border-white/25">✕ ปิด</button>
    </div>

    <div class="relative w-full flex-1 flex items-center justify-center overflow-hidden rounded-2xl bg-zinc-950">
      <div :id="readerId" class="w-full h-full"></div>
      <div class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
        <div class="w-[90%] max-w-80 h-36 rounded-2xl border-2 border-pink-400 shadow-[0_0_0_9999px_rgba(0,0,0,0.45)] relative overflow-hidden">
          <div class="absolute inset-x-2 top-1/2 h-0.5 bg-rose-500/80"></div>
        </div>
      </div>
    </div>

    <!-- โซนครึ่งล่างตรงกลาง: ปุ่มไฟฉายระยะนิ้วโป้งกด + คำแนะนำ -->
    <div class="space-y-2.5 pt-1">
      <p class="text-white text-center text-xs opacity-85" x-text="scanMsg"></p>
      <div class="flex justify-center">
        <button type="button" @click="toggleTorch()" class="w-full max-w-xs py-3.5 px-6 rounded-2xl text-base font-extrabold border-2 shadow-lg flex items-center justify-center gap-2" :class="torchOn?'bg-amber-400 text-slate-950 border-amber-200':'bg-zinc-900/95 text-white border-white/40'" x-text="torchOn?'🔦 ปิดไฟฉาย':'🔦 เปิดไฟฉาย'"></button>
      </div>
      <button type="button" @click="closeScan()" class="w-full py-3 rounded-2xl bg-white text-slate-900 font-extrabold text-sm">ปิดกล้อง</button>
    </div>
  </div>

  <!-- ผลสแกนเจอสินค้าเดิม -->
  <div x-show="hit" class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center" @click.self="hit=null">
    <template x-if="hit&&items[hit]">
      <div class="w-full max-w-xl rounded-t-3xl border-t p-5 space-y-4 pb-safe" :class="ui.modal">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs opacity-70">พบสินค้าในคลัง</p>
            <p class="text-xl font-extrabold" x-text="items[hit].name"></p>
          </div>
          <span class="px-3 py-1 rounded-full text-xs font-bold" :class="stateMeta(items[hit]).badge" x-text="stateMeta(items[hit]).label"></span>
        </div>
        <div x-show="hitInfo&&hitInfo.id===hit&&(hitInfo.label||hitInfo.units>1)" class="rounded-2xl border p-3 flex items-center gap-3" :class="ui.softBtn">
          <div class="flex-1 text-xs min-w-0">
            <p class="font-bold" x-text="'สแกนเลขของ: '+(hitInfo&&hitInfo.label?hitInfo.label:'ขนาด/ล็อตอื่น')"></p>
            <p class="opacity-70" x-text="'= '+(hitInfo?hitInfo.units:1)+' ชิ้นต่อครั้ง'"></p>
          </div>
          <button type="button" @click="incBy({id:hit,...items[hit]}, hitInfo.units)" class="shrink-0 px-4 py-2.5 rounded-2xl font-extrabold text-sm" :class="ui.primary" x-text="'＋'+(hitInfo?hitInfo.units:1)+' ชิ้น'"></button>
        </div>
        <div class="flex items-center justify-center gap-6 py-2">
          <button type="button" @click="dec({id:hit,...items[hit]})" aria-label="ลดจำนวน" class="w-16 h-16 rounded-2xl border text-3xl font-extrabold" :class="ui.stepBtn">−</button>
          <div class="text-center">
            <span class="text-4xl font-extrabold" x-text="Number(items[hit].qty)||0"></span>
            <span x-show="Number(items[hit].min)>0" class="block text-xs opacity-70 mt-1">ขั้นต่ำ <span x-text="items[hit].min"></span></span>
          </div>
          <button type="button" @click="inc({id:hit,...items[hit]})" aria-label="เพิ่มจำนวน" class="w-16 h-16 rounded-2xl border text-3xl font-extrabold" :class="ui.stepBtn">＋</button>
        </div>
        <button type="button" @click="hit=null" class="w-full py-4 rounded-2xl font-extrabold" :class="ui.primary">เสร็จสิ้น ✨</button>
      </div>
    </template>
  </div>

  <!-- สแกนเจอเลขที่ยังไม่มี: สินค้าใหม่ หรือผูกกับของเดิม -->
  <div x-show="!!choice" class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center" @click.self="choice=null">
